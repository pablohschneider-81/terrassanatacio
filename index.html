  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body { background: var(--bg); background-image: radial-gradient(ellipse at 15% 15%, rgba(190,220,247,0.50) 0%, transparent 55%), radial-gradient(ellipse at 85% 80%, rgba(206,228,247,0.42) 0%, transparent 65%), radial-gradient(ellipse at 88% 12%, rgba(190,220,247,0.38) 0%, transparent 60%); background-attachment: fixed; color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }

  /* En modo PWA (pantalla completa), respetar notch y barra inferior */

  }

  /* ── NEON KEYFRAMES ── */
  @keyframes neon-pulse { 0%,100%{box-shadow:0 0 6px 1px rgba(52,152,219,0.5),0 0 18px 2px rgba(52,152,219,0.2)} 50%{box-shadow:0 0 10px 2px rgba(52,152,219,0.8),0 0 28px 6px rgba(52,152,219,0.35)} }
  @keyframes neon-pulse-gold { 0%,100%{box-shadow:0 0 6px 1px rgba(240,192,64,0.5),0 0 18px 2px rgba(240,192,64,0.2)} 50%{box-shadow:0 0 10px 2px rgba(240,192,64,0.8),0 0 28px 6px rgba(240,192,64,0.35)} }
  @keyframes neon-pulse-red { 0%,100%{box-shadow:0 0 6px 1px rgba(231,76,60,0.5),0 0 18px 2px rgba(231,76,60,0.2)} 50%{box-shadow:0 0 10px 2px rgba(231,76,60,0.8),0 0 28px 6px rgba(231,76,60,0.35)} }
  @keyframes grid-scroll { from{transform:perspective(600px) rotateX(40deg) translateY(0)} to{transform:perspective(600px) rotateX(40deg) translateY(60px)} }
  @keyframes pin-pulse { 0%{transform:scale(1);box-shadow:0 0 0 0 rgba(52,152,219,0.6)} 60%{transform:scale(0.93);box-shadow:0 0 0 12px rgba(52,152,219,0)} 100%{transform:scale(1);box-shadow:0 0 0 0 rgba(52,152,219,0)} }
  @keyframes logo-glow { 0%,100%{text-shadow:0 0 8px rgba(52,219,180,0.5),0 0 24px rgba(52,219,180,0.2)} 50%{text-shadow:0 0 16px rgba(52,219,180,0.9),0 0 40px rgba(52,219,180,0.35)} }

  /* LOGIN */
  .login-screen {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px; gap: 32px;
    position: relative; overflow: hidden;
    background: linear-gradient(160deg, #e4edf5 0%, #eaf1f8 35%, #e6eef6 65%, #e2ecf5 100%);
  }
  .login-screen::before { display: none; }
  .login-screen::after { display: none; }
  /* ONDAS DE AGUA */
  .login-wave { position: absolute; bottom: 0; left: -10%; width: 120%; pointer-events: none; z-index: 0; }
  .login-wave svg { display: block; width: 100%; }
  .login-wave.w1 { bottom: -10px; animation: wave-drift 7s ease-in-out infinite; opacity: 0.35; }
  .login-wave.w2 { bottom: -20px; animation: wave-drift2 9s ease-in-out infinite; opacity: 0.25; }
  .login-wave.w3 { bottom: -5px; animation: wave-drift 11s ease-in-out infinite reverse; opacity: 0.18; }
  /* BURBUJAS */
  .login-bubble { position: absolute; border-radius: 50%; aspect-ratio: 1; background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.75) 0%, rgba(255,255,255,0.25) 50%, rgba(200,225,245,0.15) 100%); border: 1px solid rgba(255,255,255,0.6); box-shadow: inset 0 0 8px rgba(255,255,255,0.4), 0 2px 8px rgba(150,190,220,0.2); animation: bubble-rise linear infinite; pointer-events: none; backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); }

  }

  }
  /* CARD */
  .login-card { animation: card-rise 0.8s cubic-bezier(0.22,1,0.36,1) 0.25s both; z-index: 1; }
  /* SHIMMER en TERRASSA */
  .login-logo-terrassa {
    display: block;
    font-family: 'Exo 2', sans-serif;
    font-size: 2.8rem; font-weight: 900; font-style: italic;

  }
  .login-logo {
    font-family: 'Exo 2', sans-serif;
    font-size: 1.1rem; font-weight: 700; letter-spacing: 4px;
    color: #1a4a6a; text-transform: uppercase; text-align: center;
    position: relative; z-index: 1;

  }

  }
  .login-card {
    background: linear-gradient(135deg, rgba(255,255,255,0.62) 0%, rgba(255,255,255,0.35) 100%);

  /* BOTONES */

  /* LIQUID GLASS — LOGIN: selector de nombre y botones (solo dentro de .login-screen) */

    appearance: none; -webkit-appearance: none;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.85) 0%, rgba(255,255,255,0) 42%),
      linear-gradient(160deg, rgba(255,255,255,0.4) 0%, rgba(210,230,245,0.28) 60%, rgba(180,215,240,0.3) 100%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9'><path d='M1 1l6 6 6-6' stroke='%232a4a68' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>") no-repeat right 16px center;
    background-size: auto, auto, 14px 9px;

      linear-gradient(180deg, rgba(255,255,255,0.75) 0%, rgba(255,255,255,0) 40%),

      inset 0 1.5px 0 rgba(255,255,255,0.85),

      linear-gradient(180deg, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0) 45%),

    border-color: rgba(255,255,255,0.75);
    color: var(--text);
    backdrop-filter: blur(18px) saturate(180%);
    -webkit-backdrop-filter: blur(18px) saturate(180%);
    box-shadow:
      0 8px 20px rgba(60,110,160,0.18),

      inset 0 -10px 14px rgba(120,170,210,0.14);

  .btn-danger {

    border-color: rgba(231,76,60,0.5);

  }
  .btn-danger:active { transform: scale(0.97); animation: none; }
  .btn-sm { padding: 8px 14px; font-size: 0.85rem; width: auto; display: inline-block; }

  /* PIN */
  .pin-screen { display: flex; flex-direction: column; align-items: center; gap: 24px; padding: 40px 24px; }
  .pin-dots { display: flex; gap: 16px; }
  .pin-dot {
    width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid var(--accent2);
    background: transparent;
    transition: background 0.15s, box-shadow 0.15s;
  }
  .pin-dot.filled {
    background: var(--accent2);
    box-shadow: 0 0 10px rgba(52,152,219,0.7);
  }
  .pin-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; width: 100%; max-width: 280px; }
  .pin-btn {
    background: rgba(16,37,88,0.6);
    border: 1px solid rgba(52,152,219,0.3);
    color: #fff;
    font-size: 1.5rem; font-weight: 700;
    padding: 20px;
    border-radius: 50%;
    cursor: pointer;
    transition: background 0.12s, box-shadow 0.12s;
    text-align: center;
    aspect-ratio: 1;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 8px rgba(52,152,219,0.1);
  }
  .pin-btn:active {
    animation: pin-pulse 0.3s ease-out;
    background: rgba(41,128,185,0.4);
    box-shadow: 0 0 20px rgba(52,152,219,0.5);
  }
  .pin-error { color: var(--red2); font-size: 0.85rem; text-shadow: 0 0 8px rgba(231,76,60,0.5); }
  .pin-error { color: var(--red2); font-size: 0.85rem; }

  /* HEADER */
  .header {
    background: rgba(200,218,232,0.55);
    backdrop-filter: blur(24px) saturate(160%);

  .badge-coach {

  /* NAV - píldora flotante glass, estilo Instagram */
  .bottom-nav {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    width: calc(100% - 28px); max-width: 452px;
    background: rgba(255,255,255,0.55);

    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.85);

    display: flex; align-items: center; justify-content: center;

  /* CONTENT */
  .content { padding: 16px 16px 90px; flex: 1; background: transparent; }

    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(20px) saturate(160%);

    border: 1px solid var(--border);
    border-radius: 12px; padding: 16px; margin-bottom: 12px;

  .card-title { font-size: 0.9rem; font-weight: 700; margin-bottom: 4px; color: var(--text); }

  /* FORM */
  label.field-label { display: block; font-size: 0.75rem; font-weight: 600; color: var(--text2); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; margin-top: 14px; }

  /* ALPHA GRID */
  .alpha-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .alpha-btn {
    background: rgba(16,37,88,0.5); border: 1px solid rgba(52,152,219,0.2);

  .alpha-btn.selected {

    animation: neon-pulse-gold 2.5s ease-in-out infinite;

  /* METER STATS */
  .meter-stat { font-size: 0.78rem; color: var(--accent2); margin-top: 4px; }

  .pack-btn.active {
    background: linear-gradient(135deg, rgba(41,128,185,0.4), rgba(52,152,219,0.3));
    border-color: var(--accent2); color: #fff;
    box-shadow: 0 0 10px rgba(52,152,219,0.3), inset 0 0 8px rgba(52,152,219,0.1);
    text-shadow: 0 0 8px rgba(52,152,219,0.6);
  }

  /* ACTION BUTTONS */
  .actions-row { display: flex; gap: 10px; margin-top: 16px; }

  /* RPE TABLE */
  .rpe-table { width: 100%; border-collapse: collapse; background: transparent; }
  .rpe-table th { font-size: 0.7rem; color: var(--red2); text-align: left; padding: 6px 8px; letter-spacing: 1px; text-transform: uppercase; border-bottom: 1px solid var(--border); background: transparent; }

  .rpe-circle { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; font-weight: 700; color: #fff; }
  .fatigue-label { font-size: 0.75rem; padding: 2px 8px; border-radius: 10px; font-weight: 600; white-space: nowrap; }
  .delta { font-size: 0.8rem; font-weight: 600; }
  .delta.good { color: var(--green); }
  .delta.warn { color: #f39c12; }
  .delta.bad { color: var(--red2); }
  .comment-btn { background: transparent; border: none; font-size: 1.1rem; cursor: pointer; padding: 4px; }
  .no-data { color: var(--text2); font-size: 0.85rem; text-align: center; padding: 20px; }

  /* RPE SUMMARY */
  .summary-row { display: flex; gap: 10px; margin-bottom: 16px; }

               linear-gradient(155deg, rgba(255,255,255,0.34) 0%, rgba(255,255,255,0.12) 55%, rgba(255,255,255,0.24) 100%);
    --lg-fill-strong: linear-gradient(155deg, rgba(255,255,255,0.66) 0%, rgba(255,255,255,0.40) 100%);
    --lg-blur: blur(28px) saturate(210%) brightness(1.06);
    --lg-shadow: 0 18px 40px -18px rgba(18,60,110,0.38), 0 2px 6px -2px rgba(18,60,110,0.12),
                 inset 0 1px 1px rgba(255,255,255,0.85), inset 0 -1px 1px rgba(255,255,255,0.25);
    --lg-shadow-sm: 0 10px 24px -12px rgba(18,60,110,0.34), inset 0 1px 1px rgba(255,255,255,0.85), inset 0 -1px 1px rgba(255,255,255,0.2);
    --lg-edge: linear-gradient(135deg, #fff 0%, rgba(255,255,255,0.55) 18%, rgba(255,255,255,0.06) 45%, rgba(255,255,255,0.10) 60%, rgba(255,255,255,0.6) 85%, #fff 100%);
    --r-lg: 26px; --r-md: 20px; --r-sm: 14px;
  }

  /* Fondo con más color: manchas suaves de agua, menta y lavanda para que el vidrio tenga qué mostrar */
  body {
    background-color: #dfeefb;
    background-image:
      radial-gradient(60% 45% at 8% 6%, rgba(70,165,255,0.70) 0%, transparent 70%),
      radial-gradient(55% 40% at 95% 22%, rgba(60,215,195,0.58) 0%, transparent 70%),
      radial-gradient(50% 40% at 12% 58%, rgba(140,125,255,0.40) 0%, transparent 70%),
      radial-gradient(60% 45% at 92% 82%, rgba(40,135,255,0.55) 0%, transparent 70%),
      radial-gradient(45% 35% at 45% 105%, rgba(90,225,215,0.50) 0%, transparent 70%);
    background-attachment: fixed;
  }

  /* ---------- Vidrio: más transparente, más desenfoque y reflejo en el borde ---------- */
  .card, .welcome-card, .day-card, .hist-row, .summary-box, .stat-box, .acwr-card, .insc-stat,
  .insc-matrix-wrap, .athlete-item, .comp-item, .hist-date-section, .login-card, .cal-grid {
    background: var(--lg-fill) !important;
    backdrop-filter: var(--lg-blur) !important;
    -webkit-backdrop-filter: var(--lg-blur) !important;
    border: 1px solid rgba(255,255,255,0.35) !important;
    box-shadow: var(--lg-shadow) !important;
    position: relative;
  }
  .summary-box, .stat-box, .acwr-card, .insc-stat, .athlete-item, .comp-item { box-shadow: var(--lg-shadow-sm) !important; }
  .card, .welcome-card, .login-card, .cal-grid { border-radius: var(--r-lg) !important; }
  .day-card, .hist-row, .hist-date-section, .insc-matrix-wrap, .summary-box, .stat-box, .athlete-item, .comp-item, .insc-stat { border-radius: var(--r-md) !important; }
  /* Reflejo: borde brillante arriba-izquierda y abajo-derecha, como un cristal real */
  .card::before, .welcome-card::before, .login-card::before, .day-card::before, .hist-row::before,
  .summary-box::before, .stat-box::before, .insc-stat::before, .cal-grid::before, .athlete-item::before {
    content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1.6px; pointer-events: none;
    background: var(--lg-edge);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
  }
  /* Casillas dentro de las tarjetas: vidrio más claro */
  .hero-blk, .acwr-stats div, .bw-metrics div, .chart-a .chips div, .s4 div, .week-a .d i:not(.done) {
    background: rgba(255,255,255,0.42) !important;
    border: 1px solid rgba(255,255,255,0.55);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.7);
  }

  /* ---------- Cabecera: vidrio fino que deja ver lo que pasa por debajo ---------- */
  .header {
    background: linear-gradient(180deg, rgba(240,248,255,0.55), rgba(240,248,255,0.25)) !important;
    backdrop-filter: blur(30px) saturate(200%) !important; -webkit-backdrop-filter: blur(30px) saturate(200%) !important;
    border-bottom: 1px solid rgba(255,255,255,0.5) !important;
  }
  .btn-exit { border-radius: 99px !important; background: var(--lg-fill-strong) !important; border: 1px solid rgba(255,255,255,0.7) !important;
    backdrop-filter: var(--lg-blur); -webkit-backdrop-filter: var(--lg-blur); box-shadow: var(--lg-shadow-sm) !important; }
  .hdr-avatar { box-shadow: 0 6px 16px -6px rgba(10,132,255,0.6), inset 0 1px 1px rgba(255,255,255,0.7); }

  /* ---------- Barra inferior: cápsula de vidrio flotante ---------- */
  .bottom-nav {
    bottom: calc(12px + env(safe-area-inset-bottom, 0px)) !important; margin-bottom: 0 !important;
    width: calc(100% - 28px) !important; border-radius: 999px !important; padding: 5px !important;
    background: linear-gradient(160deg, rgba(255,255,255,0.50), rgba(255,255,255,0.24)) !important;
    backdrop-filter: blur(24px) saturate(220%) brightness(1.08) !important; -webkit-backdrop-filter: blur(24px) saturate(220%) brightness(1.08) !important;
    border: 1px solid rgba(255,255,255,0.45) !important;
    box-shadow: 0 20px 44px -16px rgba(18,60,110,0.45), inset 0 1px 1px rgba(255,255,255,0.95), inset 0 -1px 1px rgba(255,255,255,0.3) !important;
  }
  .bottom-nav::before { content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1.2px; pointer-events: none; background: var(--lg-edge);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
  .bottom-nav.labeled .nav-item { border-radius: 999px !important; min-width: 0; padding: 0 4px; transition: flex-grow 0.25s ease, background 0.2s, box-shadow 0.2s, color 0.2s; }
  /* La pestaña activa se ensancha un poco para que su nombre entero quede dentro del azul (p. ej. "Calendario") */
  .bottom-nav.labeled .nav-item.active { flex-grow: 1.45; }
  .bottom-nav.labeled .nav-lbl { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  /* Pestaña activa: gota de vidrio azul con brillo, como en iOS */
  .bottom-nav.labeled .nav-item.active {
    background: radial-gradient(120% 90% at 30% 15%, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0) 45%),
                linear-gradient(180deg, #3d9bff 0%, #0a7cff 60%, #0866d9 100%) !important;
    box-shadow: 0 8px 20px -6px rgba(10,132,255,0.75), inset 0 1px 1px rgba(255,255,255,0.8), inset 0 -2px 4px rgba(0,40,120,0.25) !important;
  }
  .nav-more { border-radius: 26px !important; background: linear-gradient(160deg, rgba(255,255,255,0.72), rgba(255,255,255,0.48)) !important; }
  .nav-more-item { border-radius: 18px !important; }

  /* ---------- Botones: cápsulas de vidrio ---------- */
  .btn, .btn-primary, .btn-secondary, .btn-danger, .rpe-menu-cancel, .insc-share button, .insc-toggle { border-radius: 999px !important; }
  .btn-primary, .btn-primary:active, .insc-share .share {
    background: radial-gradient(120% 100% at 30% 0%, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0) 50%),

    border: 1px solid rgba(255,255,255,0.45) !important;

  }
  .btn-secondary, .insc-share .dl, .cal-nav, .rpe-more, .sheet-close {
    background: var(--lg-fill-strong) !important;
    backdrop-filter: var(--lg-blur); -webkit-backdrop-filter: var(--lg-blur);
    border: 1px solid rgba(255,255,255,0.7) !important;
    box-shadow: var(--lg-shadow-sm) !important;
  }
  .rpe-more, .cal-nav { border-radius: 999px !important; }

  /* ---------- Selectores segmentados: canal de vidrio con una gota que se mueve ---------- */
  .seg-a, .login-sheet .seg-a {
    background: rgba(255,255,255,0.28) !important; border: 1px solid rgba(255,255,255,0.5);
    border-radius: 999px !important; padding: 4px !important;
    backdrop-filter: blur(16px) saturate(180%); -webkit-backdrop-filter: blur(16px) saturate(180%);
    box-shadow: inset 0 1px 2px rgba(18,60,110,0.12);
  }
  .seg-a button { border-radius: 999px !important; transition: background 0.25s, box-shadow 0.25s, color 0.25s; }
  .seg-a button.on {
    background: linear-gradient(180deg, rgba(255,255,255,0.95), rgba(255,255,255,0.75)) !important;
    box-shadow: 0 4px 12px -4px rgba(18,60,110,0.3), inset 0 1px 1px #fff, inset 0 -1px 1px rgba(18,60,110,0.08) !important;
  }

  /* ---------- Campos: vidrio claro ---------- */
  input[type=text], input[type=number], input[type=date], input[type=email], input[type=password], select, textarea, .select-styled {
    background-color: rgba(255,255,255,0.55) !important;
    border: 1px solid rgba(255,255,255,0.8) !important;
    border-radius: 16px !important;
    box-shadow: inset 0 1px 3px rgba(18,60,110,0.08), 0 1px 0 rgba(255,255,255,0.6) !important;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  textarea { border-radius: 18px !important; }

  /* ---------- Botones de RPE, estado y chips: pequeñas gotas ---------- */
  .rpe-btn, .fatigue-btn, .pack-btn, .alpha-btn, .insc-chip, .pin-btn {
    box-shadow: 0 6px 14px -8px rgba(18,60,110,0.35), inset 0 1px 1px rgba(255,255,255,0.75), inset 0 -2px 4px rgba(0,0,0,0.06) !important;
  }
  .rpe-btn, .fatigue-btn { border-radius: 16px !important; }
  .pin-btn { background: var(--lg-fill-strong) !important; border: 1px solid rgba(255,255,255,0.7) !important; backdrop-filter: var(--lg-blur); -webkit-backdrop-filter: var(--lg-blur); }

  /* ---------- Hojas y menús: vidrio grande con esquinas muy redondeadas ---------- */
  .bottom-sheet { border-radius: 34px 34px 0 0 !important; background: linear-gradient(170deg, rgba(250,253,255,0.78), rgba(240,248,255,0.62)) !important; }
  .rpe-menu-box, .confirm-box { border-radius: 30px !important; background: linear-gradient(165deg, rgba(252,254,255,0.85), rgba(242,249,255,0.7)) !important;
    backdrop-filter: blur(30px) saturate(200%) !important; -webkit-backdrop-filter: blur(30px) saturate(200%) !important; }
  .rpe-menu-item { border-radius: 20px !important; }
  .rpe-menu-cancel { background: linear-gradient(165deg, rgba(255,255,255,0.92), rgba(255,255,255,0.75)) !important; }

  /* Menos transparencia si el teléfono lo pide */
  @media (prefers-reduced-transparency: reduce) {
    .card, .welcome-card, .login-card, .bottom-nav, .header { background: rgba(246,250,254,0.94) !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }
  }
</style>

<!-- ONDRIFT · SPLASH DE PRESENTACION (capa aislada, se autoelimina) -->
<!-- No modifica la app: mismo fondo, clases propias, se borra del DOM -->
<!-- ============================================================ -->
<div id="od-splash">
  <div class="od-splash-bg"></div>
  <div class="od-splash-mark">
    <div class="od-splash-glow"></div>
    <div class="od-splash-icon od3d" role="img" aria-label="Ondrift"></div>
  </div>
</div>
<style>
  /* Splash claro: mismo fondo que el login; el icono sube hasta su sitio en el login */
  #od-splash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;z-index:99999;pointer-events:none}
  .od-splash-bg{position:absolute;inset:0;background:linear-gradient(160deg,#e4edf5 0%,#eaf1f8 35%,#e6eef6 65%,#e2ecf5 100%);transition:opacity .6s ease}
  .od-splash-mark{position:relative;width:min(70vw,280px);height:min(70vw,280px);display:flex;align-items:center;justify-content:center;transform-origin:0 0;}
  .od-splash-glow{position:absolute;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(79,156,242,.22) 0%,rgba(79,156,242,.08) 45%,transparent 70%);transition:opacity .6s ease}
  .od-splash-icon{position:relative;width:100%;height:100%}
  #od-splash.od-move .od-splash-bg,#od-splash.od-move .od-splash-glow{opacity:0}
  #od-splash.od-move .od-splash-mark{transition:transform .75s cubic-bezier(.65,0,.35,1)}
  #od-splash.od-fade{transition:opacity .45s ease;opacity:0}
  /* 1em = 1 % del ancho del logo: perspectiva y grosor proporcionales en cualquier tamaño */
  .od3d{position:relative;perspective:320em;font-size:2.1px}
  .od-splash-icon.od3d{font-size:min(.7vw,2.8px)}
  .login-sheet .login-logo.sm .od3d{font-size:1.85px}
  @media (max-height: 700px){.login-sheet .od3d{font-size:1.65px}.login-sheet .login-logo.sm .od3d{font-size:1.35px}}
  /* pose final ligeramente girada: el volumen se ve siempre, también en reposo */
  .od3d-rig{position:absolute;inset:0;transform-style:preserve-3d;transform:var(--od3d-pose)}
  :root{--od3d-pose:rotateY(-16deg) rotateX(9deg)}
  .od-splash-icon .od3d-rig{animation:od3dIn 2.2s cubic-bezier(.22,.75,.2,1) .35s both}
  .od-splash-icon.od3d{animation:od3dFade .75s ease-out .35s both}
  .od-splash-icon .od3d-floor{animation:od3dFloor 2.2s cubic-bezier(.22,.75,.2,1) .35s both}
  .od3d-layer{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .od3d .sheen{opacity:0;animation:od3dSh 8s cubic-bezier(.45,0,.3,1) 1.55s infinite}
  .od3d-floor{position:absolute;left:20%;right:20%;bottom:-3%;height:9%;border-radius:50%;background:radial-gradient(closest-side,rgba(20,45,110,.34),transparent);filter:blur(4px);animation:none;transition:opacity .4s ease}
  @keyframes od3dIn{from{transform:translateZ(-90em) rotateY(-78deg) rotateX(14deg)}to{transform:var(--od3d-pose)}}
  @keyframes od3dFade{from{opacity:0}to{opacity:1}}
  @keyframes od3dFloor{from{opacity:0;transform:scaleX(.3)}to{opacity:1;transform:none}}
  @keyframes od3dSh{0%{transform:translateX(-40px);opacity:0}4%{opacity:1}28%{opacity:1}32%{transform:translateX(150px);opacity:0}100%{transform:translateX(150px);opacity:0}}
  /* Mientras el splash está, el login espera: logo oculto y tarjeta en pausa */
  .od-hold-logo .login-screen .login-logo{opacity:0;animation:none}
  .od-hold-card .login-screen .login-card{animation-play-state:paused}
  .od-login-icon-wrap{position:relative;width:64px;height:64px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center}
  .od-login-glow{position:absolute;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(79,156,242,.24) 0%,rgba(79,156,242,.09) 42%,transparent 72%)}
  .od-login-icon{position:relative;width:88px;height:88px}
  @media (prefers-reduced-motion: reduce){.od-splash-mark,.od3d,.od3d-rig,.od3d-floor,.od3d .sheen{animation:none!important}}
</style>
<script>

  var MIN_SHOW = 3000, MAX_WAIT = 5200, t0 = Date.now();
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function cleanup() {
    root.classList.remove('od-hold-logo', 'od-hold-card');
    if (s.parentNode) s.parentNode.removeChild(s);
  }
  function fadeOut() {
    root.classList.remove('od-hold-card');
    s.classList.add('od-fade');
    setTimeout(cleanup, 500);
  }
  function flyTo(target) {
    var from = mark.getBoundingClientRect(), to = target.getBoundingClientRect();
    var k = to.width / from.width;
    var logo = target.closest('.login-logo');
    if (logo) logo.style.animation = 'none';
    root.classList.remove('od-hold-card');
    mark.style.animation = 'none';
    void mark.offsetWidth;
    s.classList.add('od-move');
    mark.style.transform = 'translate(' + (to.left - from.left) + 'px,' + (to.top - from.top) + 'px) scale(' + k + ')';
    setTimeout(function() { root.classList.remove('od-hold-logo'); cleanup(); }, 800);
  }
  (function wait() {
    var target = document.querySelector('#app .login-screen .ring-img');
    var appReady = document.querySelector('#app > *');
    var elapsed = Date.now() - t0;
    if (elapsed >= MIN_SHOW && target && target.complete !== false && target.getBoundingClientRect().width > 0) {
      return reduce ? fadeOut() : flyTo(target);
    }
    if ((elapsed >= MIN_SHOW && appReady && !document.querySelector('#app .login-screen')) || elapsed >= MAX_WAIT) {
      return fadeOut();
    }
    setTimeout(wait, 50);
  })();
})();

<script>
// ============================================================
// SUPABASE CONFIG
// ============================================================
// ============================================================
// CHEQUEO DE VERSIÓN (evita tener que borrar/recrear el acceso directo)
// Compara un hash del HTML servido ahora contra el que quedó guardado la
// última vez. Si cambió (subiste un index.html nuevo a GitHub), muestra un
// banner para actualizar con un toque, forzando una carga que salta la
// caché — sin tocar el ícono de la pantalla de inicio.
// ============================================================
(function(){
  async function sha256(text) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  }
  function showUpdateBanner() {
    if (document.getElementById('od-update-banner')) return;
    const b = document.createElement('div');
    b.id = 'od-update-banner';
    b.style.cssText = 'position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:99999;background:#0a1628;color:#fff;padding:14px 16px;border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,0.35);display:flex;align-items:center;justify-content:space-between;gap:12px;font-family:-apple-system,system-ui,sans-serif;font-size:0.88rem';
    b.innerHTML = '<span>Hay una versión nueva de Ondrift.</span>';
    const btn = document.createElement('button');
    btn.textContent = 'Actualizar';
    btn.style.cssText = 'background:#e74c3c;color:#fff;border:none;padding:8px 14px;border-radius:10px;font-weight:700;font-size:0.85rem;flex-shrink:0';
    btn.onclick = function() {
      btn.textContent = '…';
      try { localStorage.setItem('ondrift_build_hash', window.__odFreshHash || ''); } catch(e) {}
      location.replace(location.pathname + '?v=' + Date.now());
    };
    b.appendChild(btn);
    document.body.appendChild(b);
  }
  async function checkForUpdate() {
    try {
      const res = await fetch(location.pathname, { cache: 'no-store' });
      if (!res.ok) return;
      const text = await res.text();
      const hash = await sha256(text);
      window.__odFreshHash = hash;
      let stored = null;
      try { stored = localStorage.getItem('ondrift_build_hash'); } catch(e) {}
      if (stored === null) {
        try { localStorage.setItem('ondrift_build_hash', hash); } catch(e) {}
        return;
      }
      if (stored !== hash) showUpdateBanner();
    } catch (e) { /* sin red: no molestar */ }
  }
  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    setTimeout(checkForUpdate, 800);
  } else {
    document.addEventListener('DOMContentLoaded', function(){ setTimeout(checkForUpdate, 800); });
  }
})();

const SUPABASE_URL = 'https://skblkxwaxnefycgrqeyt.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Wc-Lo4L8ZPZ_OOg1F8iVVg_vWPEabtn'; // clave pública (terrassanatacio) — diseñada para ir en el cliente

let SB_STATUS = 'ok'; // 'ok' | 'nokey' | 'auth' | 'offline'
let SB_LAST_ERROR = ''; // texto del último error devuelto por PostgREST

// --- Sesión de coach (Supabase Auth) para que las policies RLS de escritura reconozcan auth.uid() ---
let SB_ACCESS_TOKEN = null; // no restauramos token viejo al arrancar: caducaría y daría un 401 falso ("clave revocada"). El coach re-loguea por sesión.
let SB_REFRESH_TOKEN = null; // el nadador sí: su refresh_token permite renovar el access_token caducado sin volver a pedir el PIN.
let LAST_AUTH_ERROR = null; // 'confirm' | 'creds' | 'locked' | 'offline' | 'busy'
let COACH_CREDS = null; // {email,password} SOLO en memoria durante la sesion; nunca se guarda en disco ni se hardcodea

// Tras iniciar sesión: mira el estado real del coach (pending/approved) y quién es admin.
// Devuelve 'approved' | 'pending' | 'rejected' | null (error de red)
async function fetchCoachStatus() {
  try {
    // Timeout de 15s: sin esto, una petición que nunca resuelve dejaba el
    // botón en "Entrando…" para siempre, sin mensaje ni forma de reintentar.
    const ctrl = new AbortController();
    const timer = setTimeout(function(){ ctrl.abort(); }, 15000);
    const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/my_coach_status', {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SB_ACCESS_TOKEN, 'Content-Type': 'application/json' },
      body: '{}',
      signal: ctrl.signal
    });
    clearTimeout(timer);
    if (!res.ok) return null;
    const rows = await res.json();
    if (!rows || !rows[0]) return null;
    S.isAdmin = !!rows[0].is_admin;
    S.myTeamCode = rows[0].team_code || null;
    return rows[0].status;
  } catch (e) { console.error('fetchCoachStatus', e.message); return null; }
}

async function fetchPendingCoachCount() {
  if (!S.isAdmin) { S.pendingCoachCount = 0; return; }
  try {
    const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/list_coaches_for_admin', {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SB_ACCESS_TOKEN, 'Content-Type': 'application/json' },
      body: '{}'
    });
    if (!res.ok) return;
    const rows = await res.json();
    S.pendingCoachCount = rows.filter(c => c.status === 'pending').length;
    if (S.role === 'coach') render();
  } catch (e) { console.error('fetchPendingCoachCount', e.message); }
}

async function coachSignIn(email, password) {
  // Sin argumentos = reintento silencioso con las credenciales en memoria (p.ej. token expirado)
  if (!email || !password) {
    if (!COACH_CREDS) return false;
    email = COACH_CREDS.email; password = COACH_CREDS.password;
  }
  try {
    const res = await fetch(SUPABASE_URL + '/functions/v1/coach-login', {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, password: password })
    });
    if (!res.ok) {
      const t = await res.text(); console.error('Coach auth error', t);
      if (res.status === 423) { LAST_AUTH_ERROR = 'locked'; return false; }
      if (res.status === 429 || res.status >= 500) { LAST_AUTH_ERROR = 'busy'; return false; }
      LAST_AUTH_ERROR = (t && t.indexOf('not confirmed') !== -1) ? 'confirm' : 'creds';
      return false;
    }
    const data = await res.json();
    SB_ACCESS_TOKEN = data.access_token;
    COACH_CREDS = { email: email, password: password };
    localStorage.setItem('ondrift_sb_token', SB_ACCESS_TOKEN);
    return true;
  } catch (e) {
    console.error('Coach auth sin conexión', e.message);
    LAST_AUTH_ERROR = 'offline';
    return false;
  }
}

async function refreshAthleteSession() {
  // Renueva el access_token del nadador con su refresh_token, sin pedir el PIN.
  if (!SB_REFRESH_TOKEN) {
    try { SB_REFRESH_TOKEN = localStorage.getItem('ondrift_sb_refresh') || null; } catch (e) {}
  }
  if (!SB_REFRESH_TOKEN) return false;
  try {
    const res = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=refresh_token', {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: SB_REFRESH_TOKEN })
    });
    if (!res.ok) {
      // El refresh_token también caducó o fue revocado: hay que re-loguear.
      SB_REFRESH_TOKEN = null;
      try { localStorage.removeItem('ondrift_sb_refresh'); } catch (e) {}
      return false;
    }
    const data = await res.json();
    if (!data || !data.access_token) return false;
    SB_ACCESS_TOKEN = data.access_token;
    try { localStorage.setItem('ondrift_sb_token', SB_ACCESS_TOKEN); } catch (e) {}
    if (data.refresh_token) {
      SB_REFRESH_TOKEN = data.refresh_token;
      try { localStorage.setItem('ondrift_sb_refresh', SB_REFRESH_TOKEN); } catch (e) {}
    }
    return true;
  } catch (e) {
    console.error('refreshAthleteSession', e.message);
    return false;
  }
}

// ============================================================
// ANALYTICS — eventos de producto: uso, fricción y bugs.
// Va todo a la tabla app_events (Supabase). Nunca debe romper la app:
// cualquier fallo de red o de la propia analítica se traga en silencio.
// ============================================================
const SESSION_ID = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now() + '-' + Math.random());
let LAST_TRACKED_SCREEN = null;

function track(eventName, meta) {
  try {
    fetch(SUPABASE_URL + '/rest/v1/app_events', {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + (SB_ACCESS_TOKEN || SUPABASE_KEY),
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify({
        session_id: SESSION_ID,
        role: (typeof S !== 'undefined' && S.role) || null,
        event_name: eventName,
        screen: LAST_TRACKED_SCREEN,
        meta: meta || {}
      })
    }).catch(function(){});
  } catch (e) {}
}

// Llamar en cada render() cuando cambia de pantalla. Sirve para saber
// cuánta gente entra y por dónde navega, sin instrumentar pantalla por pantalla.
function trackScreen(name) {
  if (name === LAST_TRACKED_SCREEN) return;
  LAST_TRACKED_SCREEN = name;
  track('screen_view', {});
}

// Bugs reales antes de que los reporte un cliente: errores JS no controlados
window.addEventListener('error', function(e) {
  track('js_error', { message: e.message, source: e.filename, line: e.lineno });
});
window.addEventListener('unhandledrejection', function(e) {

});

// "Dónde se encalla": 3+ toques en el mismo botón en menos de 800ms
// es la señal más barata de que algo no respondió como esperaba el usuario.
(function() {
  let rageTarget = null, rageCount = 0, rageTimer = null;
  document.addEventListener('click', function(e) {
    const el = e.target.closest && e.target.closest('button, a, [role="button"]');
    if (!el) return;
    if (el === rageTarget) { rageCount++; } else { rageTarget = el; rageCount = 1; }
    clearTimeout(rageTimer);
    rageTimer = setTimeout(function(){ rageTarget = null; rageCount = 0; }, 800);
    if (rageCount === 3) {
      track('rage_click', { text: (el.textContent || '').trim().slice(0, 40) });
    }
  }, true);
})();

async function sbFetch(path, options, _retry) {
  if (SUPABASE_KEY.indexOf('PEGA_AQUI') === 0) { SB_STATUS = 'nokey'; return null; }
  const url = SUPABASE_URL + '/rest/v1/' + path;
  const headers = {
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer ' + (SB_ACCESS_TOKEN || SUPABASE_KEY),
    'Content-Type': 'application/json',
    'Prefer': options && options.prefer ? options.prefer : 'return=representation'
  };
  try {
    const res = await fetch(url, { ...options, headers: { ...headers, ...(options && options.headers || {}) } });
    if (!res.ok) {
      const err = await res.text(); console.error('SB error', path, err);
      track('api_error', { path: path, status: res.status });
      // Un solo reintento: sin este tope, un 401 persistente hacía
      // sbFetch -> login -> sbFetch -> login... en bucle infinito y la
      // pantalla se quedaba colgada en "Entrando…" sin ningún error.
      if ((res.status === 401 || res.status === 403) && SB_ACCESS_TOKEN && !_retry) {
        // El token pudo expirar. El nadador renueva con su refresh_token;
        // el coach reautentica con las credenciales en memoria.
        if (S.role === 'athlete') {
          const refreshed = await refreshAthleteSession();
          if (refreshed) return sbFetch(path, options, true);
        } else {
          const ok = await coachSignIn();
          if (ok) return sbFetch(path, options, true);
        }
      }
      // Un 403 de PostgREST suele ser una regla de negocio (trigger/RLS)
      // rechazando la operación, no una clave revocada. Marcar 'auth' aquí
      // pintaba el cartel rojo "clave no válida" cada vez que un trigger
      // rechazaba una inscripción, que es un mensaje falso y alarmante.
      // Guardamos el motivo real para que quien llama lo pueda mostrar.
      SB_LAST_ERROR = err || '';
      if (res.status === 401) SB_STATUS = 'auth';
      return null;
    }
    SB_STATUS = 'ok';
    const text = await res.text();
    return text ? JSON.parse(text) : null;
  } catch (e) {
    console.error('SB sin conexión', path, e.message);
    SB_STATUS = 'offline';
    return null;
  }
}

// ── Athlete cache ──────────────────────────────────────────
let _athleteCache = null;
async function dbGetAthletes() {
  if (_athleteCache) return _athleteCache;
  let rows;
  if (S.role === 'coach') {
    // El coach lee los suyos por RLS (la vista respeta el aislamiento por coach_id)
    rows = await sbFetch('athletes_directory?select=id,name,morning_days,has_pin,birth_date,consent_on_file,consent_note&order=name');
  } else {
    // Nadador (o pantalla de login): la lista se obtiene con el código de equipo,
    // vía Edge Function con rate-limit por IP (antes era un RPC público sin
    // ningún límite de intentos — fuerza-bruteable para sacar rosters de otros
    // clubes). Sin código no hay nombres: así no se expone el roster a cualquiera.
    const code = getTeamCode();
    if (!code) { return []; } // no cachear: es un estado transitorio pre-login, no un dato real
    try {
      const res = await fetch(SUPABASE_URL + '/functions/v1/team-roster', {
        method: 'POST',
        headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ code })
      });
      if (res.status === 429) {
        const t = await res.json().catch(function () { return {}; });
        S.teamCodeError = t.error || 'Demasiados intentos. Probá de nuevo en unos minutos.';
        rows = [];
      } else if (!res.ok) {
        S.teamCodeError = 'Servicio ocupado. Inténtalo de nuevo en unos segundos.';
        return [];
      } else {
        rows = await res.json();
      }
    } catch (e) { console.error('team-roster', e.message); S.teamCodeError = 'Sin conexión. Inténtalo de nuevo.'; return []; }
  }
  _athleteCache = rows || [];
  return _athleteCache;
}

function getTeamCode() {
  if (S.teamCode) return S.teamCode;
  try { S.teamCode = localStorage.getItem('ondrift_team_code') || null; } catch (e) { S.teamCode = null; }
  return S.teamCode;
}
function setTeamCode(code) {
  S.teamCode = code ? code.trim().toUpperCase() : null;
  try {
    if (S.teamCode) localStorage.setItem('ondrift_team_code', S.teamCode);
    else localStorage.removeItem('ondrift_team_code');
  } catch (e) {}
  _athleteCache = null;
  _compCache = null;
}
async function dbAthleteId(name) {
  const athletes = await dbGetAthletes();
  const found = athletes.find(a => a.name === name);
  return found ? found.id : null;
}
async function dbAddAthlete(name) {
  // 'name' tiene UNIQUE constraint en la tabla. El INSERT directo fallaba en
  // silencio (409) si el nombre coincidía con un nadador desactivado, y el
  // caller nunca chequeaba el resultado. Ahora se verifica antes de insertar:
  // - Si existe y está activo -> duplicado real, se avisa.
  // - Si existe pero está inactivo -> se reactiva (conserva RPE/asistencia/wellness).
  // - Si no existe -> INSERT normal.
  const existing = await sbFetch('athletes?name=eq.' + encodeURIComponent(name) + '&select=id,active');
  if (existing && existing.length > 0) {
    const row = existing[0];
    if (row.active) return { ok: false, reason: 'duplicate_active' };
    const reactivated = await sbFetch('athletes?id=eq.' + row.id, { method:'PATCH', body: JSON.stringify({ active: true }) });
    _athleteCache = null;
    return { ok: Array.isArray(reactivated) && reactivated.length > 0, reason: 'reactivated' };
  }
  const res = await sbFetch('athletes', { method:'POST', body: JSON.stringify({ name }) });
  _athleteCache = null;
  return { ok: !!res, reason: res ? 'created' : 'error' };
}
async function dbUpdateAthleteMeta(id, fields) {
  // fields: { birth_date, consent_on_file, consent_note } — datos de menor de edad
  // y consentimiento parental (documentado en papel por el club/federación, NO
  // capturado digitalmente por Ondrift).
  const res = await sbFetch('athletes?id=eq.' + id, { method:'PATCH', body: JSON.stringify(fields) });
  _athleteCache = null;
  return Array.isArray(res) && res.length > 0;
}
async function dbEraseAthlete(id) {
  // Borrado RGPD real y definitivo (derecho de supresión, Art. 17). Distinto de
  // dbDeleteAthlete ("dar de baja": soft, conserva historial para bajas normales
  // de temporada). Este SÍ borra la fila; cascada a rpe_entries, wellness_entries,
  // strength_sets, bodyweight_entries, comments, inscriptions, results y
  // attendance (todas con ON DELETE CASCADE). NO reversible — usar solo ante un
  // pedido expreso de supresión de datos.
  const res = await sbFetch('athletes?id=eq.' + id, { method:'DELETE' });
  _athleteCache = null;
  return Array.isArray(res) && res.length > 0;
}
async function dbDeleteAthlete(name) {
  // Soft-delete: pone active=false en vez de borrar la fila.
  // Un DELETE físico fallaba en silencio por la FK de 'attendance' (NO ACTION,
  // a diferencia de rpe_entries/comments/inscriptions/wellness_entries que sí
  // tienen CASCADE) — y de paso hubiera borrado el historial de asistencia,
  // RPE y wellness del nadador. dbGetAthletes() ya filtra active=eq.true.
  // Nota: sin 'return=minimal' (default 'return=representation') para poder
  // distinguir éxito (devuelve la fila) de fallo (sbFetch devuelve null en
  // ambos casos si se pide return=minimal).
  const res = await sbFetch('athletes?name=eq.' + encodeURIComponent(name), { method:'PATCH', body: JSON.stringify({ active: false }) });
  _athleteCache = null;
  return Array.isArray(res) && res.length > 0;
}

let _sessionCache = {};

async function dbGetSession(date) {

  // Reconstruct am/pm format

  rows.forEach(r => {
    const sess = { ...r.content, title: r.title, phase: r.phase, targetRPE: r.target_rpe, duration: r.duration_min, alphaPhase: r.alpha_phase, _id: r.id };
    result[r.slot] = sess;

}
async function dbSaveSession(date, slot, sessObj) {
  const body = {

    target_rpe: sessObj.targetRPE || 6,
    duration_min: sessObj.duration || 80,
    alpha_phase: sessObj.alphaPhase || null,
    content: {
      warmUp: sessObj.warmUp || '', preSet: sessObj.preSet || '',

  });

  _allSessionsCache = null;
  // Si la pestaña de Asistencia tiene cargada esta misma fecha, su copia en
  // memoria (S._attSession, con el _id de sesión ya cerrado) quedó obsoleta:
  // forzamos un refetch en el próximo render aunque S.attSelDate no cambie.
  // Sin esto, "Cerrar sesión y guardar" puede enviar un session_id que ya
  // no existe (o que apunta a la fila vieja) y Supabase lo rechaza por la
  // foreign key attendance_session_id_fkey.
  if (typeof S !== 'undefined' && S && S._attSessionDate === date) {
    S._attSessionDate = null;
  }
  return res; // null si falló, array si guardó
}
async function dbGetAllSessions(weeks) {
  // Ventana de arranque: solo las últimas N semanas (por defecto 6).
  if (_allSessionsCache) return _allSessionsCache;
  const w = weeks || 6;
  const from = new Date(); from.setDate(from.getDate() - w * 7);
  const fromS = from.getFullYear()+'-'+String(from.getMonth()+1).padStart(2,'0')+'-'+String(from.getDate()).padStart(2,'0');
  const rows = await sbFetch('sessions?select=*&date=gte.' + fromS + '&order=date.desc');
  if (!rows) return [];
  const byDate = {};
  rows.forEach(r => {
    if (!byDate[r.date]) byDate[r.date] = { am: null, pm: null };
    const sess = { ...r.content, title: r.title, phase: r.phase, targetRPE: r.target_rpe, duration: r.duration_min, alphaPhase: r.alpha_phase, _id: r.id };
    byDate[r.date][r.slot] = sess;
  });
  _allSessionsCache = Object.entries(byDate).map(([date, data]) => ({ date, data })).sort((a,b) => b.date.localeCompare(a.date));
  _loadedMonths = {};
  // marcar los meses ya cubiertos por la ventana inicial
  _allSessionsCache.forEach(function(s){ _loadedMonths[s.date.slice(0,7)] = true; });
  return _allSessionsCache;
}

// Carga un mes concreto bajo demanda (formato 'YYYY-MM'). Fusiona en la caché.
let _loadedMonths = {};
async function dbLoadSessionMonth(ym) {
  if (_loadedMonths[ym]) return;
  const first = ym + '-01';
  const [y, m] = ym.split('-').map(Number);
  const lastDay = new Date(y, m, 0).getDate();
  const last = ym + '-' + String(lastDay).padStart(2,'0');
  const rows = await sbFetch('sessions?select=*&date=gte.' + first + '&date=lte.' + last + '&order=date.desc');
  _loadedMonths[ym] = true;
  if (!rows || rows.length === 0) return;
  const byDate = {};
  rows.forEach(r => {
    if (!byDate[r.date]) byDate[r.date] = { am: null, pm: null };
    const sess = { ...r.content, title: r.title, phase: r.phase, targetRPE: r.target_rpe, duration: r.duration_min, alphaPhase: r.alpha_phase, _id: r.id };
    byDate[r.date][r.slot] = sess;
  });
  const existing = {}; (_allSessionsCache || []).forEach(function(s){ existing[s.date] = s; });
  Object.entries(byDate).forEach(([date, data]) => { existing[date] = { date, data }; });
  _allSessionsCache = Object.values(existing).sort((a,b) => b.date.localeCompare(a.date));
  DATA.allSessions = _allSessionsCache;
  DATA.sessions = {}; _allSessionsCache.forEach(x => { DATA.sessions[x.date] = x.data; });
}

// PostgREST devuelve como máximo 1000 filas por petición: pedimos por páginas hasta traerlo todo.
async function sbFetchAll(path) {
  const PAGE = 1000; let all = [];
  for (let i = 0; i < 50; i++) {
    const rows = await sbFetch(path + '&limit=' + PAGE + '&offset=' + (i * PAGE));
    if (!rows) return all.length ? all : null;
    all = all.concat(rows);
    if (rows.length < PAGE) break;
  }
  return all;
}
let _rpeCache = {};
let _rpeRangeLoaded = false;
async function dbGetRPERange(days) {
  // 1 sola petición para los últimos N días, agrupada por fecha en cliente
  const from = new Date(); from.setDate(from.getDate() - (days - 1));
  const fromS = from.getFullYear()+'-'+String(from.getMonth()+1).padStart(2,'0')+'-'+String(from.getDate()).padStart(2,'0');
  const rows = await sbFetchAll('rpe_entries?date=gte.' + fromS + '&select=*,athletes(name)&order=date,id');
  const byDate = {};
  (rows || []).forEach(r => {
    const name = r.athletes?.name;
    if (!name) return;
    if (!byDate[r.date]) byDate[r.date] = {};
    if (!byDate[r.date][name]) byDate[r.date][name] = { am: null, pm: null };
    byDate[r.date][name][r.slot] = { rpe: r.rpe, fatigue: r.fatigue, note: r.note, ts: new Date(r.created_at).getTime() };
  });
  // rellenar caché completa del rango (días sin datos = {})
  for (let i = 0; i < days; i++) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const ds = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    _rpeCache[ds] = byDate[ds] || {};
  }
  _rpeRangeLoaded = true;
  return _rpeCache;
}
async function dbGetDayRPE(date) {
  if (_rpeCache[date]) return _rpeCache[date];
  const rows = await sbFetch('rpe_entries?date=eq.' + date + '&select=*,athletes(name)');

  const result = {};
  rows.forEach(r => {
    const name = r.athletes?.name;
    if (!name) return;
    if (!result[name]) result[name] = { am: null, pm: null };
    result[name][r.slot] = { rpe: r.rpe, fatigue: r.fatigue, note: r.note, ts: new Date(r.created_at).getTime() };
  });
  _rpeCache[date] = result;
  return result;
}
async function dbSaveRPE(date, slot, athleteName, rpe, fatigue, note) {

// ── Export mensual (CSV crudo, sesión + asistencia por nadador) ───────────
const ATT_LABEL_CSV = { present: 'Presente', absent: 'Ausente', justified: 'Justificada' };
function csvEscape(v) {
  v = (v === null || v === undefined) ? '' : String(v);
  if (/[",;\n]/.test(v)) v = '"' + v.replace(/"/g, '""') + '"';
  return v;
}
function downloadCSV(rows, filename) {
  const csv = rows.map(function(r) { return r.map(csvEscape).join(','); }).join('\r\n');
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' }); // BOM: para que Excel abra bien tildes/ñ
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
}
async function exportMonthCSV(ym, btn) {
  const sessions = getAllSessions().filter(function(s) { return s.date.slice(0, 7) === ym; });
  if (sessions.length === 0) { alert('No hay sesiones ese mes para exportar.'); return; }

  const origLabel = btn ? btn.textContent : null;
  if (btn) { btn.disabled = true; btn.textContent = 'Generando…'; }

  try {
    const athleteName = {};
    (DATA.athletes || []).forEach(function(a) { athleteName[a.id] = a.name; });

    const entries = [];
    sessions.forEach(function(s) {
      daySlots(s.data).forEach(function(sl) { entries.push({ date: s.date, slot: sl.slot, sess: sl.sess }); });
    });

    const attMaps = await Promise.all(entries.map(function(e) {
      return e.sess._id ? dbGetSessionAttendance(e.sess._id) : Promise.resolve({});
    }));

    const rows = [['Fecha', 'Turno', 'Título', 'Fase', 'RPE objetivo', 'Duración (min)', 'Nadador', 'Asistencia']];
    entries.forEach(function(e, i) {
      const sess = e.sess;
      const attMap = attMaps[i];
      const slotLabel = e.slot === 'am' ? 'Mañana' : (e.slot === 'pm' ? 'Tarde' : (e.slot === 'fis' ? 'Físico' : e.slot));
      const base = [e.date, slotLabel, sess.title || 'Sin título', sess.phase || '',
        (sess.targetRPE != null ? sess.targetRPE : ''), (sess.duration != null ? sess.duration : '')];
      const ids = Object.keys(attMap);
      if (ids.length === 0) {
        rows.push(base.concat(['', 'Sin asistencia registrada']));
      } else {
        ids.forEach(function(aid) {
          rows.push(base.concat([athleteName[aid] || aid, ATT_LABEL_CSV[attMap[aid]] || attMap[aid]]));
        });
      }
    });

    downloadCSV(rows, 'ondrift_' + ym + '.csv');
  } catch (err) {
    alert('Error al generar el export. Reintentá.');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = origLabel; }
  }
}

// Autonómico, Nacional o Internacional (no en meets de club) — el margen
// de 5 días es para que el nadador conteste después de que baje la carga
// emocional inmediata, no en caliente.
async function dbGetPendingSurvey(name) {
  const athleteId = await dbAthleteId(name);
  if (!athleteId) return null;
  const today = new Date();
  const limit = new Date(today); limit.setDate(limit.getDate() - 5);
  const limitS = limit.getFullYear()+'-'+String(limit.getMonth()+1).padStart(2,'0')+'-'+String(limit.getDate()).padStart(2,'0');
  const tiposFiltro = encodeURIComponent('Nacional,Autonómico,Internacional');
  const comps = await sbFetch('competitions?select=id,name,type,end_date&type=in.(' + tiposFiltro + ')&end_date=lte.' + limitS + '&order=end_date.desc');
  if (!comps || comps.length === 0) return null;
  for (const c of comps) {
    const existing = await sbFetch('results?athlete_id=eq.' + athleteId + '&competition_id=eq.' + c.id + '&select=id&limit=1');
    if (!existing || existing.length === 0) return c; // primera competición sin encuesta completada

  return null;
}

  await ensureSessionsLoaded();
  const from = new Date(); from.setDate(from.getDate() - 27);
  const fromS = from.getFullYear()+'-'+String(from.getMonth()+1).padStart(2,'0')+'-'+String(from.getDate()).padStart(2,'0');
  const rows = await sbFetch('rpe_entries?athlete_id=eq.' + athleteId + '&select=date,slot,rpe,fatigue&date=gte.' + fromS + '&order=date.asc');
  if (!rows) return [];
  // Adjuntar duración de la sesión correspondiente (para sRPE = RPE × min).
  // DATA.sessions ya garantizado por ensureSessionsLoaded(); si aun así falta
  // (sesión borrada / dato huérfano real, no carrera), default 80 y se marca estimado.
  rows.forEach(function(h) {
    let dur = 80, estimated = true;
    const day = DATA.sessions && DATA.sessions[h.date];
    if (day && day[h.slot] && day[h.slot].duration) { dur = day[h.slot].duration; estimated = false; }
    h.duration = dur;
    h.durationEstimated = estimated;
  });
  return rows;
}

// Carga en un solo request el historial de TODOS los atletas (para el panel
// Escuadra del coach). Devuelve un mapa name -> [{date,slot,rpe,fatigue,duration}],
// mismo shape que dbGetAthleteHist para que calcACWR() no distinga origen.
async function dbGetAllAthleteHist() {
  await ensureSessionsLoaded();
  const from = new Date(); from.setDate(from.getDate() - 27);
  const fromS = from.getFullYear()+'-'+String(from.getMonth()+1).padStart(2,'0')+'-'+String(from.getDate()).padStart(2,'0');
  const rows = await sbFetchAll('rpe_entries?select=date,slot,rpe,fatigue,athletes(name)&date=gte.' + fromS + '&order=date.asc,id.asc');
  const map = {};
  if (!rows) return map;
  rows.forEach(function(r) {
    const name = r.athletes && r.athletes.name;
    if (!name) return;
    let dur = 80, estimated = true;
    const day = DATA.sessions && DATA.sessions[r.date];
    if (day && day[r.slot] && day[r.slot].duration) { dur = day[r.slot].duration; estimated = false; }
    if (!map[name]) map[name] = [];
    map[name].push({ date: r.date, slot: r.slot, rpe: r.rpe, fatigue: r.fatigue, duration: dur, durationEstimated: estimated });
  });
  return map;
}

function showToast(msg, type) {
  // type: 'success' | 'error'
  const existing = document.getElementById('_toast');
  if (existing) existing.remove();
  const t = document.createElement('div');
  t.id = '_toast';
  const isOk = type !== 'error';
  t.style.cssText = [
    'position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px)',
    'background:' + (isOk ? 'rgba(16,37,88,0.92)' : 'rgba(80,20,20,0.92)'),
    'border:1px solid ' + (isOk ? 'rgba(52,152,219,0.5)' : 'rgba(231,76,60,0.5)'),
    'color:#fff;padding:12px 24px;border-radius:30px',
    'font-size:0.9rem;font-weight:700;letter-spacing:0.5px',
    'backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)',
    'box-shadow:0 4px 24px rgba(0,0,0,0.4),' + (isOk ? '0 0 16px rgba(52,152,219,0.3)' : '0 0 16px rgba(231,76,60,0.3)'),
    'z-index:999;transition:transform 0.3s cubic-bezier(.34,1.56,.64,1),opacity 0.3s ease',
    'opacity:0;white-space:nowrap;pointer-events:none'
  ].join(';');
  t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(function() {
    requestAnimationFrame(function() {
      t.style.transform = 'translateX(-50%) translateY(0)';
      t.style.opacity = '1';
    });
  });
  setTimeout(function() {
    t.style.transform = 'translateX(-50%) translateY(20px)';
    t.style.opacity = '0';
    setTimeout(function() { t.remove(); }, 350);
  }, 2200);
}

function athleteAge(birthDate) {
  if (!birthDate) return null;
  const b = new Date(birthDate + 'T00:00:00');
  if (isNaN(b)) return null;
  const t = new Date();
  let age = t.getFullYear() - b.getFullYear();
  const m = t.getMonth() - b.getMonth();
  if (m < 0 || (m === 0 && t.getDate() < b.getDate())) age--;
  return age;
}

function showCoachSurvey(type) {
  const def = COACH_SURVEYS[type];
  const answers = {};
  track('survey_shown', { type: type });

  const back = document.createElement('div'); back.className = 'confirm-back';
  const box = document.createElement('div'); box.className = 'confirm-box';
  box.style.maxHeight = '86vh'; box.style.overflowY = 'auto';
  box.innerHTML = '<div class="confirm-title">' + def.title + '</div><div class="confirm-msg" style="margin-bottom:14px">' + def.sub + '</div>';

  def.qs.forEach(function(qd) {
    const q = document.createElement('div');
    q.className = 'confirm-msg'; q.style.cssText = 'font-weight:700;margin-bottom:8px';
    q.textContent = qd.q;
    box.appendChild(q);
    if (qd.type === 'text') {
      const ta = document.createElement('textarea');
      ta.style.cssText = 'min-height:70px;margin-bottom:16px';
      ta.oninput = function() { answers[qd.k] = ta.value.trim(); };
      box.appendChild(ta);
      return;
    }
    const wrap = document.createElement('div');
    wrap.style.cssText = 'display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px';
    qd.opts.forEach(function(opt) {
      const b = document.createElement('button');
      b.className = 'pack-btn';
      b.style.cssText = qd.small ? 'flex:0 0 calc(16.66% - 5px);padding:8px 0' : 'flex:1 1 auto';
      b.textContent = opt;
      b.onclick = function() {
        if (qd.type === 'multi') {
          const cur = answers[qd.k] || [];
          const i = cur.indexOf(opt);
          if (i === -1) cur.push(opt); else cur.splice(i, 1);
          answers[qd.k] = cur;
          b.classList.toggle('active', i === -1);
        } else {
          answers[qd.k] = opt;
          wrap.querySelectorAll('.pack-btn').forEach(function(x) { x.classList.toggle('active', x === b); });
        }
      };
      wrap.appendChild(b);
    });
    box.appendChild(wrap);
  });

  const err = document.createElement('div');
  err.style.cssText = 'display:none;color:var(--red);font-size:0.8rem;font-weight:700;margin-bottom:10px';
  box.appendChild(err);

  const btns = document.createElement('div'); btns.className = 'confirm-btns';
  const later = document.createElement('button'); later.className = 'confirm-cancel'; later.textContent = 'Ahora no';
  const send = document.createElement('button'); send.className = 'confirm-ok safe'; send.textContent = 'Enviar';
  later.onclick = function() {
    try { localStorage.setItem('ondrift_survey_snooze_' + type, String(Date.now() + 3 * 86400000)); } catch (e) {}
    track('survey_snoozed', { type: type });
    back.remove();
  };
  send.onclick = async function() {
    const missing = def.qs.some(function(qd) {
      if (qd.optional) return false;
      const a = answers[qd.k];
      return !a || (Array.isArray(a) && a.length === 0);
    });
    if (missing) { err.textContent = 'Responde las preguntas (solo la última es opcional).'; err.style.display = 'block'; return; }
    send.disabled = true; send.textContent = 'Enviando…';
    try {
      const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/submit_coach_survey', {
        method: 'POST',
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SB_ACCESS_TOKEN, 'Content-Type': 'application/json' },
        body: JSON.stringify({ p_type: type, p_respuestas: answers })
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      track('survey_submitted', { type: type });
      back.remove();
      showToast('¡Gracias! Respuesta enviada', 'success');
    } catch (e) {
      send.disabled = false; send.textContent = 'Enviar';
      err.textContent = 'No se pudo enviar. Revisa la conexión y prueba de nuevo.'; err.style.display = 'block';
    }
  };
  btns.append(later, send);
  box.appendChild(btns);
  back.appendChild(box);
  document.body.appendChild(back);
}

const RPE_QUEUE_KEY = 'cnt_rpe_queue';

function getRPEQueue() {
  try { return JSON.parse(localStorage.getItem(RPE_QUEUE_KEY)) || []; }
  catch (e) { return []; }
}
function saveRPEQueue(arr) {
  try { localStorage.setItem(RPE_QUEUE_KEY, JSON.stringify(arr)); } catch (e) { /* storage lleno/bloqueado: se pierde, no hay más margen */ }
}
// Entrada pendiente (si existe) para date+slot+atleta, para que la UI la trate como ya enviada.
function findQueuedRPE(date, slot, athleteName) {
  return getRPEQueue().find(function(q) { return q.date === date && q.slot === slot && q.athleteName === athleteName; }) || null;
}
function queueRPE(date, slot, athleteName, rpe, fatigue, note) {
  const q = getRPEQueue();
  // si ya había una entrada pendiente para el mismo date+slot+atleta, la reemplaza (no duplica)
  const filtered = q.filter(function(x){ return !(x.date === date && x.slot === slot && x.athleteName === athleteName); });
  filtered.push({ date, slot, athleteName, rpe, fatigue, note: note || '', ts: Date.now() });
  saveRPEQueue(filtered);
}
let _flushingRPEQueue = false;
async function flushRPEQueue() {
  if (_flushingRPEQueue) return;
  const q = getRPEQueue();
  if (q.length === 0) return;
  _flushingRPEQueue = true;
  const remaining = [];
  for (const item of q) {
    const res = await dbSaveRPE(item.date, item.slot, item.athleteName, item.rpe, item.fatigue, item.note);
    if (!res) {
      if (SB_STATUS === 'offline') {
        // seguimos sin red: dejamos esta y el resto tal cual, no tiene sentido seguir intentando ahora
        remaining.push(item);
        remaining.push.apply(remaining, q.slice(q.indexOf(item) + 1));
        break;
      }
      // fallo no-offline (ej. clave inválida): se descarta para no reintentar infinito con datos malos
      console.error('RPE en cola descartado (fallo no offline)', item);
      continue;
    }
    // éxito: no se agrega a remaining
  }
  saveRPEQueue(remaining);
  _flushingRPEQueue = false;
  if (remaining.length < q.length) render();
}
window.addEventListener('online', flushRPEQueue);

function escapeHtml(str) {

}

async function loadData() {
  // No pedir nada a Supabase hasta saber quién sos: si esto corre antes del
  // login (S.role === null), las respuestas anónimas/vacías quedaban
  // cacheadas para siempre (_compCache, _eventsCache, etc. son "truthy" con
  // un array vacío) y nunca se volvían a pedir tras loguearse — la
  // competencia recién creada forzaba el único refetch real porque
  // dbAddCompetition() es de las pocas funciones que limpia esa caché.
  if (!S.role) return;
  // Carga en paralelo: 7 peticiones máximo (antes ~35 en cascada).
  // Las cachés evitan refetch de lo que no cambió tras una acción.
  const tasks = [
    dbGetAthletes().then(a => { DATA.athletes = a; }),
    dbGetAllSessions(6).then(s => {
      DATA.allSessions = s;
      DATA.sessions = {};
      s.forEach(x => { DATA.sessions[x.date] = x.data; });
    }),
    (_rpeRangeLoaded ? Promise.resolve() : dbGetRPERange(30)).then(() => { DATA.rpe = _rpeCache; }),
    dbGetComments().then(c => { DATA.comments = c; }),
    dbGetCompetitions().then(c => { DATA.competitions = c; }),
    dbGetEvents().then(e => { DATA.events = e; }),
    dbGetTeamMessages().then(m => { DATA.teamMessages = m; }),
    dbGetInscriptions().then(i => { DATA.inscriptions = i; }),
    dbGetDayWellness(todayStr()).then(w => { DATA.wellness[todayStr()] = w; })
  ];
  if (S.athleteName) {
    tasks.push(dbGetAthleteHist(S.athleteName).then(h => { DATA.athleteHist[S.athleteName] = h; }));
    tasks.push(dbGetAthleteWellnessHist(S.athleteName).then(w => { DATA.athleteWellHist[S.athleteName] = w; }));
  }
  await Promise.all(tasks);
  if (getRPEQueue().length > 0) flushRPEQueue(); // no bloquea el render; corre en paralelo
}

// ============================================================
// METERS PARSER
// ============================================================
function parseMeters(text) {
  if (!text) return 0;
  // Expand block multipliers: Nx{ ... } before line-by-line parsing
  // Anidables: se resuelve primero el bloque más interno y luego el externo.
  for (let _g = 0; _g < 20; _g++) {
    const prev = text;
    text = text.replace(/(\d+)\s*[xX×]\s*\{([^{}]*)\}/g, (_, mult, inner) => {
      const n = parseInt(mult);
      return inner.trim().split('\n').map(line => {
        const t = line.trim();
        if (!t) return '';
        // If line is NxD, multiply reps by block multiplier
        const m = t.match(/^(\d+)\s*[xX×]\s*(\d+)(.*)/);
        if (m) return (parseInt(m[1]) * n) + 'x' + m[2] + (m[3] || '');
        // If bare distance line
        const b = t.match(/^(\d+)(.*)/);
        if (b) return (parseInt(b[1]) * n) + (b[2] || '');
        return t;
      }).filter(Boolean).join('\n');
    });
    if (text === prev) break;
  }
  let total = 0;
  text.split('\n').forEach(line => {
    const t = line.trim();
    if (!t) return;
    // NxD pattern: 4x50, 6X100, 3×200
    const mult = t.match(/(\d+)\s*[xX×]\s*(\d+)/);
    if (mult) { total += parseInt(mult[1]) * parseInt(mult[2]); return; }
    // Bare distance: line starts with a number (e.g. "300 FC", "200 patada")
    const bare = t.match(/^(\d+)\s+[^x×X]/);
    if (bare) { total += parseInt(bare[1]); }
  });
  return total;
}
function metersLabel(text) {
  const m = parseMeters(text);
  return m > 0 ? m + ' m' : '';
}
function totalMeters(session) {
  if (session.phase === 'Fuerza') return 0;
  var vb = volumeBreakdown(session);
  return vb.hasFondo ? Math.max(vb.grupo, vb.fondo) : vb.grupo;
}
function volumeBreakdown(session) {
  if (session.phase === 'Fuerza') return null;
  var base = parseMeters(session.warmUp) + parseMeters(session.preSet) + parseMeters(session.coolDown);
  var grupo = base + parseMeters(session.mainSet);
  var fondo = base + parseMeters(session.mainSetFondo);
  return { grupo: grupo, fondo: fondo, hasGrupo: parseMeters(session.mainSet) > 0, hasFondo: parseMeters(session.mainSetFondo) > 0 };
}
function buildVolumeBlock(session, prefix) {
  var vb = volumeBreakdown(session);
  if (!vb) return null;
  var wrap = document.createElement('div');
  wrap.style.marginTop = '10px';
  if (!vb.hasGrupo && !vb.hasFondo) {
    // Sin ningún main set cargado todavía: si igual hay metros (calentamiento,
    // pre-set o vuelta a la calma), mostrar un total único en vez de ocultarlo.
    if (vb.grupo <= 0) return null;
    var rowT = document.createElement('div'); rowT.className = 'total-meters';
    rowT.innerHTML = '<span>' + (prefix || '') + 'Volumen</span><span style="font-weight:700;color:var(--accent2)">' + vb.grupo + ' m</span>';
    wrap.appendChild(rowT);
    return wrap;
  }
  if (vb.hasGrupo) {
    var rowG = document.createElement('div'); rowG.className = 'total-meters'; rowG.style.marginBottom = '4px';
    rowG.innerHTML = '<span>' + (prefix || '') + 'Vol. Grupo</span><span style="font-weight:700;color:var(--accent2)">' + vb.grupo + ' m</span>';
    wrap.appendChild(rowG);
  }
  if (vb.hasFondo) {
    var rowF = document.createElement('div'); rowF.className = 'total-meters';
    rowF.innerHTML = '<span>' + (prefix || '') + 'Vol. Fondo</span><span style="font-weight:700;color:var(--gold)">' + vb.fondo + ' m</span>';
    wrap.appendChild(rowF);
  }
  return wrap;
}

// Storage format v2: tn:session:DATE = { am: sessObj|null, pm: sessObj|null }
// Legacy format: tn:session:DATE = sessObj (treated as single/am)

const SLOT_LABEL = { am: 'Mañana', pm: 'Tarde', fis: 'Físico' };
const SLOT_SHORT = { am: 'AM', pm: 'PM', fis: 'FÍS' };
function normDay(raw) {
  if (!raw) return null;
  if (raw.am !== undefined || raw.pm !== undefined || raw.fis !== undefined) return { am: raw.am || null, pm: raw.pm || null, fis: raw.fis || null };
  return { am: raw, pm: null, fis: null }; // legacy single session
}
function daySlots(raw) {
  const n = normDay(raw);
  if (!n) return [];
  const out = [];
  const multi = [n.am, n.pm, n.fis].filter(Boolean).length > 1;
  if (n.am) out.push({ slot: 'am', label: multi ? 'Mañana' : '', sess: n.am });
  if (n.pm) out.push({ slot: 'pm', label: 'Tarde', sess: n.pm });
  if (n.fis) out.push({ slot: 'fis', label: SLOT_LABEL.fis, sess: n.fis });
  return out;
}
function isDoubleDay(raw) {
  const n = normDay(raw);
  return !!(n && n.am && n.pm);
}
// RPE format v2 (double days): entry = { am: {rpe,fatigue,note}, pm: {...} }
// Legacy: entry = { rpe, fatigue, note }
function normRPE(entry) {
  if (!entry) return null;
  if (entry.am !== undefined || entry.pm !== undefined || entry.fis !== undefined) return { am: entry.am || null, pm: entry.pm || null, fis: entry.fis || null };
  return { am: entry, pm: null, fis: null };
}
function rpeSubmissions(entry) {

// ============================================================
// RPE COLOR
// ============================================================
// Clasifica el delta RPE reportado − objetivo con margen de tolerancia.
// ±1 es variación normal (no es señal); ±2 vale la pena mirar; ±3+ es discrepancia
// grande en cualquier dirección (mucho más duro o mucho más fácil de lo planeado).
function deltaClass(delta) {
  const abs = Math.abs(delta);
  if (abs <= 1) return 'good';
  if (abs === 2) return 'warn';
  return 'bad';
}
function rpeColor(v) {
  if (!v) return '#555';
  if (v <= 3) return '#1e8449';
  if (v <= 5) return '#5a9e1e';
  if (v <= 6) return '#d4860f';
  if (v <= 8) return '#d2691e';
  return '#c0392b';
}
function contrastText(hex) {
  const c = hex.replace('#','');
  const r = parseInt(c.substr(0,2),16), g = parseInt(c.substr(2,2),16), b = parseInt(c.substr(4,2),16);
  const lum = (0.299*r + 0.587*g + 0.114*b) / 255;
  return lum > 0.6 ? '#1a2a3a' : '#fff';
}

// ============================================================
// RENDER AT-NOTES
// ============================================================
function renderTextWithNotes(text) {
  if (!text) return '';
  return renderBraceBlocks(text);
}
// Bloques con llaves "N×{ … }", anidables (los mismos que multiplica parseMeters).
// Cada bloque: "N×" y debajo una línea vertical con su contenido. Sin "}" de
// cierre el texto se deja tal cual.
function renderBraceBlocks(s, nivel) {
  nivel = nivel || 0;
  const col = nivel === 0 ? '#0a4fc4' : 'var(--accent2)';
  const re = /(\d+)\s*[xX×]\s*\{/g;
  let html = '', pos = 0, m;
  while ((m = re.exec(s))) {
    let depth = 1, i = re.lastIndex;
    for (; i < s.length && depth > 0; i++) {
      if (s[i] === '{') depth++; else if (s[i] === '}') depth--;
    }
    if (depth !== 0) continue;
    html += renderPlainBlocks(s.slice(pos, m.index).replace(/\s+$/, ''));
    html += '<span style="display:block;color:' + col + ';font-weight:700;letter-spacing:1px;margin-top:2px">' + m[1] + '×</span>'
          + '<span style="display:block;border-left:2px solid ' + col + ';margin-left:6px;padding-left:12px;margin-bottom:2px">'
          + renderBraceBlocks(s.slice(re.lastIndex, i - 1).trim(), nivel + 1) + '</span>';
    pos = i; re.lastIndex = i;
  }
  return html + renderPlainBlocks(s.slice(pos).replace(/^\s+/, ''));
}
function renderPlainBlocks(text) {
  if (!text) return '';
  // Modelo de bloque por indentación (sin llaves):
  //   - Una línea que empieza con "N×" o "Nx" abre un bloque de repetición.
  //   - Las líneas siguientes pertenecen al bloque (se muestran sangradas).
  //   - Una línea EN BLANCO cierra el bloque.
  //   - Texto suelto tras el cierre se muestra normal.
  const rawLines = text.split('\n');
  const out = [];
  let insideBlock = false;
  const openerRe = /^(\d+)\s*[xX\u00d7]\s*$/;        // "2×" o "2x" solos
  const openerInlineRe = /^(\d+)\s*[xX\u00d7]\s+(.+)$/; // "2× algo" (contenido en la misma línea)

  for (let i = 0; i < rawLines.length; i++) {
    const line = rawLines[i];
    const trimmed = line.trim();

    // Línea en blanco: cierra bloque si estaba abierto; separa visualmente
    if (!trimmed) {
      if (insideBlock) insideBlock = false;
      out.push('\n');
      continue;
    }

    // ¿Abre bloque? ("2×" sola, o "2× 4x50 ...")
    const mSolo = trimmed.match(openerRe);
    const mInline = trimmed.match(openerInlineRe);
    if (mSolo || mInline) {
      insideBlock = true;
      const n = (mSolo || mInline)[1];
      out.push(`\n<span style="color:var(--accent2);font-weight:700;letter-spacing:1px">${n}\u00d7</span>`);
      if (mInline && mInline[2].trim()) {
        out.push('\n  ' + renderInlineNotes(mInline[2].trim()));
      }
      continue;
    }

    // Línea normal (dentro o fuera de bloque)
    const indent = insideBlock ? '  ' : '';
    const parts = line.split(/(@[^@\n]+)/g);
    const rendered = parts.map(p => p.startsWith('@') ? `<span class="at-note">${escapeHtml(p)}</span>` : escapeHtml(p)).join('');
    out.push('\n' + indent + rendered.trim());
  }
  return out.join('').replace(/^\n+/, '').replace(/\n{3,}/g, '\n\n');
}
function renderInlineNotes(text) {
  if (!text) return '';
  return text.split(/(@[^@\n]+)/g)
    .map(p => p.startsWith('@') ? `<span class="at-note">${escapeHtml(p)}</span>` : escapeHtml(p)).join('');
}


// ============================================================
// ACWR CALCULATOR
// ============================================================
function calcACWR(athleteName) {
  try {
  const hist = DATA.athleteHist[athleteName] || [];
    if (hist.length < 3) return null;
    const today = new Date();
    // 1) Carga sRPE por entrada (RPE × duración), agrupada por DÍA.
    //    Un día con doble sesión suma am+pm (carga diaria real).
    const loadByDay = {};
    hist.forEach(function(h) {
      const d = dateObj(h.date);
      const daysAgo = Math.floor((today - d) / 86400000);
      if (daysAgo < 0 || daysAgo >= 28) return;
      const srpe = h.rpe * (h.duration || 80);
      loadByDay[h.date] = (loadByDay[h.date] || 0) + srpe;
    });
    // 2) Aguda = suma de carga de los últimos 7 días.
    //    Crónica = media semanal = suma de 28 días / 4.
    let acute = 0, chronic = 0;
    Object.keys(loadByDay).forEach(function(date) {
      const daysAgo = Math.floor((today - dateObj(date)) / 86400000);
      if (daysAgo < 7) acute += loadByDay[date];
      chronic += loadByDay[date];
    });
    const chronicWeekly = chronic / 4;
    if (chronicWeekly === 0) return null;
    // Días distintos con carga en la ventana crónica (28d). El ACWR no es
    // fiable hasta tener ~3 semanas de historia: antes, la ventana crónica
    // está casi vacía y el ratio sale artificialmente alto.
    const diasConCarga = Object.keys(loadByDay).length;
    const ratio = Math.round((acute / chronicWeekly) * 100) / 100;
    if (diasConCarga < 14) return { calibrating: true, days: diasConCarga, value: ratio };
    // 3) Ratio agudo:crónico (umbrales Gabbett 0.8–1.3 válidos con esta fórmula)
    return ratio;
  } catch(e) { return null; }
}
// Detecta si, dentro de la ventana de 28 días que usa el ACWR, hay entradas
// cuya duración cayó en el fallback de 80 min por no encontrar la sesión real
// (sesión borrada / dato huérfano) — no por la carrera de red ya corregida.
function acwrHasEstimated(athleteName) {
  const hist = DATA.athleteHist[athleteName] || [];
  const today = new Date();
  return hist.some(function(h) {
    const daysAgo = Math.floor((today - dateObj(h.date)) / 86400000);
    return daysAgo >= 0 && daysAgo < 28 && h.durationEstimated;
  });
}

// ============================================================
// MONOTONÍA Y STRAIN (Foster, 1998)
// Monotonía = carga media diaria (7d) ÷ desviación estándar de esa carga diaria.
// Captura lo que el ACWR no ve: una semana de RPE parejo día a día puede salir
// "Óptima" en ACWR y aun así ser de riesgo si no hay variación (Foster la
// vinculó a mayor incidencia de enfermedad/lesión incluso con carga moderada).
// Strain = carga semanal total × monotonía.
// Desviación estándar muestral (n-1), consistente con las guías prácticas
// (hojas de cálculo STDEV) más citadas para este método.
function calcMonotonyStrain(athleteName) {
  try {
  const hist = DATA.athleteHist[athleteName] || [];
  const today = new Date();
  const loadByDay = {};
  hist.forEach(function(h) {
    const d = dateObj(h.date);
    const daysAgo = Math.floor((today - d) / 86400000);
    if (daysAgo < 0 || daysAgo >= 7) return;
    const srpe = h.rpe * (h.duration || 80);
    loadByDay[h.date] = (loadByDay[h.date] || 0) + srpe;
  });
  // Construir los 7 días calendario completos: los días sin sesión cuentan
  // como carga 0 (el descanso real es lo que baja la monotonía).
  const dailyLoads = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(today); d.setDate(d.getDate() - i);
    const key = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    dailyLoads.push(loadByDay[key] || 0);
  }
  const weeklyLoad = dailyLoads.reduce(function(a,b){ return a+b; }, 0);
  if (weeklyLoad === 0) return null;
  const n = dailyLoads.length;
  const mean = weeklyLoad / n;
  const variance = dailyLoads.reduce(function(a,b){ return a + Math.pow(b-mean, 2); }, 0) / (n - 1);
  const sd = Math.sqrt(variance);
  if (sd === 0) return { monotony: null, strain: null, weeklyLoad: Math.round(weeklyLoad), flatWeek: true };
  const monotony = Math.round((mean / sd) * 100) / 100;
  const strain = Math.round(weeklyLoad * monotony);
  return { monotony: monotony, strain: strain, weeklyLoad: Math.round(weeklyLoad), flatWeek: false };
  } catch(e) { return null; }
}
function monotonyLabel(m) {
  // Umbrales orientativos de la literatura (Foster/adaptaciones posteriores),
  // no un corte validado específicamente en natación juvenil — usar como guía,
  // no como diagnóstico automático.
  if (m === null) return { label: 'Sin variación', color: '#e74c3c' };
  if (m < 1.5) return { label: 'Bien variada', color: '#27ae60' };
  if (m <= 2.0) return { label: 'Moderada', color: '#f39c12' };
  return { label: 'Alta monotonía', color: '#e74c3c' };
}
function acwrLabel(ratio) {
  if (ratio === null) return null;
  if (typeof ratio === 'object' && ratio.calibrating) return { label: 'Calibrando', color: '#5a7085', icon: '○', calibrating: true };
  if (ratio < 0.8)  return { label: 'Subcarga', color: '#3498db', icon: '↓' };
  if (ratio <= 1.3) return { label: 'Óptimo',   color: '#27ae60', icon: '✓' };
  if (ratio <= 1.5) return { label: 'Atención', color: '#f39c12', icon: '⚠' };
  return              { label: 'Riesgo',    color: '#e74c3c', icon: '⚡' };
}
