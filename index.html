      banner.querySelector('#btn-open-result-form').onclick = function() { S.resultFormCompId = pend.id; render(); };
    } else if (pend && S.resultFormCompId === pend.id) {
      d.appendChild(buildResultForm(pend));
    }
  }

  // ── Barra HOY + Check-in de bienestar ──
  d.appendChild(buildHoyStrip());
  d.appendChild(buildWellnessCheckin());
  const comments = getComments();
  const todayComment = comments[todayS + '_' + S.athleteName];
  if (todayComment) {
    const cm = document.createElement('div');
    cm.style.cssText = 'background:rgba(255,255,255,0.55);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.8);border-left:3px solid #2980b9;border-radius:12px;padding:12px 14px;margin-bottom:14px;box-shadow:0 2px 12px rgba(100,140,180,0.12)';
    cm.innerHTML = '<div style="font-size:0.62rem;font-weight:800;letter-spacing:1.5px;color:#2980b9;margin-bottom:4px">MENSAJE DEL ENTRENADOR</div><div style="font-size:0.88rem;color:#1a2a3a">' + escapeHtml(todayComment) + '</div>';
    d.appendChild(cm);
  }

  // ── Banners competición ──
  const competitions = getCompetitions();
  competitions.filter(c => {
    const daysToStart = Math.ceil((dateObj(c.start) - today) / 86400000);
    return todayS <= c.end && daysToStart <= 25;
  }).sort((a,b) => a.start.localeCompare(b.start)).forEach(function(c) {
    const inscOpen = c.inscOpen && c.inscClose && todayS >= c.inscOpen && todayS <= c.inscClose;
    const diffDays = Math.ceil((dateObj(c.start) - today) / 86400000);
    const daysToClose = c.inscClose ? Math.ceil((dateObj(c.inscClose) - today) / 86400000) : null;
    const athleteObj = DATA.athletes.find(a => a.name === S.athleteName);
    const myInsc = athleteObj ? DATA.inscriptions.filter(i => i.competition_id === c.id && i.athlete_id === athleteObj.id) : [];
    const myCount = myInsc.length;
    const maxEv = c.maxEvents || 6;
    const banner = document.createElement('div');
    if (inscOpen) {
      const complete = myCount >= maxEv, hasAny = myCount > 0;
      if (complete || hasAny) {
        banner.style.cssText = 'background:rgba(30,132,73,0.1);border:1px solid rgba(30,132,73,0.4);border-radius:14px;padding:14px 16px;margin-bottom:12px';
        banner.innerHTML = '<div style="font-size:0.68rem;font-weight:800;letter-spacing:2px;color:#1e8449;text-transform:uppercase;margin-bottom:6px">' + (complete?'✓ INSCRIPCIÓN COMPLETA':'INSCRIPCIÓN EN CURSO') + '</div><div style="font-weight:700;font-size:0.95rem;color:#1a2a3a">' + escapeHtml(c.name) + '</div><div style="font-size:0.8rem;color:#4a6a8a;margin-top:4px">' + myCount + ' de ' + maxEv + ' pruebas' + (daysToClose!==null&&daysToClose>=0?' · Cierra en '+daysToClose+' día'+(daysToClose!==1?'s':''):'') + '</div>';
        if (!complete) { const gb=document.createElement('button'); gb.style.cssText='margin-top:10px;width:100%;padding:10px;border-radius:10px;border:1px solid rgba(30,132,73,0.5);background:rgba(30,132,73,0.12);color:#1e8449;font-weight:700;font-size:0.88rem;cursor:pointer'; gb.textContent='Completar inscripción →'; gb.onclick=function(){S.ath_tab=4;S.inscCompId=c.id;render();}; banner.appendChild(gb); }
      } else {
        banner.style.cssText = 'background:rgba(192,57,43,0.08);border:1px solid rgba(192,57,43,0.35);border-radius:14px;padding:14px 16px;margin-bottom:12px';
        banner.innerHTML = '<div style="font-size:0.68rem;font-weight:800;letter-spacing:2px;color:#c0392b;text-transform:uppercase;margin-bottom:6px">INSCRIPCIÓN ABIERTA</div><div style="font-weight:700;font-size:0.95rem;color:#1a2a3a">' + escapeHtml(c.name) + '</div><div style="font-size:0.8rem;color:#4a6a8a;margin-top:4px">' + (daysToClose!==null&&daysToClose>=0?'Cierra en '+daysToClose+' día'+(daysToClose!==1?'s':'')+' · ':'') + 'Máx. ' + maxEv + ' pruebas</div>';
        const gb=document.createElement('button'); gb.style.cssText='margin-top:10px;width:100%;padding:11px;border-radius:10px;border:none;background:linear-gradient(135deg,#c0392b,#e74c3c);color:#fff;font-weight:800;font-size:0.92rem;cursor:pointer'; gb.textContent='Inscribirme →'; gb.onclick=function(){S.ath_tab=4;S.inscCompId=c.id;render();}; banner.appendChild(gb);
      }
    } else {
      const label = diffDays===0?'¡HOY!':diffDays===1?'¡MAÑANA!':'En '+diffDays+' días';
      banner.className='alert-comp';
      banner.innerHTML='<div class="alert-comp-lbl">COMPETICIÓN PRÓXIMA</div><div style="font-weight:700;color:#1a2a3a">'+escapeHtml(c.name)+'</div><div style="font-size:0.85rem;color:#c0392b;font-weight:700;margin-top:4px">'+label+'</div>';
    }
    d.appendChild(banner);
  });

  // ── FUNCIONES DE ZONA ──
  function zoneColor(r) {
    if (r===null) return '#7a9ab8';
    if (r<0.8)  return '#2980b9';
    if (r<=1.3) return '#1e8449';
    if (r<=1.5) return '#c0621a';
    return '#c0392b';
  }
  function zoneLabel(r) {
    if (r===null) return 'Sin datos';
    if (r<0.8)  return '● CARGA BAJA';
    if (r<=1.3) return '● ÓPTIMO';
    if (r<=1.5) return '⚠ ATENCIÓN';
    return 'RIESGO';
  }
  function coachMsg(r) {
    if (r===null) return 'Registra sesiones para ver tu carga.';
    if (r<0.8)  return '<strong style="color:#2980b9">Carga baja.</strong> Puedes apretar un poco más esta semana.';
    if (r<=1.3) return '<strong style="color:#1e8449">Zona óptima.</strong> Carga equilibrada — mantén la intensidad.';
    if (r<=1.5) return '<strong style="color:#c0621a">Atención.</strong> Carga elevada — prioriza el descanso.';
    return '<strong style="color:#c0392b">Riesgo de sobrecarga.</strong> Reduce la carga esta semana.';
  }

  const acwrVal = calcACWR(S.athleteName);
  // Con <14 días de carga calcACWR devuelve {calibrating}: no es un número (antes salía NaN + "Riesgo")
  const acwrCal = (acwrVal && typeof acwrVal === 'object' && acwrVal.calibrating) ? acwrVal : null;
  const acwr = (acwrVal !== null && !acwrCal) ? Math.round(acwrVal * 100) / 100 : null;
  const col = zoneColor(acwr);
  const pctAngle = acwr !== null ? Math.min(acwr / 2.0, 1) * 340 - 90 : -90;

  // ── ANILLO ──
  const ringSection = document.createElement('div');
  ringSection.style.cssText = 'display:flex;flex-direction:column;align-items:center;margin-bottom:20px';
  const ringWrap = document.createElement('div');
  ringWrap.style.cssText = 'position:relative;width:170px;height:170px';
  ringWrap.innerHTML =
    '<svg viewBox="0 0 170 170" width="170" height="170" style="position:absolute;top:0;left:0">' +
      '<defs><filter id="rg2"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>' +
      '<circle cx="85" cy="85" r="68" fill="none" stroke="rgba(100,140,180,0.12)" stroke-width="13"/>' +
      '<circle cx="85" cy="85" r="68" fill="none" stroke="#2980b9" stroke-width="13" stroke-dasharray="42.7 384.8" stroke-dashoffset="0" transform="rotate(-90 85 85)" opacity="0.5"/>' +
      '<circle cx="85" cy="85" r="68" fill="none" stroke="#1e8449" stroke-width="13" stroke-dasharray="106.8 321.7" stroke-dashoffset="-42.7" transform="rotate(-90 85 85)" opacity="0.5"/>' +
      '<circle cx="85" cy="85" r="68" fill="none" stroke="#c0621a" stroke-width="13" stroke-dasharray="21.4 407.1" stroke-dashoffset="-149.5" transform="rotate(-90 85 85)" opacity="0.5"/>' +
      '<circle cx="85" cy="85" r="68" fill="none" stroke="#c0392b" stroke-width="13" stroke-dasharray="257.4 170.1" stroke-dashoffset="-170.9" transform="rotate(-90 85 85)" opacity="0.45"/>' +
      '<circle cx="85" cy="17" r="8" fill="' + col + '" transform="rotate(' + pctAngle + ' 85 85)" filter="url(#rg2)"/>' +
      '<circle cx="85" cy="17" r="3.5" fill="white" transform="rotate(' + pctAngle + ' 85 85)"/>' +
    '</svg>' +
    '<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">' +
      '<div style="font-size:0.58rem;letter-spacing:2.5px;color:#4a6a8a;font-weight:700;margin-bottom:2px">ACWR</div>' +
      '<div style="font-size:2.8rem;font-weight:900;line-height:1;color:' + col + '">' + (acwr!==null?acwr.toFixed(2):'—') + '</div>' +
      '<div style="font-size:0.62rem;font-weight:700;letter-spacing:1px;margin-top:5px;color:' + col + '">' + (acwrCal ? '○ CALIBRANDO' : zoneLabel(acwr)) + '</div>' +
    '</div>';
  ringSection.appendChild(ringWrap);

  // Mensaje coaching glass
  const msg = document.createElement('div');
  msg.style.cssText = 'margin-top:14px;padding:11px 18px;font-size:0.82rem;color:#4a6a8a;line-height:1.5;text-align:center;max-width:300px;background:rgba(255,255,255,0.55);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.8);border-radius:14px;box-shadow:0 2px 12px rgba(100,140,180,0.12)';
  msg.innerHTML = acwrCal ? '<strong>Calibrando.</strong> ' + acwrCal.days + ' de 14 días con carga en las últimas 4 semanas. Registra tu RPE en cada sesión.' : coachMsg(acwr);
  ringSection.appendChild(msg);
  d.appendChild(ringSection);

  // ── ASISTENCIA (mes en curso y total) ──
  if (!DATA.attendanceSum) {
    dbGetAttendanceSummary().then(function(map) { DATA.attendanceSum = map; render(); });
  } else {
    const att = DATA.attendanceSum[S.athleteName] || {};
    const attColOf = function(p) { return p == null ? '#7a9ab8' : p >= 85 ? '#1e8449' : p >= 70 ? '#c0621a' : '#c0392b'; };
    const attBlock = function(lbl, p, n, extra) {
      return '<div style="flex:1;' + (extra || '') + '"><div style="font-size:0.62rem;font-weight:800;letter-spacing:1.5px;color:#4a6a8a;text-transform:uppercase;margin-bottom:4px">' + lbl + '</div>' +
        '<div style="font-size:1.6rem;font-weight:900;color:' + attColOf(p) + '">' + (p == null ? '—' : Math.round(p) + '%') + '</div>' +
        '<div style="font-size:0.62rem;color:#7a9ab8;font-weight:600;margin-top:1px">' + (n ? n + (n === 1 ? ' sesión' : ' sesiones') : 'sin sesiones') + '</div></div>';
    };
    const attCard = document.createElement('div');
    attCard.style.cssText = 'display:flex;gap:16px;background:rgba(255,255,255,0.55);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.8);border-radius:14px;padding:14px 16px;margin-bottom:14px;box-shadow:0 2px 12px rgba(100,140,180,0.12)';
    attCard.innerHTML = attBlock('Asistencia · mes', att.pct_month, att.n_month) +
      attBlock('Asistencia · total', att.pct_total, att.n_total, 'border-left:1px solid rgba(100,140,180,0.2);padding-left:16px;');
    d.appendChild(attCard);
  }

  // ── 4 CARDS GLASS ──
  const grid = document.createElement('div');
  grid.style.cssText = 'display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px';

  // Datos
  const load7 = hist.filter(h => Math.ceil((today-dateObj(h.date))/86400000)<=6 && Math.ceil((today-dateObj(h.date))/86400000)>=0).reduce((s,h)=>s+h.rpe*(h.duration||80),0);
  const load7prev = hist.filter(h => { const d=Math.ceil((today-dateObj(h.date))/86400000); return d>=7&&d<=13; }).reduce((s,h)=>s+h.rpe*(h.duration||80),0);
  const loadDelta = load7prev>0 ? Math.round((load7-load7prev)/load7prev*100) : null;

  const mondayOff = today.getDay()===0?-6:1-today.getDay();
  const wkStart = new Date(today); wkStart.setDate(today.getDate()+mondayOff);
  const wkStartS = wkStart.toISOString().slice(0,10);
  let weekM = 0;
  for (let i=0;i<7;i++) {
    const dt=new Date(wkStart); dt.setDate(wkStart.getDate()+i);
    const ds=dt.toISOString().slice(0,10);
    const sess=getSession(ds);
    if (sess) {
      daySlots(sess).forEach(function(sl){ weekM += totalMeters(sl.sess); });
    }
  }
  const wkSess = hist.filter(h=>h.date>=wkStartS&&h.date<=todayS).length;
  const last5 = hist.slice(-5);
  const avg5 = last5.length>0?(last5.reduce((s,h)=>s+h.rpe,0)/last5.length).toFixed(1):null;

  function gc(lbl, body, glowCol) {
    const c = document.createElement('div');
    c.style.cssText = 'position:relative;overflow:hidden;padding:14px 15px;background:rgba(255,255,255,0.55);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.82);border-top:1px solid rgba(255,255,255,0.92);border-radius:16px;box-shadow:0 4px 20px rgba(100,140,180,0.14),inset 0 1px 0 rgba(255,255,255,0.9)';
    c.innerHTML = '<div style="position:absolute;top:0;left:20px;right:20px;height:2px;background:linear-gradient(90deg,transparent,'+glowCol+',transparent);border-radius:2px"></div>' +
      '<div style="font-size:0.6rem;letter-spacing:1.5px;color:#4a6a8a;font-weight:700;text-transform:uppercase;margin-bottom:7px">' + lbl + '</div>' + body;
    return c;
  }

  const deltaHtml = loadDelta!==null ? '<div style="font-size:0.68rem;margin-top:5px;font-weight:700;color:'+(loadDelta>15?'#c0392b':loadDelta>0?'#c0621a':'#1e8449')+'">'+(loadDelta>0?'↑':'↓')+' '+Math.abs(loadDelta)+'% vs sem. ant.</div>' : '';
  grid.appendChild(gc('Carga 7d', '<div style="font-size:1.75rem;font-weight:800;color:#1a2a3a;line-height:1">'+Math.round(load7)+'<span style="font-size:0.72rem;color:#4a6a8a;margin-left:3px">UA</span></div>'+deltaHtml, 'rgba(41,128,185,0.6)'));

  const mDisp = weekM>=1000?(weekM/1000).toFixed(1)+'<span style="font-size:0.72rem;color:#4a6a8a;margin-left:3px">km</span>':weekM+'<span style="font-size:0.72rem;color:#4a6a8a;margin-left:3px">m</span>';
  grid.appendChild(gc('Metros sem.', '<div style="font-size:1.75rem;font-weight:800;color:#1a2a3a;line-height:1">'+mDisp+'</div>', 'rgba(30,132,73,0.6)'));

  grid.appendChild(gc('Sesiones', '<div style="font-size:1.75rem;font-weight:800;color:#1a2a3a;line-height:1">'+wkSess+'<span style="font-size:0.72rem;color:#4a6a8a;margin-left:3px">esta sem.</span></div>', 'rgba(200,146,10,0.6)'));

  const dotsHtml = last5.length>0 ? last5.map(h=>'<div style="width:28px;height:28px;border-radius:50%;background:'+rpeColor(h.rpe)+';display:flex;align-items:center;justify-content:center;font-size:0.75rem;font-weight:800;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,0.15)">'+h.rpe+'</div>').join('') : '<span style="color:#4a6a8a;font-size:0.82rem">Sin datos</span>';
  const avgHtml = avg5!==null?'<div style="font-size:0.68rem;color:#4a6a8a;margin-top:6px;font-weight:600">Media: <strong style="color:#1a2a3a">'+avg5+'</strong></div>':'';
  grid.appendChild(gc('RPE últimas 5', '<div style="display:flex;gap:4px;margin-top:6px">'+dotsHtml+'</div>'+avgHtml, 'rgba(192,98,26,0.6)'));

  d.appendChild(grid);

  // ── GRÁFICO RPE ──
  if (hist.length > 1) {
    const stRPE = document.createElement('div'); stRPE.className = 'section-title'; stRPE.style.marginTop='10px'; stRPE.textContent = 'Últimas sesiones · RPE';
    d.appendChild(stRPE);
    d.appendChild(buildRPEChart(hist.slice(-14)));
  }

  // ── CALCULADORA DE RITMOS ──
  const stRitmo = document.createElement('div'); stRitmo.className = 'section-title'; stRitmo.style.marginTop='16px'; stRitmo.textContent = 'Calculadora de ritmos';
  d.appendChild(stRitmo);
  d.appendChild(buildRitmoCalc(S.ritmoMB));

  // ── Historial de lactato (colapsado, en segundo plano) ──
  if (DATA.athleteLactate && DATA.athleteLactate.length > 0) {
    const det = document.createElement('details'); det.style.cssText = 'margin-top:20px';
    const sum = document.createElement('summary'); sum.style.cssText = 'font-size:0.78rem;font-weight:700;color:var(--text2);cursor:pointer;padding:8px 0';
    sum.textContent = 'Historial de tests de lactato (' + DATA.athleteLactate.length + ')';
    det.appendChild(sum);
    DATA.athleteLactate.forEach(function(row) {
      const rowDet = document.createElement('details'); rowDet.style.cssText = 'margin-top:8px;border-top:1px solid rgba(100,140,180,0.15);padding-top:8px';
      const rowSum = document.createElement('summary'); rowSum.style.cssText = 'font-size:0.8rem;cursor:pointer;display:flex;justify-content:space-between';
      const p = LACTATE_PROTOCOLS[row.protocol] || {};
      rowSum.innerHTML = '<span>' + formatDateLabel(row.date) + ' · ' + escapeHtml(p.label || row.protocol) + '</span><strong>' + escapeHtml(row.threshold_pace100) + '</strong>';
      rowDet.appendChild(rowSum);
      rowDet.appendChild(buildLactateChart(row.steps, { v: row.threshold_speed, pace100: row.threshold_pace100 }, row.aerobic_speed ? { v: row.aerobic_speed, pace100: row.aerobic_pace100 } : null));
      det.appendChild(rowDet);
    });
    d.appendChild(det);
  }

  return d;
}

// ============================================================
// ATHLETE: MI RPE
// ============================================================
function buildAthleteRPE() {
  const d = document.createElement('div');
  // Botones con relieve, igual que el check-in: mismo color; el "apagado" es el color al 50%.
  const keycap = function(hex, on) {
    const rgb = [1,3,5].map(function(k){ return parseInt(hex.substr(k,2),16); }).join(',');
    return 'border:2px solid '+(on?'rgba(0,0,0,0.45)':'transparent')+';color:#fff;text-shadow:0 1px 1px rgba(0,0,0,0.25);opacity:1;filter:none;transition:transform .12s,box-shadow .12s;background:linear-gradient(180deg,rgba(255,255,255,0.30),rgba(255,255,255,0) 55%),'+(on?hex:'rgba('+rgb+',0.5)')+';'+(on?'transform:scale(1.06);box-shadow:0 2px 0 rgba(0,0,0,0.28),0 5px 10px rgba(0,0,0,0.2),inset 0 1px 0 rgba(255,255,255,0.5)':'box-shadow:0 2px 0 rgba(0,0,0,0.14),0 3px 6px rgba(0,0,0,0.10),inset 0 1px 0 rgba(255,255,255,0.45)');
  };
  const tabShadow = '0 2px 0 rgba(0,0,0,0.18),0 3px 8px rgba(0,0,0,0.12),inset 0 1px 0 rgba(255,255,255,0.35)';
  const st = document.createElement('div'); st.className = 'section-title'; st.textContent = 'Mi RPE';
  d.appendChild(st);

  // Selector Hoy / Ayer — solo estos dos, para no dejar cargar RPE de días viejos
  // (pierde precisión como recuerdo, y puede maquillar el ACWR reciente).
  const today = todayStr();
  const yesterday = yesterdayStr();
  if (!S.rpeDate) S.rpeDate = today;
  const dateTabs = document.createElement('div'); dateTabs.className = 'pack-toggle'; dateTabs.style.marginBottom = '10px';
  [[today, 'Hoy'], [yesterday, 'Ayer']].forEach(function(pair) {
    const btn = document.createElement('button');
    btn.className = 'pack-btn' + (S.rpeDate === pair[0] ? ' active' : '');
    btn.style.boxShadow = tabShadow;
    btn.textContent = pair[1];
    btn.onclick = function() { S.rpeDate = pair[0]; S.rpeSlot = null; S.rpeSelected = null; S.fatigueSelected = null; S.rpeNote = ''; render(); };
    dateTabs.appendChild(btn);
  });
  d.appendChild(dateTabs);

  const rpeDate = S.rpeDate;
  const rawSession = getSession(rpeDate);
  const slots = daySlots(rawSession);
  const double = slots.length > 1;

  // Determine active slot: S.rpeSlot ('am'|'pm'), default first un-submitted
  const entry = normRPE(getDayRPE(rpeDate)[S.athleteName]) || { am: null, pm: null, fis: null };
  // Lo que está en cola (aún no confirmado por el servidor) cuenta como "enviado"
  // para la UI: evita que el atleta lo cargue dos veces mientras no hay red.
  ['am', 'pm', 'fis'].forEach(function(k) {
    const q = findQueuedRPE(rpeDate, k, S.athleteName);
    if (q && !entry[k]) { entry[k] = { rpe: q.rpe, fatigue: q.fatigue, pending: true }; }
  });
  // Turno activo: el RPE se guarda en el turno REAL de la sesión (am/pm/fis),
  // así el ACWR cruza con la duración correcta. Sin sesión → 'am' como antes.
  const slotKeys = slots.length > 0 ? slots.map(function(s) { return s.slot; }) : ['am'];
  if (!S.rpeSlot || slotKeys.indexOf(S.rpeSlot) === -1) {
    S.rpeSlot = slotKeys.find(function(k) { return !entry[k]; }) || slotKeys[0];
  }

  // Session info card
  const sessionCard = document.createElement('div'); sessionCard.className = 'card'; sessionCard.style.marginBottom='16px';
  if (slots.length > 0) {
    sessionCard.innerHTML = slots.map(function(s) {
      return '<div class="card-title">' + (s.label ? s.label + ' — ' : '') + escapeHtml(s.sess.title) + '</div>'
        + '<div class="card-sub">RPE objetivo: <strong>' + s.sess.targetRPE + '</strong></div>';
    }).join('<div style="height:6px"></div>');
  } else {
    sessionCard.innerHTML = '<div class="card-sub" style="text-align:center">Sin sesión ' + (rpeDate === today ? 'para hoy' : 'para ayer') + '</div>';
  }
  d.appendChild(sessionCard);

  // Slot tabs for double days
  if (double) {
    const slotTabs = document.createElement('div'); slotTabs.className = 'pack-toggle'; slotTabs.style.marginBottom = '14px';
    slots.map(function(s) { return [s.slot, SLOT_LABEL[s.slot]]; }).forEach(function(pair) {
      const done = entry && entry[pair[0]];
      const btn = document.createElement('button');
      btn.className = 'pack-btn' + (S.rpeSlot === pair[0] ? ' active' : '');
      btn.style.boxShadow = tabShadow;
      btn.innerHTML = pair[1] + (done ? ' ✓' : '');
      btn.onclick = function() { S.rpeSlot = pair[0]; S.rpeSelected = null; S.fatigueSelected = null; S.rpeNote = ''; render(); };
      slotTabs.appendChild(btn);
    });
    d.appendChild(slotTabs);
  }

  // Already submitted this slot?
  const slotEntry = entry ? entry[S.rpeSlot] : null;
  if (slotEntry) {
    const fat = FATIGUE.find(function(f){return f.v===slotEntry.fatigue;}) || FATIGUE[0];
    const pendingNote = slotEntry.pending
      ? '<div style="margin-top:10px;font-size:0.74rem;color:#f39c12;font-weight:700">Guardado en el dispositivo — se enviará solo cuando vuelva la conexión</div>'
      : '';
    const cs = document.createElement('div'); cs.className = 'confirm-screen';
    cs.innerHTML = '<div class="confirm-emoji"><svg viewBox="0 0 64 64" width="76" height="76" fill="none"><circle cx="32" cy="32" r="30" fill="#0f9d58" opacity=".14"/><circle cx="32" cy="32" r="22" fill="#0f9d58"/><path d="M22.5 32.5l6.5 6.5 12.5-13" stroke="#fff" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="confirm-rpe" style="color:' + rpeColor(slotEntry.rpe) + '">' + slotEntry.rpe + '</div><div class="confirm-label">RPE registrado · <span style="color:' + fat.color + '">' + fat.label + '</span></div><div style="margin-top:20px;font-size:0.8rem;color:var(--text2)">Ya registraste tu RPE' + (double ? ' de este turno' : (rpeDate === today ? ' hoy' : ' de ayer')) + '</div>' + pendingNote;
    d.appendChild(cs);
    return d;
  }

  if (S.rpeSubmitted) {
    const fat = FATIGUE.find(function(f){return f.v===S.fatigueSelected;}) || FATIGUE[0];
    const cs = document.createElement('div'); cs.className = 'confirm-screen';
    cs.innerHTML = '<div class="confirm-emoji"><svg viewBox="0 0 64 64" width="76" height="76" fill="none"><circle cx="32" cy="32" r="30" fill="#0f9d58" opacity=".14"/><circle cx="32" cy="32" r="22" fill="#0f9d58"/><path d="M22.5 32.5l6.5 6.5 12.5-13" stroke="#fff" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="confirm-rpe" style="color:' + rpeColor(S.rpeSelected) + '">' + S.rpeSelected + '</div><div class="confirm-label">Registrado · <span style="color:' + fat.color + '">' + fat.label + '</span></div>';
    d.appendChild(cs);
    S.rpeSubmitted = false;
    return d;
  }

  // RPE selector
  const st1 = document.createElement('div'); st1.className = 'section-title'; st1.textContent = '¿Cómo fue el esfuerzo?';
  d.appendChild(st1);
  const rpeGrid = document.createElement('div'); rpeGrid.className = 'rpe-grid';
  for (let v = 1; v <= 10; v++) {
    const btn = document.createElement('button'); btn.className = 'rpe-btn';
    btn.textContent = v; btn.style.cssText = 'height:46px;padding:0;font-size:1.2rem;font-weight:800;' + keycap(rpeColor(v), S.rpeSelected===v);
    btn.onclick = () => { S.rpeSelected = v; render(); };
    rpeGrid.appendChild(btn);
  }
  d.appendChild(rpeGrid);

  // Fatigue
  const st2 = document.createElement('div'); st2.className = 'section-title'; st2.style.marginTop='20px'; st2.textContent = '¿Cómo estás?';
  d.appendChild(st2);
  const fatGrid = document.createElement('div'); fatGrid.className = 'fatigue-grid';
  FATIGUE.forEach(f => {
    const sel = S.fatigueSelected===f.v;
    const btn = document.createElement('button'); btn.className = 'fatigue-btn';
    btn.textContent = f.label; btn.style.cssText = 'height:42px;padding:0 6px;font-size:0.88rem;font-weight:' + (sel ? '800' : '700') + ';' + keycap(f.color, sel);
    btn.onclick = () => { S.fatigueSelected = f.v; render(); };
    fatGrid.appendChild(btn);
  });
  d.appendChild(fatGrid);

  // Note
  const noteLbl = document.createElement('label'); noteLbl.className = 'field-label'; noteLbl.style.marginTop='16px'; noteLbl.textContent = 'Nota (opcional)';
  d.appendChild(noteLbl);
  const noteIn = document.createElement('input'); noteIn.type='text'; noteIn.maxLength=300; noteIn.placeholder='¿Algo que destacar?'; noteIn.value=S.rpeNote;
  noteIn.oninput = e => { S.rpeNote = e.target.value; };
  d.appendChild(noteIn);

  // Submit
  const submitBtn = document.createElement('button'); submitBtn.className='btn btn-primary'; submitBtn.style.marginTop='20px';
  submitBtn.textContent = 'Registrar RPE' + (double ? (S.rpeSlot === 'am' ? ' (Mañana)' : (S.rpeSlot === 'fis' ? ' (Físico)' : ' (Tarde)')) : '');
  submitBtn.onclick = () => {
    if (!S.rpeSelected || !S.fatigueSelected) {
      alert('Selecciona RPE y estado de fatiga'); return;
    }
    const slotKey = S.rpeSlot;
    const btnLabel = submitBtn.textContent;
    submitBtn.disabled = true; submitBtn.textContent = 'Guardando…';
    dbSaveRPE(rpeDate, slotKey, S.athleteName, S.rpeSelected, S.fatigueSelected, S.rpeNote).then(function(res) {
      if (!res) {
        if (SB_STATUS === 'offline') {
          // Sin red: no se pierde. Se guarda en el dispositivo y se reenvía solo al reconectar.
          queueRPE(rpeDate, slotKey, S.athleteName, S.rpeSelected, S.fatigueSelected, S.rpeNote);
          S.rpeSubmitted = true;
          render();
          return;
        }
        // fallo NO relacionado a conexión (ej. clave inválida) — ahí sí hay que reintentar a mano
        submitBtn.disabled = false;
        submitBtn.textContent = '⚠ No se guardó — reintenta';
        submitBtn.style.background = '#e74c3c';
        setTimeout(function(){ submitBtn.textContent = btnLabel; submitBtn.style.background = ''; }, 2800);
        return;
      }
      S.rpeSubmitted = true;
      renderAsync();
    }).catch(function() {
      // fetch tiró excepción (típico de estar realmente offline): mismo tratamiento que arriba
      queueRPE(rpeDate, slotKey, S.athleteName, S.rpeSelected, S.fatigueSelected, S.rpeNote);
      S.rpeSubmitted = true;
      render();
    });
  };
  d.appendChild(submitBtn);
  return d;
}

// ATHLETE: SESIÓN (tab 4 — sesión de hoy)

function buildAthleteSession() {
  const d = document.createElement('div');
  const st = document.createElement('div'); st.className = 'section-title'; st.textContent = 'Sesión';
  d.appendChild(st);
  const today = new Date();
  const todayS = todayStr();

  // Hoy abierto por defecto la primera vez
  if (S.athDayOpen[todayS] === undefined) S.athDayOpen[todayS] = true;

  // Semana: lunes a domingo
  const mondayOffset = today.getDay() === 0 ? -6 : 1 - today.getDay();

  for (let i = 0; i < 7; i++) {
    const dt = new Date(today);
    dt.setDate(today.getDate() + mondayOffset + i);
    const ds = dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0') + '-' + String(dt.getDate()).padStart(2,'0');
    const session = getSession(ds);
    const slots = daySlots(session);
    const isToday = ds === todayS;
    const isPast = ds < todayS;

    // Ocultar días pasados sin sesión
    if (isPast && slots.length === 0) continue;

    const dc = document.createElement('div');
    dc.className = 'day-card' + (isToday ? ' today-card' : '');
    if (!isToday && slots.length === 0) dc.classList.add('greyed');

    // Header clicable
    const titles = slots.length > 0
      ? slots.map(function(s){ return (s.label ? s.label + ' ' : '') + escapeHtml(s.sess.title); }).join(' · ')
      : 'Sin sesión';
    const totalM = slots.reduce(function(acc, slotObj) {
      const sess = slotObj.sess;
      if (sess.phase === 'Fuerza') return acc;
      return acc + totalMeters(sess);
    }, 0);

    const dch = document.createElement('div'); dch.className = 'day-card-header';
    const dayLabel = DAYS_ES[dt.getDay()] + ' ' + dt.getDate();
    const doubleTag = slots.length > 1 ? ' <span style="font-size:0.65rem;color:var(--gold);font-weight:700">' + slots.length + 'x</span>' : '';
    const todayBadge = isToday ? ' <span style="font-size:0.65rem;background:var(--accent2);color:#fff;padding:1px 6px;border-radius:4px;font-weight:700">HOY</span>' : '';
    const metersTag = totalM > 0 ? ' <span style="font-size:0.72rem;color:var(--accent2)">' + totalM + 'm</span>' : '';
    const arrow = slots.length > 0 ? (S.athDayOpen[ds] ? ' ▾' : ' ▸') : '';

    dch.innerHTML = '<div style="flex:1"><div class="day-name">' + dayLabel + doubleTag + todayBadge + '</div><div class="day-phase">' + titles + metersTag + '</div></div>';
    if (slots.length > 0) {
      const tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = slots[0].sess.phase;
      dch.appendChild(tag);
      const arrowEl = document.createElement('span');
      arrowEl.style.cssText = 'color:var(--text2);font-size:0.85rem;margin-left:8px';
      arrowEl.textContent = S.athDayOpen[ds] ? '▾' : '▸';
      dch.appendChild(arrowEl);
    }

    if (slots.length > 0) {
      dch.onclick = function() { S.athDayOpen[ds] = !S.athDayOpen[ds]; render(); };
    }
    dc.appendChild(dch);

    // Body colapsable
    if (slots.length > 0 && S.athDayOpen[ds]) {
      const body = document.createElement('div'); body.className = 'day-card-body open';
      slots.forEach(function(slotObj, slotIdx) {
        const sess = slotObj.sess;
        if (slots.length > 1) {
          const slotHdr = document.createElement('div');
          slotHdr.style.cssText = 'font-size:0.78rem;font-weight:700;color:var(--gold);margin-top:' + (slotIdx > 0 ? '16px' : '10px') + ';padding-bottom:4px;border-bottom:1px solid var(--border)';
          slotHdr.textContent = slotObj.label || (slotIdx === 0 ? 'Mañana' : 'Tarde');
          body.appendChild(slotHdr);
        }
        if (sess.phase === 'Fuerza') {
          if (sess.alphaPhase) { const ap = document.createElement('div'); ap.innerHTML = '<span class="tag" style="margin-bottom:8px">' + escapeHtml(sess.alphaPhase) + '</span>'; body.appendChild(ap); }
          [['Pull', sess.pullText],['Push', sess.pushText],['Lower Body', sess.lowerText]].forEach(function(pair) {
            if (!pair[1]) return;
            const ss = document.createElement('div'); ss.className = 'session-section';
            ss.innerHTML = '<div class="section-lbl">' + pair[0] + '</div><div class="session-lines">' + renderTextWithNotes(pair[1]) + '</div>';
            body.appendChild(ss);
          });
        } else {
          [['Warm Up', sess.warmUp],['Pre Set', sess.preSet],['Main Set (Grupo)', sess.mainSet],['Main Set (Fondo)', sess.mainSetFondo],['Cool Down', sess.coolDown]].forEach(function(pair) {
            if (!pair[1]) return;
            const m = metersLabel(pair[1]);
            const ss = document.createElement('div'); ss.className = 'session-section';
            ss.innerHTML = '<div class="section-lbl">' + pair[0] + (m ? ' <span style=\"color:var(--accent2);font-weight:normal\">(' + m + ')</span>' : '') + '</div><div class="session-lines">' + renderTextWithNotes(pair[1]) + '</div>';
            body.appendChild(ss);
          });
          const volB = buildVolumeBlock(sess, slots.length > 1 ? slotObj.slot.toUpperCase() + ' ' : '');
          if (volB) body.appendChild(volB);
        }
      });
      dc.appendChild(body);
    }
    d.appendChild(dc);
  }
  return d;
}

// RITMO CALCULADORA
// ============================================================
const ZONAS = [
  { label:'AERO B',         pulso:'24 pulso', pct:65,  dist:100, color:'#2980b9' },
  { label:'UMB. AE.',       pulso:'26 pulso', pct:75,  dist:100, color:'#27ae60' },
  { label:'UMB. ANER.',     pulso:'28 pulso', pct:80,  dist:100, color:'#f39c12' },
  { label:'MEDIA CAP. AE.', pulso:'VO2 +8',   pct:85,  dist:100, color:'#e67e22' },
  { label:'ALTA CAP. AE.',  pulso:'rit400',   pct:90,  dist:100, color:'#e74c3c' },
  { label:'LACT. CAPAC.',   pulso:'',          pct:100, dist:50,  color:'#8e44ad' },
  { label:'LACT. POTENCIA', pulso:'',          pct:105, dist:50,  color:'#6c3483' },
  { label:'ALACT. CAPAC.',  pulso:'',          pct:112, dist:35,  color:'#1a252f' },
  { label:'ALACT. POT.',    pulso:'',          pct:120, dist:25,  color:'#17202a' },
];

function secsToMMSS(s) {
  const m = Math.floor(s / 60);
  const sec = s - m * 60;
  return m + ':' + (sec < 10 ? '0' : '') + sec.toFixed(2);
}

function calcRitmos(mbSecs) {
  // Mejora 1%
  const mb = mbSecs * 99 / 100;
  return ZONAS.map(function(z) {
    const tZona = mb * (200 - z.pct) / 100;  // tiempo por 100m
    const tDist = tZona * z.dist / 100;       // tiempo para distancia de la zona
    const vel = z.dist / tDist;               // m/s
    return {
      label: z.label,
      pulso: z.pulso,
      pct: z.pct,
      dist: z.dist,
      color: z.color,
      tZona: tZona,     // tiempo por 100m en segs
      tDist: tDist,     // tiempo para dist (50/35/25m)
      vel: vel,
      t100: secsToMMSS(tZona),
      tDistStr: secsToMMSS(tDist),
      velStr: vel.toFixed(3)
    };
  });
}

function buildRitmoCalc(mbInput) {
  const wrap = document.createElement('div');

  // Input MB
  const inpWrap = document.createElement('div');
  inpWrap.className = 'card';
  inpWrap.style.cssText = 'padding:16px;margin-bottom:14px;background:rgba(255,255,255,0.62);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.82);border-radius:14px;box-shadow:0 2px 16px rgba(100,140,180,0.15),inset 0 1px 0 rgba(255,255,255,0.9)';
  inpWrap.innerHTML = '<div style="font-size:0.68rem;font-weight:800;letter-spacing:2px;color:var(--text);margin-bottom:12px">MARCA BASE 100m CROL</div>' +
    '<div style="display:flex;gap:10px;align-items:flex-end;margin-bottom:12px">' +
    '<div style="flex:2"><div style="font-size:0.72rem;color:var(--text2);margin-bottom:4px">MIN</div>' +
    '<input id="ritmo-min" type="number" min="0" max="5" placeholder="0" style="width:100%;box-sizing:border-box;font-size:2rem;font-weight:700;text-align:center;padding:12px 8px;border-radius:10px" value="' + (mbInput ? mbInput.m : '') + '"></div>' +
    '<div style="font-size:2rem;color:var(--text2);padding-bottom:10px;font-weight:300">:</div>' +
    '<div style="flex:4"><div style="font-size:0.72rem;color:var(--text2);margin-bottom:4px">SEG</div>' +
    '<input id="ritmo-seg" type="number" min="0" max="59.99" step="0.01" placeholder="58.24" style="width:100%;box-sizing:border-box;font-size:2rem;font-weight:700;text-align:center;padding:12px 8px;border-radius:10px" value="' + (mbInput ? mbInput.s : '') + '"></div>' +
    '</div>' +
    '<button id="btn-calc-ritmo" class="btn btn-primary" style="width:100%;padding:12px;font-size:0.9rem;letter-spacing:1px">CALCULAR</button>';
  wrap.appendChild(inpWrap);

  if (mbInput && mbInput.mbSecs > 0) {
    const ritmos = calcRitmos(mbInput.mbSecs);
    const mbMejorada = mbInput.mbSecs * 99 / 100;

    // MB info
    const mbCard = document.createElement('div');
    mbCard.style.cssText = 'padding:8px 14px;margin-bottom:12px;font-size:0.82rem;color:var(--text2)';
    mbCard.innerHTML = 'MB: <strong style="color:var(--text)">' + secsToMMSS(mbInput.mbSecs) + '</strong> · Con mejora 1%: <strong style="color:var(--accent2)">' + secsToMMSS(mbMejorada) + '</strong>';
    wrap.appendChild(mbCard);

    // Tabla de zonas
    ritmos.forEach(function(r) {
      const card = document.createElement('div');
      card.className = 'card';
      card.style.cssText = 'padding:0;margin-bottom:8px;overflow:hidden;border-left:3px solid ' + r.color;

      const header = document.createElement('div');
      header.style.cssText = 'display:flex;align-items:center;justify-content:space-between;padding:10px 14px 6px';
      header.innerHTML =
        '<div>' +
          '<div style="font-size:0.68rem;font-weight:800;letter-spacing:1.5px;color:' + r.color + '">' + r.label + ' · ' + r.pct + '%' + (r.pulso ? ' · ' + r.pulso : '') + '</div>' +
        '</div>' +
        '<div style="font-size:0.72rem;color:var(--text2)">' + r.dist + 'm: <strong style="color:var(--text);font-size:0.95rem">' + r.tDistStr + '</strong></div>';
      card.appendChild(header);

      const detail = document.createElement('div');
      detail.style.cssText = 'display:flex;gap:0;border-top:1px solid var(--border)';

      [
        ['100m', r.t100],
        [r.dist + 'm', r.tDistStr],
        ['m/s', r.velStr]
      ].forEach(function(pair) {
        const cell = document.createElement('div');
        cell.style.cssText = 'flex:1;padding:8px 10px;text-align:center;border-right:1px solid var(--border)';
        cell.innerHTML = '<div style="font-size:0.62rem;color:var(--text2);text-transform:uppercase;margin-bottom:2px">' + pair[0] + '</div><div style="font-size:0.92rem;font-weight:700;color:var(--text)">' + pair[1] + '</div>';
        detail.appendChild(cell);
      });
      card.appendChild(detail);
      wrap.appendChild(card);
    });
  }

  // Handler calcular
  wrap.addEventListener('click', function(e) {
    if (e.target.id === 'btn-calc-ritmo') {
      const m = parseFloat(document.getElementById('ritmo-min').value) || 0;
      const s = parseFloat(document.getElementById('ritmo-seg').value) || 0;
      const mbSecs = m * 60 + s;
      if (mbSecs > 0) {
        S.ritmoMB = { m, s, mbSecs };
        render();
      }
    }
  });

  return wrap;
}

    dbSaveResult(S.athleteName, comp.id, payload).then(function(ok) {
      if (!ok) { showConfirm('No se pudo guardar', 'Hubo un error de conexión. Intentá de nuevo.', function(){}); return; }
      S.resultFormCompId = null; S._resultDraft = null;
      DATA.pendingSurvey[S.athleteName] = undefined; // forzar recheck (puede haber más de una pendiente)
      render();
    });
  };
  return wrap;
}

// Helper: RPE line chart SVG
function buildLactateChart(steps, threshold, aerobic) {
  const pts0 = steps.filter(function(s){ return s.time_s > 0; }).map(function(s){ return { v: s.distance / s.time_s, lac: s.lactate }; });
  if (pts0.length < 2) return document.createElement('div');
  const W = 340, H = 240, PAD = { top:24, right:20, bottom:38, left:38 };
  const iW = W - PAD.left - PAD.right, iH = H - PAD.top - PAD.bottom;
  const vMin = Math.min.apply(null, pts0.map(function(p){return p.v;})), vMax = Math.max.apply(null, pts0.map(function(p){return p.v;}));
  const vSpan = (vMax - vMin) || 1;
  const lacMax = Math.max(10, Math.max.apply(null, pts0.map(function(p){return p.lac;})) * 1.15);
  const xPos = v => PAD.left + ((v - vMin) / vSpan) * iW;
  const yPos = l => PAD.top + iH - (l / lacMax) * iH;
  const pts = pts0.map(function(p){ return { x: xPos(p.v), y: yPos(p.lac), v: p.v, lac: p.lac }; });

  // Curva suavizada tipo Catmull-Rom -> Bézier cúbica
  function smoothPath(p) {
    if (p.length < 3) return 'M' + p[0].x + ' ' + p[0].y + ' L' + p[p.length-1].x + ' ' + p[p.length-1].y;
    let d = 'M' + p[0].x + ' ' + p[0].y;
    for (let i = 0; i < p.length - 1; i++) {
      const p0 = p[i === 0 ? 0 : i-1], p1 = p[i], p2 = p[i+1], p3 = p[i+2 < p.length ? i+2 : i+1];
      const c1x = p1.x + (p2.x - p0.x) / 6, c1y = p1.y + (p2.y - p0.y) / 6;
      const c2x = p2.x - (p3.x - p1.x) / 6, c2y = p2.y - (p3.y - p1.y) / 6;
      d += ' C' + c1x + ' ' + c1y + ', ' + c2x + ' ' + c2y + ', ' + p2.x + ' ' + p2.y;
    }
    return d;
  }
  const linePath = smoothPath(pts);
  const areaPath = linePath + ' L' + pts[pts.length-1].x + ' ' + (PAD.top+iH) + ' L' + pts[0].x + ' ' + (PAD.top+iH) + ' Z';

  // Grid horizontal
  let grid = '';
  const gridSteps = 4;
  for (let i = 0; i <= gridSteps; i++) {
    const l = (lacMax / gridSteps) * i;
    grid += '<line x1="'+PAD.left+'" y1="'+yPos(l)+'" x2="'+(PAD.left+iW)+'" y2="'+yPos(l)+'" stroke="rgba(100,140,180,0.14)" stroke-width="1"/>';
  }

  const dots = pts.map(function(p){
    return '<circle cx="'+p.x+'" cy="'+p.y+'" r="4.5" fill="#ffffff" stroke="#1a6fa8" stroke-width="2.5"/>' +
      '<text x="'+p.x+'" y="'+(p.y-10)+'" font-size="9.5" font-weight="700" fill="#1a2a3a" text-anchor="middle">'+p.lac.toFixed(1)+'</text>';
  }).join('');

  const refLine = function(val, color, label) {
    const ly = yPos(val);
    const lw = label.length * 5.2 + 8;
    return '<line x1="'+PAD.left+'" y1="'+ly+'" x2="'+(PAD.left+iW)+'" y2="'+ly+'" stroke="'+color+'" stroke-width="1.3" stroke-dasharray="5,4" opacity="0.85"/>' +
      '<rect x="'+(PAD.left+iW-lw)+'" y="'+(ly-12)+'" width="'+lw+'" height="12" fill="rgba(255,255,255,0.85)"/>' +
      '<text x="'+(PAD.left+iW-4)+'" y="'+(ly-3)+'" font-size="9" fill="'+color+'" font-weight="700" text-anchor="end">'+label+'</text>';
  };
  const refLines = refLine(4.0, '#c0392b', '4.0 · OBLA') + refLine(2.0, '#2980b9', '2.0 · LT1');

  function marker(th, color, labelY) {
    if (!th) return '';
    const tx = xPos(th.v);
    return '<line x1="'+tx+'" y1="'+PAD.top+'" x2="'+tx+'" y2="'+(PAD.top+iH)+'" stroke="'+color+'" stroke-width="1.3" stroke-dasharray="2,3" opacity="0.6"/>' +
      '<circle cx="'+tx+'" cy="'+(PAD.top+iH+3)+'" r="3.5" fill="'+color+'"/>' +
      '<rect x="'+(tx-24)+'" y="'+labelY+'" width="48" height="15" rx="7" fill="'+color+'"/>' +
      '<text x="'+tx+'" y="'+(labelY+11)+'" font-size="8.5" font-weight="700" fill="white" text-anchor="middle">'+th.pace100+'</text>';
  }
  const markers = marker(threshold, '#1e8449', PAD.top - 22) + marker(aerobic, '#2980b9', PAD.top - 4);

  const xLabels = pts0.map(function(p){ return '<text x="'+xPos(p.v)+'" y="'+(H-6)+'" font-size="8.5" fill="#4a6a8a" text-anchor="middle">'+p.v.toFixed(2)+'</text>'; }).join('');
  const axisTitle = '<text x="'+(PAD.left+iW/2)+'" y="'+(H+2)+'" font-size="8" fill="#7a9ab8" text-anchor="middle"></text>' +
    '<text x="4" y="'+(PAD.top+iH/2)+'" font-size="8" fill="#7a9ab8" text-anchor="middle" transform="rotate(-90 4 '+(PAD.top+iH/2)+')">mmol/L</text>';

  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox','0 0 '+W+' '+H); svg.setAttribute('width','100%'); svg.setAttribute('height',H);
  svg.innerHTML =
    '<defs><linearGradient id="lacFill" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="#1a6fa8" stop-opacity="0.28"/><stop offset="100%" stop-color="#1a6fa8" stop-opacity="0"/>' +
    '</linearGradient></defs>' +
    grid + refLines +
    '<path d="'+areaPath+'" fill="url(#lacFill)"/>' +
    '<path d="'+linePath+'" fill="none" stroke="#1a6fa8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>' +
    markers + dots + xLabels + axisTitle;

  const card = document.createElement('div'); card.className = 'card';
  card.style.cssText = 'padding:14px 10px 6px;margin-top:12px;background:linear-gradient(180deg, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0.55) 100%)';
  const cap = document.createElement('div'); cap.style.cssText = 'font-size:0.72rem;font-weight:700;color:var(--text2);text-align:center;margin-bottom:4px;letter-spacing:0.5px';
  cap.textContent = 'CURVA DE LACTATO — velocidad (m/s)';
  card.appendChild(cap); card.appendChild(svg);
  return card;
}

function buildRPEChart(last14) {
  const W = 320, H = 160, PAD = { top:16, right:16, bottom:28, left:28 };
  const iW = W - PAD.left - PAD.right, iH = H - PAD.top - PAD.bottom;
  const n = last14.length;
  const xPos = i => PAD.left + (i / (n - 1)) * iW;
  const yPos = v => PAD.top + iH - ((v - 1) / 9) * iH;
  const gradStops = last14.map((h, i) => '<stop offset="' + Math.round((i/(n-1))*100) + '%" stop-color="' + rpeColor(h.rpe) + '" stop-opacity="0.3"/>').join('');
  function curvePath(pts, close) {
    let d = 'M' + pts[0].x + ' ' + pts[0].y;
    for (let i = 1; i < pts.length; i++) {
      const cx = (pts[i-1].x + pts[i].x) / 2;
      d += ' C' + cx + ' ' + pts[i-1].y + ' ' + cx + ' ' + pts[i].y + ' ' + pts[i].x + ' ' + pts[i].y;
    }
    if (close) { d += ' L' + pts[n-1].x + ' ' + (PAD.top+iH) + ' L' + pts[0].x + ' ' + (PAD.top+iH) + ' Z'; }
    return d;
  }
  const pts = last14.map((h,i) => ({x:xPos(i),y:yPos(h.rpe)}));
  const yGrids = [3,5,7].map(v => '<line x1="'+PAD.left+'" y1="'+yPos(v)+'" x2="'+(PAD.left+iW)+'" y2="'+yPos(v)+'" stroke="rgba(100,140,180,0.18)" stroke-width="1"/>').join('');
  const yLabels = [1,3,5,7,10].map(v => '<text x="'+(PAD.left-5)+'" y="'+(yPos(v)+4)+'" font-size="9" fill="#3a5a7a" text-anchor="end">'+v+'</text>').join('');
  const xLabels = last14.map((h,i) => { if (i%3!==0 && i!==n-1) return ''; const dt=dateObj(h.date); return '<text x="'+xPos(i)+'" y="'+(H-4)+'" font-size="8" fill="#3a5a7a" text-anchor="middle">'+dt.getDate()+'/'+(dt.getMonth()+1)+'</text>'; }).join('');
  const dots = last14.map((h,i) => { const cx=xPos(i),cy=yPos(h.rpe); return '<circle cx="'+cx+'" cy="'+cy+'" r="4" fill="'+rpeColor(h.rpe)+'" stroke="white" stroke-width="2"/><text x="'+cx+'" y="'+(cy-8)+'" font-size="9" fill="'+rpeColor(h.rpe)+'" text-anchor="middle" font-weight="700">'+h.rpe+'</text>'; }).join('');
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox','0 0 '+W+' '+H); svg.setAttribute('width','100%'); svg.setAttribute('height',H);
  svg.innerHTML = '<defs><linearGradient id="rpeGrad2" x1="0%" y1="0%" x2="100%" y2="0%">'+gradStops+'</linearGradient></defs>'+yGrids+yLabels+xLabels+'<path d="'+curvePath(pts,true)+'" fill="url(#rpeGrad2)"/><path d="'+curvePath(pts,false)+'" fill="none" stroke="#1a4a7a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>'+dots;
  const card = document.createElement('div'); card.className='card'; card.style.cssText='padding:12px 8px;background:rgba(255,255,255,0.65);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.82);box-shadow:0 2px 16px rgba(100,140,180,0.15),inset 0 1px 0 rgba(255,255,255,0.9)';
  card.appendChild(svg);
  return card;
}

// Helper: ACWR bar chart SVG (últimas 8 semanas)
function buildACWRChart(hist) {
  // Calcular ACWR semanal rolling (últimas 8 semanas desde hoy)
  const today = new Date();
  const weeks = [];
  for (let w = 7; w >= 0; w--) {
    const weekEnd = new Date(today); weekEnd.setDate(today.getDate() - w * 7);
    const weekStart = new Date(weekEnd); weekStart.setDate(weekEnd.getDate() - 6);
    const acute = hist.reduce((s,h) => {
      const d = dateObj(h.date);
      return (d >= weekStart && d <= weekEnd) ? s + h.rpe * (h.duration || 80) : s;
    }, 0);
    const chronStart = new Date(weekEnd); chronStart.setDate(weekEnd.getDate() - 27);
    const chronic28 = hist.reduce((s,h) => {
      const d = dateObj(h.date);
      return (d >= chronStart && d <= weekEnd) ? s + h.rpe * (h.duration || 80) : s;
    }, 0);
    const chronicWeekly = chronic28 / 4;
    const ratio = chronicWeekly > 0 ? Math.round((acute / chronicWeekly) * 100) / 100 : null;
    const label = (weekEnd.getDate()) + '/' + (weekEnd.getMonth()+1);
    weeks.push({ label, ratio });
  }

  const W = 320, H = 140, PAD = { top:16, right:10, bottom:28, left:36 };
  const iW = W - PAD.left - PAD.right, iH = H - PAD.top - PAD.bottom;
  const maxR = 2.0;
  const barW = Math.floor(iW / weeks.length) - 4;

  function acwrBarColor(r) {
    if (r === null) return '#334';
    if (r < 0.8) return '#3498db';
    if (r <= 1.3) return '#27ae60';
    if (r <= 1.5) return '#f39c12';
    return '#e74c3c';
  }

  const yLines = [0.8, 1.0, 1.3, 1.5].map(v => {
    const y = PAD.top + iH - (v / maxR) * iH;
    const dash = v === 1.0 ? '' : ' stroke-dasharray="3,3"';
    return '<line x1="'+PAD.left+'" y1="'+y+'" x2="'+(PAD.left+iW)+'" y2="'+y+'" stroke="rgba(100,140,180,0.2)"'+dash+' stroke-width="1"/>'
      + '<text x="'+(PAD.left-4)+'" y="'+(y+3)+'" font-size="8" fill="#3a5a7a" text-anchor="end">'+v+'</text>';
  }).join('');

  const bars = weeks.map((w, i) => {
    const x = PAD.left + i * (barW + 4);
    const ratio = w.ratio;
    const barH = ratio !== null ? Math.min((ratio / maxR) * iH, iH) : 0;
    const y = PAD.top + iH - barH;
    const col = acwrBarColor(ratio);
    const val = ratio !== null ? ratio.toFixed(2) : '—';
    return '<rect x="'+x+'" y="'+y+'" width="'+barW+'" height="'+barH+'" rx="3" fill="'+col+'" opacity="0.85"/>'
      + '<text x="'+(x+barW/2)+'" y="'+(y-4)+'" font-size="8" fill="'+col+'" text-anchor="middle" font-weight="700">'+(ratio!==null?val:'')+' </text>'
      + '<text x="'+(x+barW/2)+'" y="'+(H-4)+'" font-size="7" fill="#3a5a7a" text-anchor="middle">'+w.label+'</text>';
  }).join('');

  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox','0 0 '+W+' '+H); svg.setAttribute('width','100%'); svg.setAttribute('height',H);
  svg.innerHTML = yLines + bars;
  const card = document.createElement('div'); card.className='card'; card.style.cssText='padding:12px 8px;background:rgba(255,255,255,0.65);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.82);box-shadow:0 2px 16px rgba(100,140,180,0.15),inset 0 1px 0 rgba(255,255,255,0.9)';
  card.appendChild(svg);
  return card;
}

function inscWinStatus(comp) {
  const t = todayStr();
  if (!comp.inscOpen || !comp.inscClose) return 'before';
  if (t < comp.inscOpen) return 'before';
  if (t > comp.inscClose) return 'after';
  return 'open';
}
function inscFmtDate(ds) {
  const d = dateObj(ds);
  return d.getDate() + ' ' + MONTHS_ES[d.getMonth()].toLowerCase().slice(0,3);
}
function inscEligibleComps() {
  const t = todayStr();
  return getCompetitions().filter(function(c){ return c.end >= t; });
}
function inscStrokeGroups() {
  const groups = [];
  DATA.events.forEach(function(ev){
    let g = groups.find(function(x){ return x.stroke === ev.stroke; });
    if (!g) { g = { stroke: ev.stroke, events: [] }; groups.push(g); }
    g.events.push(ev);
  });
  return groups;
}
function inscForComp(compId) {
  return DATA.inscriptions.filter(function(i){ return i.competition_id === compId; });
}
function inscBanner(comp) {
  const st = inscWinStatus(comp);
  const div = document.createElement('div');
  if (st === 'open') {
    const left = Math.ceil((dateObj(comp.inscClose) - new Date()) / 86400000) + 1;
    div.className = 'insc-deadline';
    div.textContent = 'Inscripción abierta · cierra el ' + inscFmtDate(comp.inscClose) + ' (' + Math.max(left,1) + (left===1?' día':' días') + ')';
  } else if (st === 'before') {
    div.className = 'insc-deadline win-before';
    div.textContent = 'Se abre el ' + inscFmtDate(comp.inscOpen);
  } else {
    div.className = 'insc-deadline win-after';
    div.textContent = 'Inscripción cerrada el ' + inscFmtDate(comp.inscClose);
  }
  return div;
}
function inscCompCard(comp) {
  const card = document.createElement('div');
  card.className = 'welcome-card';
  card.innerHTML = '<div style="font-size:0.65rem;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px">' + escapeHtml(comp.type || 'Competición') + '</div>'
    + '<div style="font-size:1.15rem;font-weight:700;line-height:1.25">' + escapeHtml(comp.name) + '</div>'
    + '<div style="font-size:0.8rem;color:var(--text2);margin-top:6px">' + escapeHtml(comp.location || '—') + ' &nbsp; ' + inscFmtDate(comp.start) + ' – ' + inscFmtDate(comp.end) + '</div>';
  card.appendChild(inscBanner(comp));
  return card;
}
function inscCompSelector(comps, activeId, onPick) {
  const sel = document.createElement('div');
  sel.className = 'insc-comp-sel';
  comps.forEach(function(c){
    const b = document.createElement('button');
    b.textContent = c.name.length > 22 ? c.name.slice(0,22) + '…' : c.name;
    if (c.id === activeId) b.className = 'on';
    b.onclick = function(){ onPick(c.id); };
    sel.appendChild(b);
  });
  return sel;
}

function buildAthleteInscripcions() {
  const d = document.createElement('div');
  const stTop = document.createElement('div'); stTop.className = 'section-title'; stTop.textContent = 'Inscripciones';
  d.appendChild(stTop);
  const comps = inscEligibleComps();

  if (comps.length === 0) {
    const empty = document.createElement('div'); empty.className = 'empty-state';
    empty.innerHTML = 'No hay competiciones próximas.<br>Cuando el entrenador añada una al calendario, podrás inscribirte aquí.';
    d.appendChild(empty);
    return d;
  }

  // comp activa: la elegida o la primera con ventana abierta, si no la más próxima
  let comp = comps.find(function(c){ return c.id === S.inscCompId; });
  if (!comp) comp = comps.find(function(c){ return inscWinStatus(c) === 'open'; }) || comps[0];
  S.inscCompId = comp.id;

  if (comps.length > 1) d.appendChild(inscCompSelector(comps, comp.id, function(id){ S.inscCompId = id; S.inscSelComp = null; render(); }));
  d.appendChild(inscCompCard(comp));

  const athlete = DATA.athletes.find(function(a){ return a.name === S.athleteName; });
  if (!athlete) { d.appendChild(Object.assign(document.createElement('div'), { className:'empty-state', textContent:'No se encontró tu ficha de nadador.' })); return d; }

  const mine = inscForComp(comp.id).filter(function(i){ return i.athlete_id === athlete.id; }).map(function(i){ return i.event_code; });
  const st = inscWinStatus(comp);

  // inicializar selección local desde DB al entrar / cambiar de comp
  if (S.inscSelComp !== comp.id) { S.inscSel = mine.slice(); S.inscSelComp = comp.id; }

  if (st !== 'open') {
    const msg = document.createElement('div');
    msg.className = 'card';
    msg.style.cssText = 'padding:16px;font-size:0.88rem;color:var(--text2);line-height:1.5';
    msg.innerHTML = st === 'before'
      ? 'Todavía no puedes inscribirte. La inscripción se abre <b style="color:var(--text)">25 días antes</b> de la competición y cierra <b style="color:var(--text)">8 días antes</b>.'
      : 'El plazo ha finalizado. Si necesitas un cambio, habla con el entrenador.';
    d.appendChild(msg);
    if (mine.length > 0) {
      const t = document.createElement('div'); t.className = 'section-title'; t.style.marginTop = '14px'; t.textContent = 'Tus pruebas inscritas';
      d.appendChild(t);
      mine.forEach(function(ev){
        const r = document.createElement('div');
        r.className = 'card';
        r.style.cssText = 'padding:12px 16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:600;font-size:0.9rem';
        r.innerHTML = '<span>' + ev + '</span><span style="color:var(--green);font-weight:800">✓</span>';
        d.appendChild(r);
      });
    }
    return d;
  }

  // ── ventana abierta: chips ──
  const maxEv = comp.maxEvents || 6;
  const head = document.createElement('div');
  head.style.cssText = 'display:flex;align-items:center;justify-content:space-between;margin:14px 0 4px';
  head.innerHTML = '<div style="font-size:0.95rem;font-weight:700">Elige tus pruebas</div>';
  const cnt = document.createElement('span');
  cnt.className = 'insc-counter' + (S.inscSel.length >= maxEv ? ' full' : '');
  cnt.textContent = S.inscSel.length + ' / ' + maxEv;
  head.appendChild(cnt);
  d.appendChild(head);

  inscStrokeGroups().forEach(function(g){
    const lbl = document.createElement('div'); lbl.className = 'stroke-label'; lbl.textContent = g.stroke;
    d.appendChild(lbl);
    const chips = document.createElement('div'); chips.className = 'insc-chips';
    g.events.forEach(function(ev){
      const isSel = S.inscSel.indexOf(ev.code) !== -1;
      const c = document.createElement('div');
      c.className = 'insc-chip' + (isSel ? ' sel' : '') + (!isSel && S.inscSel.length >= maxEv ? ' dis' : '');
      c.textContent = ev.distance;
      c.onclick = function(){
        const idx = S.inscSel.indexOf(ev.code);
        if (idx !== -1) S.inscSel.splice(idx, 1);
        else if (S.inscSel.length < maxEv) S.inscSel.push(ev.code);
        render();
      };
      chips.appendChild(c);
    });
    d.appendChild(chips);
  });

  const changed = mine.slice().sort().join('|') !== S.inscSel.slice().sort().join('|');
  const btn = document.createElement('button');
  btn.className = 'btn btn-primary';
  btn.style.cssText = 'width:100%;margin-top:18px;padding:15px;font-size:1rem;font-weight:700;border-radius:12px';
  btn.textContent = changed ? 'Enviar inscripción' : (mine.length > 0 ? '✓ Inscripción enviada' : 'Enviar inscripción');
  if (!changed && mine.length > 0) { btn.style.background = 'var(--green)'; btn.style.color = '#fff'; }
  btn.onclick = function(){
    if (S.inscSel.length === 0 && mine.length === 0) { btn.textContent = 'Elige al menos una prueba'; setTimeout(function(){ btn.textContent = 'Enviar inscripción'; }, 1600); return; }
    btn.disabled = true; btn.textContent = 'Guardando…';
    dbSaveInscription(comp.id, athlete.id, S.inscSel).then(function(res){
      if (!res.ok) {
        // Mostrar el motivo real que devuelve el trigger check_inscription
        // en vez de un "Error" genérico que no dice nada.
        var motivo = 'Error — reintenta';
        if (SB_LAST_ERROR.indexOf('INSCRIPCIO_TANCADA') !== -1) motivo = 'Inscripción cerrada';
        else if (SB_LAST_ERROR.indexOf('MAXIM_PROVES') !== -1) motivo = 'Máximo de pruebas alcanzado';
        else if (SB_STATUS === 'offline') motivo = 'Sin conexión — reintenta';
        btn.disabled = false; btn.textContent = motivo;
        setTimeout(function(){ btn.textContent = 'Enviar inscripción'; }, 3000);
        return;
      }

  d.appendChild(btn);

}

// La librería del Excel viene de un CDN: si no cargó (mala señal, bloqueador), se intenta otra vez al usarla
let _xlsxLoading = null;
function ensureXLSX() {
  if (window.XLSX) return Promise.resolve();
  if (_xlsxLoading) return _xlsxLoading;
  // Primero la versión con formato (negritas, colores); si no llega, la normal (sale sin formato)
  const load = function(src) {
    return new Promise(function(resolve, reject) {
      const s = document.createElement('script');
      s.src = src;
      const timer = setTimeout(function() { s.onload = s.onerror = null; reject(new Error('timeout')); }, 12000);
      s.onload = function() { clearTimeout(timer); window.XLSX ? resolve() : reject(new Error('sin XLSX')); };
      s.onerror = function() { clearTimeout(timer); reject(new Error('no cargó')); };
      document.head.appendChild(s);
    });
  };
  _xlsxLoading = load('https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js').catch(function() { return load('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'); }).then(function() { _xlsxLoading = null; }, function(e) { _xlsxLoading = null; throw e; });
  return _xlsxLoading;
}

// Excel de inscripciones: título, una fila por nadador, una columna por prueba con inscritos (X), año y total
function inscBuildWorkbook(comp, athletes, byAthlete, rows) {
  const used = DATA.events.filter(function(e){ return rows.some(function(i){ return i.event_code === e.code; }); });
  const evs = used.length ? used : DATA.events;
  const nCols = evs.length + 3;
  const when = comp.start ? (formatDateLabel(comp.start) + (comp.end && comp.end !== comp.start ? ' – ' + formatDateLabel(comp.end) : '')) : '';
  const title = [comp.name].concat(new Array(nCols - 1).fill(''));
  const sub = [[when, comp.location].filter(Boolean).join(' · ')].concat(new Array(nCols - 1).fill(''));
  const header = ['Nadador', 'Año'].concat(evs.map(function(e){ return e.code; }), ['Total']);
  const body = athletes.map(function(a){
    const mine = byAthlete[a.id] || [];
    return [a.name, a.birth_date ? Number(String(a.birth_date).slice(0, 4)) : '']
      .concat(evs.map(function(e){ return mine.indexOf(e.code) !== -1 ? 'X' : ''; }), [mine.length || '']);
  });
  const foot = ['TOTAL', ''].concat(evs.map(function(e){ return rows.filter(function(i){ return i.event_code === e.code; }).length; }), [rows.length]);
  const ws = XLSX.utils.aoa_to_sheet([title, sub, [], header].concat(body, [foot]));
  ws['!merges'] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: nCols - 1 } }, { s: { r: 1, c: 0 }, e: { r: 1, c: nCols - 1 } }];
  ws['!cols'] = [{ wch: 28 }, { wch: 7 }].concat(evs.map(function(){ return { wch: 8 }; }), [{ wch: 7 }]);
  ws['!rows'] = [{ hpt: 24 }, { hpt: 16 }, { hpt: 8 }, { hpt: 30 }];
  // Formato (lo usa la librería con estilos; la normal lo ignora)
  const line = { style: 'thin', color: { rgb: 'C9D6E3' } };
  const box = { top: line, bottom: line, left: line, right: line };
  const set = function(r, c, s) { const ref = XLSX.utils.encode_cell({ r: r, c: c }); if (!ws[ref]) ws[ref] = { t: 's', v: '' }; ws[ref].s = s; };
  set(0, 0, { font: { bold: true, sz: 16, color: { rgb: '0B2236' } } });
  set(1, 0, { font: { sz: 11, color: { rgb: '5B6B7B' } } });
  for (let c = 0; c < nCols; c++) {
    set(3, c, { font: { bold: true, color: { rgb: 'FFFFFF' } }, fill: { fgColor: { rgb: '1F6FD1' } }, border: box,
      alignment: { horizontal: c === 0 ? 'left' : 'center', vertical: 'center', wrapText: true } });
  }
  body.forEach(function(row, i) {
    const r = 4 + i;
    const zebra = i % 2 ? { fill: { fgColor: { rgb: 'F2F7FC' } } } : {};
    for (let c = 0; c < nCols; c++) {
      const isMark = c >= 2 && c < nCols - 1;
      set(r, c, Object.assign({ border: box, alignment: { horizontal: c === 0 ? 'left' : 'center', vertical: 'center' } }, zebra,
        isMark ? { font: { bold: true, sz: 12, color: { rgb: '0B2236' } } } : c === nCols - 1 ? { font: { bold: true } } : {}));
    }
  });
  const fr = 4 + body.length;
  const top = { style: 'medium', color: { rgb: '1F6FD1' } };
  for (let c = 0; c < nCols; c++) {
    set(fr, c, { font: { bold: true }, fill: { fgColor: { rgb: 'E3EEFA' } }, border: { top: top, bottom: line, left: line, right: line },
      alignment: { horizontal: c === 0 ? 'left' : 'center', vertical: 'center' } });
  }
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Inscripciones');
  return wb;
}
function inscFileName(comp) {
  return 'inscripciones_' + comp.name.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '') + '.xlsx';
}
function buildInscShareCard(comp, athletes, byAthlete, rows) {
  const card = document.createElement('div'); card.className = 'card insc-share';
  card.innerHTML = '<div class="t">Enviar inscripciones</div><div class="s">Excel con una fila por nadador y sus pruebas marcadas con X</div>';
  const row = document.createElement('div'); row.className = 'row';
  const share = document.createElement('button'); share.className = 'share'; share.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 13v6h14v-6"/></svg>Compartir';
  const dl = document.createElement('button'); dl.className = 'dl'; dl.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5"/><path d="M5 19h14"/></svg>Descargar';
  const name = inscFileName(comp);
  const download = function() {
    XLSX.writeFile(inscBuildWorkbook(comp, athletes, byAthlete, rows), name);
    dl.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5"/><path d="M5 19h14"/></svg>Descargado';
    setTimeout(function(){ dl.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5"/><path d="M5 19h14"/></svg>Descargar'; }, 2000);
  };
  const excelFailed = function() { showToast('No se pudo preparar el Excel. Revisa la conexión y vuelve a intentarlo.', 'error'); };
  dl.onclick = function() {
    if (window.XLSX) { download(); return; }
    ensureXLSX().then(download).catch(excelFailed);
  };
  share.onclick = function() {
    // Si la librería del Excel no llegó a cargar, se carga ahora. Compartir necesita el toque del usuario,
    // así que después de cargarla se pide tocar otra vez.
    if (!window.XLSX) {
      ensureXLSX().then(function() { showToast('Excel listo: toca Compartir otra vez.'); }).catch(excelFailed);
      return;
    }
    // Menú de compartir del teléfono (WhatsApp, Mail, Archivos…) con el Excel adjunto; si no se puede, se descarga
    try {
      const data = XLSX.write(inscBuildWorkbook(comp, athletes, byAthlete, rows), { bookType: 'xlsx', type: 'array' });
      const file = new File([data], name, { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: 'Inscripciones · ' + comp.name }).catch(function(){});
        return;
      }
    } catch (e) { console.error('compartir excel', e); }
    download();
  };
  row.append(share, dl);
  card.appendChild(row);
  return card;
}

function checkGoogleRedirect() {
  if (window.location.hash.includes('access_token')) {
    const params = new URLSearchParams(window.location.hash.substring(1));
    const token = params.get('access_token');
    const type = params.get('type');
    if (token && type === 'recovery') {
      S.recoveryToken = token;
      S.showResetScreen = true;
      history.replaceState(null, '', window.location.pathname);
    } else if (token) {
      SB_ACCESS_TOKEN = token;
      history.replaceState(null, '', window.location.pathname);
    }
  }
}

// Solo en modo standalone (abierto desde el ícono, no desde Safari) iOS a veces
// restaura el foco/teclado de la última vez que se usó la app, ANTES de que el
// usuario toque nada. Un timer no lo puede ganar de forma confiable porque no
// sabemos cuándo lo va a hacer iOS. En cambio: cualquier foco que aparezca
// antes del primer toque real del usuario se cancela al instante, sin importar
// el momento — apenas el usuario toca algo de verdad, el guardia se desactiva
// solo y el resto de la app funciona 100% normal.
(function() {
  let userInteracted = false;
  const markInteracted = function() { userInteracted = true; };
  document.addEventListener('touchstart', markInteracted, { once: true, passive: true, capture: true });
  document.addEventListener('mousedown', markInteracted, { once: true, passive: true, capture: true });
  document.addEventListener('focusin', function(e) {
    if (!userInteracted && e.target && e.target !== document.body && typeof e.target.blur === 'function') {
      e.target.blur();
    }
  }, true);
})();

async function restoreAthleteSession() {

    S.role = 'athlete'; S.athleteName = saved.name; S.ath_tab = 0;

}
