// ============================================================
// INSCRIPCIONS — helpers
// ============================================================
function inscWinStatus(comp) {
  const t = todayStr();
  if (!comp.inscOpen || !comp.inscClose) return 'before';
  if (t < comp.inscOpen) return 'before';
  if (t > comp.inscClose) return 'after';
  return 'open';
}
function inscFmtDate(ds) {
  const d = dateObj(ds);
  return d.getDate() + ' ' + MONTHS_ES[d.getMonth()].toLowerCase().slice(0,3);
}
function inscEligibleComps() {
  const t = todayStr();
  return getCompetitions().filter(function(c){ return c.end >= t; });
}
function inscStrokeGroups() {
  const groups = [];
  DATA.events.forEach(function(ev){
    let g = groups.find(function(x){ return x.stroke === ev.stroke; });
    if (!g) { g = { stroke: ev.stroke, events: [] }; groups.push(g); }
    g.events.push(ev);
  });
  return groups;
}
function inscForComp(compId) {
  return DATA.inscriptions.filter(function(i){ return i.competition_id === compId; });
}
function inscBanner(comp) {
  const st = inscWinStatus(comp);
  const div = document.createElement('div');
  if (st === 'open') {
    const left = Math.ceil((dateObj(comp.inscClose) - new Date()) / 86400000) + 1;
    div.className = 'insc-deadline';
    div.textContent = '⏳ Inscripción abierta · cierra el ' + inscFmtDate(comp.inscClose) + ' (' + Math.max(left,1) + (left===1?' día':' días') + ')';
  } else if (st === 'before') {
    div.className = 'insc-deadline win-before';
    div.textContent = '🔒 Se abre el ' + inscFmtDate(comp.inscOpen);
  } else {
    div.className = 'insc-deadline win-after';
    div.textContent = '🔒 Inscripción cerrada el ' + inscFmtDate(comp.inscClose);
  }
  return div;
}
function inscCompCard(comp) {
  const card = document.createElement('div');
  card.className = 'welcome-card';
  card.innerHTML = '<div style="font-size:0.65rem;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px">' + (comp.type || 'Competición') + '</div>'
    + '<div style="font-size:1.15rem;font-weight:700;line-height:1.25">' + comp.name + '</div>'
    + '<div style="font-size:0.8rem;color:var(--text2);margin-top:6px">📍 ' + (comp.location || '—') + ' &nbsp; 📅 ' + inscFmtDate(comp.start) + ' – ' + inscFmtDate(comp.end) + '</div>';
  card.appendChild(inscBanner(comp));
  return card;
}
function inscCompSelector(comps, activeId, onPick) {
  const sel = document.createElement('div');
  sel.className = 'insc-comp-sel';
  comps.forEach(function(c){
    const b = document.createElement('button');
    b.textContent = c.name.length > 22 ? c.name.slice(0,22) + '…' : c.name;
    if (c.id === activeId) b.className = 'on';
    b.onclick = function(){ onPick(c.id); };
    sel.appendChild(b);
  });
  return sel;
}

// ============================================================
// ATHLETE: INSCRIPCIONS
// ============================================================
function buildAthleteInscripcions() {
  const d = document.createElement('div');
  const comps = inscEligibleComps();

  if (comps.length === 0) {
    d.innerHTML = '<div class="empty-state">No hay competiciones próximas.<br>Cuando el entrenador añada una al calendario, podrás inscribirte aquí.</div>';
    return d;
  }

  // comp activa: la elegida o la primera con ventana abierta, si no la más próxima
  let comp = comps.find(function(c){ return c.id === S.inscCompId; });
  if (!comp) comp = comps.find(function(c){ return inscWinStatus(c) === 'open'; }) || comps[0];
  S.inscCompId = comp.id;

  if (comps.length > 1) d.appendChild(inscCompSelector(comps, comp.id, function(id){ S.inscCompId = id; S.inscSelComp = null; render(); }));
  d.appendChild(inscCompCard(comp));

  const athlete = DATA.athletes.find(function(a){ return a.name === S.athleteName; });
  if (!athlete) { d.appendChild(Object.assign(document.createElement('div'), { className:'empty-state', textContent:'No se encontró tu ficha de nadador.' })); return d; }

  const mine = inscForComp(comp.id).filter(function(i){ return i.athlete_id === athlete.id; }).map(function(i){ return i.event_code; });
  const st = inscWinStatus(comp);

  // inicializar selección local desde DB al entrar / cambiar de comp
  if (S.inscSelComp !== comp.id) { S.inscSel = mine.slice(); S.inscSelComp = comp.id; }

  if (st !== 'open') {
    const msg = document.createElement('div');
    msg.className = 'card';
    msg.style.cssText = 'padding:16px;font-size:0.88rem;color:var(--text2);line-height:1.5';
    msg.innerHTML = st === 'before'
      ? 'Todavía no puedes inscribirte. La inscripción se abre <b style="color:var(--text)">20 días antes</b> de la competición y dura <b style="color:var(--text)">5 días</b>.'
      : 'El plazo ha finalizado. Si necesitas un cambio, habla con el entrenador.';
    d.appendChild(msg);
    if (mine.length > 0) {
      const t = document.createElement('div'); t.className = 'section-title'; t.style.marginTop = '14px'; t.textContent = 'TUS PRUEBAS INSCRITAS';
      d.appendChild(t);
      mine.forEach(function(ev){
        const r = document.createElement('div');
        r.className = 'card';
        r.style.cssText = 'padding:12px 16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:600;font-size:0.9rem';
        r.innerHTML = '<span>' + ev + '</span><span style="color:var(--green);font-weight:800">✓</span>';
        d.appendChild(r);
      });
    }
    return d;
  }

  // ── ventana abierta: chips ──
  const maxEv = comp.maxEvents || 4;
  const head = document.createElement('div');
  head.style.cssText = 'display:flex;align-items:center;justify-content:space-between;margin:14px 0 4px';
  head.innerHTML = '<div style="font-size:0.95rem;font-weight:700">Elige tus pruebas</div>';
  const cnt = document.createElement('span');
  cnt.className = 'insc-counter' + (S.inscSel.length >= maxEv ? ' full' : '');
  cnt.textContent = S.inscSel.length + ' / ' + maxEv;
  head.appendChild(cnt);
  d.appendChild(head);

  inscStrokeGroups().forEach(function(g){
    const lbl = document.createElement('div'); lbl.className = 'stroke-label'; lbl.textContent = g.stroke;
    d.appendChild(lbl);
    const chips = document.createElement('div'); chips.className = 'insc-chips';
    g.events.forEach(function(ev){
      const isSel = S.inscSel.indexOf(ev.code) !== -1;
      const c = document.createElement('div');
      c.className = 'insc-chip' + (isSel ? ' sel' : '') + (!isSel && S.inscSel.length >= maxEv ? ' dis' : '');
      c.textContent = ev.distance;
      c.onclick = function(){
        const idx = S.inscSel.indexOf(ev.code);
        if (idx !== -1) S.inscSel.splice(idx, 1);
        else if (S.inscSel.length < maxEv) S.inscSel.push(ev.code);
        render();
      };
      chips.appendChild(c);
    });
    d.appendChild(chips);
  });

  const changed = mine.slice().sort().join('|') !== S.inscSel.slice().sort().join('|');
  const btn = document.createElement('button');
  btn.className = 'btn btn-primary';
  btn.style.cssText = 'width:100%;margin-top:18px;padding:15px;font-size:1rem;font-weight:700;border-radius:12px';
  btn.textContent = changed ? 'Enviar inscripción' : (mine.length > 0 ? '✓ Inscripción enviada' : 'Enviar inscripción');
  if (!changed && mine.length > 0) { btn.style.background = 'var(--green)'; btn.style.color = '#fff'; }
  btn.onclick = function(){
    if (S.inscSel.length === 0 && mine.length === 0) { btn.textContent = 'Elige al menos una prueba'; setTimeout(function(){ btn.textContent = 'Enviar inscripción'; }, 1600); return; }
    btn.disabled = true; btn.textContent = 'Guardando…';
    dbSaveInscription(comp.id, athlete.id, S.inscSel).then(function(res){
      if (!res.ok) { btn.disabled = false; btn.textContent = 'Error — reintenta'; return; }
      dbGetInscriptions().then(function(rows){ DATA.inscriptions = rows; render(); });
    });
  };
  d.appendChild(btn);
  return d;
}

// ============================================================
// COACH: INSCRIPCIONS
// ============================================================
function buildCoachInscripcions() {
  const d = document.createElement('div');
  const comps = inscEligibleComps();

  if (comps.length === 0) {
    d.innerHTML = '<div class="empty-state">No hay competiciones próximas.<br>Añade una en el calendario: la ventana de inscripción se calcula sola (abre 20 días antes, dura 5).</div>';
    return d;
  }

  let comp = comps.find(function(c){ return c.id === S.inscCompId; }) || comps[0];
  S.inscCompId = comp.id;
  if (comps.length > 1) d.appendChild(inscCompSelector(comps, comp.id, function(id){ S.inscCompId = id; render(); }));
  d.appendChild(inscCompCard(comp));

  // Controles de override de ventana (abrir ya / cerrar ya)
  const st = inscWinStatus(comp);
  const ctrl = document.createElement('div');
  ctrl.className = 'insc-ctrl';
  const openBtn = document.createElement('button');
  openBtn.className = 'open-btn';
  openBtn.textContent = '🟢 Abrir inscripción';
  openBtn.disabled = (st === 'open');
  const closeBtn = document.createElement('button');
  closeBtn.className = 'close-btn';
  closeBtn.textContent = '🔴 Cerrar inscripción';
  closeBtn.disabled = (st !== 'open');
  const tdy = todayStr();
  openBtn.onclick = function() {
    showConfirm('¿Abrir la inscripción ahora?',
      'Se abrirá hoy y se mantendrá la fecha de cierre prevista (' + (comp.inscClose ? inscFmtDate(comp.inscClose) : '—') + '). Los nadadores podrán inscribirse de inmediato.',
      function() {
        // abre hoy; si el cierre ya pasó o es anterior a hoy, lo empuja 5 días
        let close = comp.inscClose;
        if (!close || close < tdy) {
          const c = new Date(); c.setDate(c.getDate() + 5);
          close = c.getFullYear()+'-'+String(c.getMonth()+1).padStart(2,'0')+'-'+String(c.getDate()).padStart(2,'0');
        }
        dbSetInscWindow(comp.id, tdy, close).then(function() {
          dbGetCompetitions().then(function(cs){ DATA.competitions = cs; render(); });
        });
      }, { okText: 'Abrir ahora', okSafe: true });
  };
  closeBtn.onclick = function() {
    showConfirm('¿Cerrar la inscripción ahora?',
      'Los nadadores ya no podrán inscribirse ni modificar sus pruebas. Podrás reabrirla manualmente si hace falta.',
      function() {
        // cierra ayer para que current_date > insc_close
        const y = new Date(); y.setDate(y.getDate() - 1);
        const yest = y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');
        dbSetInscWindow(comp.id, comp.inscOpen, yest).then(function() {
          dbGetCompetitions().then(function(cs){ DATA.competitions = cs; render(); });
        });
      }, { okText: 'Cerrar ahora' });
  };
  ctrl.append(openBtn, closeBtn);
  d.appendChild(ctrl);

  const rows = inscForComp(comp.id);
  const athletes = DATA.athletes;
  const byAthlete = {};
  rows.forEach(function(i){ (byAthlete[i.athlete_id] = byAthlete[i.athlete_id] || []).push(i.event_code); });
  const doneCount = athletes.filter(function(a){ return (byAthlete[a.id] || []).length > 0; }).length;
  const usedEvents = DATA.events.filter(function(ev){ return rows.some(function(i){ return i.event_code === ev.code; }); }).length;

  const stats = document.createElement('div');
  stats.className = 'insc-stat-row';
  stats.innerHTML = '<div class="insc-stat"><b>' + doneCount + '/' + athletes.length + '</b><span>Nadadores</span></div>'
    + '<div class="insc-stat"><b>' + rows.length + '</b><span>Inscripciones</span></div>'
    + '<div class="insc-stat gold"><b>' + usedEvents + '/' + DATA.events.length + '</b><span>Pruebas cubiertas</span></div>';
  d.appendChild(stats);

  // matriz
  const wrap = document.createElement('div'); wrap.className = 'insc-matrix-wrap';
  const scroll = document.createElement('div'); scroll.className = 'insc-matrix-scroll';
  let h = '<table class="insc-matrix"><thead><tr><th class="iname">Nadador</th>';
  DATA.events.forEach(function(ev){ h += '<th>' + ev.code.replace(' ', '<br>') + '</th>'; });
  h += '<th>Σ</th></tr></thead><tbody>';
  athletes.forEach(function(a){
    const evs = byAthlete[a.id] || [];
    h += '<tr><td class="iname">' + a.name + '</td>';
    DATA.events.forEach(function(ev){ h += '<td>' + (evs.indexOf(ev.code) !== -1 ? '<span class="ix">✕</span>' : '') + '</td>'; });
    h += '<td style="font-weight:700;color:' + (evs.length ? 'var(--green)' : 'var(--text2)') + '">' + (evs.length || '—') + '</td></tr>';
  });
  h += '</tbody><tfoot><tr><td class="iname" style="color:var(--gold)">Por prueba</td>';
  DATA.events.forEach(function(ev){
    const c = rows.filter(function(i){ return i.event_code === ev.code; }).length;
    h += '<td' + (c === 0 ? ' style="color:var(--red2);opacity:0.85"' : '') + '>' + c + '</td>';
  });
  h += '<td>' + rows.length + '</td></tr></tfoot></table>';
  scroll.innerHTML = h;
  wrap.appendChild(scroll);

  const pending = athletes.filter(function(a){ return (byAthlete[a.id] || []).length === 0; });
  if (pending.length > 0) {
    const p = document.createElement('div');
    p.style.cssText = 'font-size:0.72rem;color:var(--text2);padding:10px 14px;border-top:1px solid rgba(41,128,185,0.12)';
    p.innerHTML = '⚠ Pendientes: <b style="color:var(--yellow)">' + pending.map(function(a){ return a.name; }).join(', ') + '</b>';
    wrap.appendChild(p);
  }
  d.appendChild(wrap);

  // export
  const xbtn = document.createElement('button');
  xbtn.className = 'btn';
  xbtn.style.cssText = 'width:100%;padding:15px;font-size:1rem;font-weight:700;border-radius:12px;border:none;background:var(--gold);color:#0a1628;cursor:pointer';
  xbtn.textContent = '⬇ Exportar Excel (.xlsx)';
  xbtn.onclick = function(){
    const header = ['PRUEBA / Nadador'].concat(DATA.events.map(function(e){ return e.code; }));
    const body = athletes.map(function(a){
      const evs = byAthlete[a.id] || [];
      return [a.name].concat(DATA.events.map(function(e){ return evs.indexOf(e.code) !== -1 ? 'X' : ''; }));
    });
    const foot = ['TOTAL por prueba'].concat(DATA.events.map(function(e){ return rows.filter(function(i){ return i.event_code === e.code; }).length; }));
    const ws = XLSX.utils.aoa_to_sheet([header].concat(body, [foot]));
    ws['!cols'] = [{wch:20}].concat(DATA.events.map(function(){ return {wch:10}; }));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Inscripciones');
    XLSX.writeFile(wb, 'inscripciones_' + comp.name.toLowerCase().replace(/[^a-z0-9]+/g, '_') + '.xlsx');
    xbtn.textContent = '✓ Excel descargado';
    setTimeout(function(){ xbtn.textContent = '⬇ Exportar Excel (.xlsx)'; }, 2000);
  };
  d.appendChild(xbtn);
  return d;
}


function buildCommentSheet() {
  const dateKey = S.commentDate || todayStr();
  const overlay = document.createElement('div'); overlay.className='overlay open';
  overlay.onclick = function(e) { if(e.target===overlay){S.commentAthlete=null;S.commentDate=null;render();} };

  const sheet = document.createElement('div'); sheet.className='bottom-sheet';
  const closeBtn = document.createElement('button'); closeBtn.className='sheet-close'; closeBtn.textContent='✕';
  closeBtn.onclick = function() { S.commentAthlete=null; S.commentDate=null; render(); };

  const title = document.createElement('div'); title.className='sheet-title';
  const athleteFirst = S.commentAthlete ? S.commentAthlete.split(' ')[0] : '';
  const dateLabel = dateKey !== todayStr() ? ' <span style="font-size:0.75rem;color:var(--text2);font-weight:normal">(' + formatDateLabel(dateKey) + ')</span>' : '';
  title.innerHTML = 'Mensaje para <strong>' + athleteFirst + '</strong>' + dateLabel;
  title.appendChild(closeBtn);

  const ta = document.createElement('textarea');
  ta.value = S.commentText; ta.placeholder='Mensaje privado para este atleta...'; ta.style.marginTop='10px';
  ta.oninput = function(e) { S.commentText = e.target.value; };

  const saveBtn = document.createElement('button'); saveBtn.className='btn btn-primary'; saveBtn.style.marginTop='10px'; saveBtn.textContent='Guardar mensaje';
  saveBtn.onclick = function() {
    dbSaveComment(dateKey, S.commentAthlete, S.commentText).then(function() {
      S.commentAthlete=null; S.commentDate=null;
      renderAsync();
    });
  };

  sheet.append(title, ta, saveBtn);
  overlay.appendChild(sheet);
  return overlay;
}
