// ============================================================
// TEST DE LACTATO PROGRESIVO — protocolos, motor de cálculo y guardado.
// Umbral: OBLA fijo a 4.0 mmol/L, interpolación lineal entre escalones.
// Zonas Z1-Z4: % de la velocidad umbral (modelo ICAR/Olbrecht, Vorontsov).
// Fuentes: Maglischo "Swimming Fastest" (2003) cap.3; Mujika et al. 2001.
// ============================================================
const LACTATE_PROTOCOLS = {
  '7x200': {
    label: '7×200 (fondo/media distancia)',
    steps: 7, distance: 200,
    help: 'Salida cíclica cada 5:00. Muestra de lactato al final de cada 200.'
  },
  '4x400': {
    label: '4×400 (fondistas)',
    steps: 4, distance: 400,
    help: 'Incremento progresivo de velocidad, ~30s descanso entre repeticiones.'
  },
  '8x100_pb': {
    label: '8×100 escalonado (necesita PB en 100)',
    steps: 8, distance: 100, needsPB: true,
    help: 'Intensidad definida como segundos por debajo del PB de cada nadador (Maglischo).'
  },
  '3x8x100': {
    label: '3×8×100 propio (24/26/28 pulso)',
    steps: 3, distance: 800, isBlock: true,
    help: '3 bloques de 8×100. Lactato: basal + al final de cada bloque + a los 3\' post-esfuerzo (5-6 tomas). Resolución menor que 7x200/4x400 (solo 3 puntos de intensidad reales).'
  }
};

function paceFromSpeed(v) {
  if (!v || v <= 0) return '--:--';
  const secPer100 = 100 / v;
  const m = Math.floor(secPer100 / 60);
  const s = (secPer100 - m * 60).toFixed(2);
  return m + ':' + (s < 10 ? '0' : '') + s;
}

function calcLactateThresholdAt(steps, target) {
  const pts = steps.filter(function(s){ return s.time_s > 0 && s.lactate != null; })
                   .map(function(s) { return { v: s.distance / s.time_s, lac: s.lactate }; });
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i+1];
    if (a.lac <= target && b.lac >= target && b.lac !== a.lac) {
      const frac = (target - a.lac) / (b.lac - a.lac);
      const vT = a.v + frac * (b.v - a.v);
      return { v: vT, pace100: paceFromSpeed(vT) };
    }
  }
  return null;
}

function calcLactateThreshold(steps) { return calcLactateThresholdAt(steps, 4.0); }
function calcAerobicThreshold(steps) { return calcLactateThresholdAt(steps, 2.0); }

function calcPeakVelocity(steps) {
  const valid = steps.filter(function(s){ return s.time_s > 0; });
  if (!valid.length) return null;
  const last = valid[valid.length - 1];
  const v = last.distance / last.time_s;
  return { v: v, pace100: paceFromSpeed(v) };
}

function calcLactateZones(vThreshold) {
  const ranges = [
    { zona: 'Z1 · Recuperación',   max: 0.80, objetivo: 'Recuperación activa' },
    { zona: 'Z2 · Base aeróbica',  min: 0.90, max: 1.00, objetivo: 'Base oxidativa' },
    { zona: 'Z3 · Umbral (EN1)',   min: 1.00, max: 1.03, objetivo: 'Máximo estado estable' },
    { zona: 'Z4 · VO2max (EN2)',   min: 1.04, max: 1.07, objetivo: 'Potencia aeróbica máxima' }
  ];
  return ranges.map(function(r) {
    return {
      zona: r.zona, objetivo: r.objetivo,
      ritmo_rapido: paceFromSpeed(vThreshold * r.max),
      ritmo_lento: r.min ? paceFromSpeed(vThreshold * r.min) : null
    };
  });
}

// ── Mini-sparkline (SVG) ──────────────────────────────────────────
function strengthSpark(data, w, h) {
  w = w || 110; h = h || 32;
  if (!data || data.length < 2) return '';
  const min = Math.min.apply(null, data), max = Math.max.apply(null, data), rng = (max - min) || 1;
  const pts = data.map(function (v, i) {
    return [(i / (data.length - 1)) * (w - 4) + 2, h - 4 - ((v - min) / rng) * (h - 8)];
  });
  const dPath = pts.map(function (p, i) { return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ');
  const last = pts[pts.length - 1];
  return '<svg width="' + w + '" height="' + h + '" style="display:block">'
    + '<path d="' + dPath + '" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'
    + '<circle cx="' + last[0].toFixed(1) + '" cy="' + last[1].toFixed(1) + '" r="3" fill="var(--accent)"/></svg>';
}

function buildAthleteStrength() {
  const d = document.createElement('div');

  d.appendChild(st);

  // Igual que Mi RPE: Fuerza cuelga de la sesión programada para hoy.
  // Solo se habilita si hay un turno con phase === 'Fuerza' (entreno de físico).
  const today = todayStr();
  const rawSession = getSession(today);
  const slots = daySlots(rawSession);
  const fuerzaSlot = slots.find(function (s) { return s.sess && s.sess.phase === 'Fuerza'; });

  if (!fuerzaSlot) {
    const empty = document.createElement('div'); empty.className = 'card';
    empty.innerHTML = '<div class="card-sub" style="text-align:center">Hoy no tienes entreno de físico programado.</div>';
    d.appendChild(empty);
    return d;
  }
  const sessObj = fuerzaSlot.sess;
  const sessionId = sessObj._id || null;

  // Carga perezosa (patrón cache-then-render)
  if (DATA.athStrTrend === undefined) {

      S._strLoading = true;

      + '<div style="font-family:monospace;font-weight:700;font-size:1.3rem;color:var(--text)">' + (lastRm != null ? lastRm : '—') + '<span style="font-size:0.7rem;color:var(--text3)"> kg</span></div>'
      + '</div>';

      const v = S.strInput[ex.id];
      if (v.load === '' || v.reps === '') { alert('Pon al menos carga y reps'); return; }

      btn.disabled = true; btn.textContent = 'Guardando…';

            return;

          render();
        });
    };
    card.appendChild(btn);
    d.appendChild(card);
  });

  return d;
}

  if (sbBanner) app.appendChild(sbBanner);

  if (S.showResetScreen) { trackScreen('reset_password'); app.appendChild(buildResetPasswordScreen()); return; }
  if (!S.role) { trackScreen('login'); app.appendChild(buildLogin()); return; }
  if (S.role === 'pin') {
    trackScreen('pin');
    app.appendChild(buildPin());
    if (S.showConfirmEmailModal) app.appendChild(buildConfirmEmailModal());
    return;
  }
  if (S.role === 'athlete_pin') { trackScreen('athlete_pin'); app.appendChild(buildAthletePin()); return; }
  if (S.role === 'coach_pending') { trackScreen('coach_pending'); app.appendChild(buildCoachPending()); return; }

  app.appendChild(buildHeader());
  if (S.showChangelog) app.appendChild(buildChangelogPanel());
  if (S.role === 'coach' && (S.showProfile || (S.coachProfile && !S.coachProfile.adult_confirmed_at && !S.profileSkipped))) app.appendChild(buildProfileSheet());
  const content = document.createElement('div');
  content.className = 'content';

  if (S.role === 'coach') {
    // La navegación vive solo en el menú inferior; aquí ya no se pinta la fila de tabs.
    const views = [buildCoachSession, buildCoachRPE, buildCoachSquad, buildCalendar, buildCoachInscripcions, buildCoachTeam, buildCoachHistorial, buildCoachAttendance];
    const view = views[S.tab];
    trackScreen(view.name);
    if (S.tab === 1 || S.tab === 2) {
      // RPE y Escuadra comparten la pestaña "Carga": selector arriba, título propio fuera
      S.lastCargaTab = S.tab;
      const t = document.createElement('div'); t.className = 'section-title'; t.textContent = 'Carga';
      const seg = document.createElement('div'); seg.className = 'seg-a'; seg.setAttribute('role', 'tablist');
      [[1, 'RPE'], [2, 'Escuadra']].forEach(function(o) {
        const b = document.createElement('button');
        b.className = S.tab === o[0] ? 'on' : ''; b.textContent = o[1];
        b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', S.tab === o[0] ? 'true' : 'false');
        b.onclick = function() { S.tab = o[0]; render(); };
        seg.appendChild(b);
      });
      content.append(t, seg);
      const v = view();
      const firstTitle = v.querySelector('.section-title');
      if (firstTitle && /^(RPE|Escuadra)$/.test(firstTitle.textContent.trim())) firstTitle.remove();
      content.appendChild(v);
    } else {
      content.appendChild(view());
    }
  } else {
    const views = [buildAthleteInicio, buildAthleteRPE, buildAthleteStrength, buildCalendar, buildAthleteInscripcions, buildAthleteSession];
    const view = views[S.ath_tab];
    trackScreen(view.name);
    content.appendChild(view());
  }

  app.appendChild(content);
  app.appendChild(buildBottomNav());

  if (S.commentAthlete !== null) app.appendChild(buildCommentSheet());
  if (S.viewResultsCompId) app.appendChild(buildResultsSheet());
}

// Selector Atleta | Entrenador del login en hoja inferior
function buildRoleSegA(active) {
  const seg = document.createElement('div'); seg.className = 'seg-a'; seg.setAttribute('role', 'tablist');
  [['athlete', 'Atleta'], ['coach', 'Entrenador']].forEach(function(o) {
    const b = document.createElement('button'); b.type = 'button';
    b.className = active === o[0] ? 'on' : ''; b.textContent = o[1];
    b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', active === o[0] ? 'true' : 'false');
    b.onclick = function() {
      if (active === o[0]) return;
      if (o[0] === 'coach') { S.role = 'pin'; S.pinBuffer = ''; S.pinError = false; }
      else { S.role = null; S.pinError = false; S.pinMode = 'login'; S.signupError = null; }
      render();
    };
    seg.appendChild(b);
  });
  return seg;
}

    const inpCode = document.createElement('input');

    }

    const goCode = document.createElement('button');
    goCode.className = 'btn btn-primary'; goCode.textContent = 'Continuar'; goCode.style.marginTop = '14px';
    const trySubmit = async () => {
      const v = (inpCode.value || '').trim().toUpperCase();
      if (v.length < 4) { S.teamCodeError = 'Escribe el código completo.'; render(); return; }
      goCode.disabled = true; goCode.textContent = 'Comprobando…';
      setTeamCode(v);
      S.teamCodeError = null;
      const list = await dbGetAthletes();
      if (!list.length) {
        setTeamCode(null);
        if (!S.teamCodeError) S.teamCodeError = 'Código no válido o equipo sin nadadores.';
        render(); return;
      }
      DATA.athletes = list; S.teamCodeError = null; render();
    };
    goCode.onclick = trySubmit;
    inpCode.onkeydown = (e) => { if (e.key === 'Enter') trySubmit(); };
    card.appendChild(goCode);


    d.appendChild(card);
    return d;
  }

  const h2 = document.createElement('h2');
  h2.textContent = 'Selecciona tu nombre';
  card.appendChild(h2);
  const sub2 = document.createElement('p'); sub2.className = 'login-sub';
  sub2.textContent = 'Elige tu nombre y después escribe tu PIN.';
  card.appendChild(sub2);

  const sel = document.createElement('select');
  sel.className = 'select-styled';
  const opt0 = document.createElement('option');
  opt0.value = ''; opt0.textContent = '— Seleccionar atleta —';
  sel.appendChild(opt0);
  getAthletes().forEach(name => {
    const o = document.createElement('option');
    o.value = name; o.textContent = name; sel.appendChild(o);

  if (S.rememberedAthlete && getAthletes().indexOf(S.rememberedAthlete.name) !== -1) sel.value = S.rememberedAthlete.name;

  const btnAth = document.createElement('button');

    const athlete = DATA.athletes.find(a => a.name === sel.value);

    S.pendingAthleteName = sel.value;
    S.athletePinBuffer = '';
    S.athletePinError = '';
    S.role = 'athlete_pin';
    render();
  };
  card.appendChild(btnAth);


  const chg = document.createElement('button');
  chg.textContent = 'Cambiar de equipo';
  chg.style.cssText = 'display:block;margin:12px auto 0;background:none;border:none;color:var(--text2);font-size:0.75rem;text-decoration:underline;cursor:pointer;';
  chg.onclick = () => { setTeamCode(null); DATA.athletes = []; S.teamCodeError = null; render(); };
  card.appendChild(chg);

  d.appendChild(card);
  return d;
}

function buildPin() {

  const backBtn = document.createElement('button');

  backBtn.textContent = '\u2190 Volver';

  backBtn.onclick = () => { S.role = null; S.pinError = false; S.pinMode = 'login'; S.signupError = null; render(); };

  d.appendChild(topLogo);

  const card = document.createElement('div');

  const isSignup = S.pinMode === 'signup';

  const iconWrap = document.createElement('div');
  iconWrap.className = 'od-login-icon-wrap';
  const iconGlow = document.createElement('div');
  iconGlow.className = 'od-login-glow';
  iconWrap.appendChild(iconGlow);
  const iconImg = document.createElement('img');
  iconImg.className = 'od-login-icon';
  iconImg.alt = 'Ondrift';
  iconImg.src = ONDRIFT_ICON_SRC;
  iconWrap.appendChild(iconImg);
  card.appendChild(iconWrap);

  const h2 = document.createElement('h2');
  h2.textContent = isSignup ? 'Crear cuenta de entrenador' : 'Acceso Entrenador';
  card.appendChild(h2);
  card.appendChild(buildRoleSegA('coach'));

  if (isSignup) {
    const googleBtn = document.createElement('button');
    googleBtn.type = 'button';
    googleBtn.className = 'btn btn-secondary';
    googleBtn.style.cssText = 'display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px;box-shadow:0 14px 30px rgba(60,110,160,0.32), inset 0 1.5px 0 rgba(255,255,255,0.95), inset 0 -10px 14px rgba(120,170,210,0.18);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;';
    googleBtn.innerHTML =
      '<svg width="18" height="18" viewBox="0 0 48 48" style="flex-shrink:0;">' +
      '<path fill="#FFC107" d="M43.6 20.5h-1.9V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/>' +
      '<path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 16 19 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>' +
      '<path fill="#4CAF50" d="M24 44c5.4 0 10.3-2.1 14-5.5l-6.5-5.4C29.5 34.9 26.9 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.6 5C9.6 39.6 16.3 44 24 44z"/>' +
      '<path fill="#1976D2" d="M43.6 20.5H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.6l6.5 5.4C41.4 36.6 44 30.9 44 24c0-1.3-.1-2.7-.4-3.5z"/>' +
      '</svg> Registrarme con Google';
    googleBtn.ontouchstart = function(){};
    googleBtn.onclick = () => {
      window.location.href = SUPABASE_URL + '/auth/v1/authorize?provider=google&redirect_to=' + encodeURIComponent(window.location.origin + window.location.pathname);
    };
    card.appendChild(googleBtn);
  }

  const glassBg = 'background: linear-gradient(180deg, rgba(255,255,255,0.85) 0%, rgba(255,255,255,0) 42%), linear-gradient(160deg, rgba(255,255,255,0.4) 0%, rgba(210,230,245,0.28) 60%, rgba(180,215,240,0.3) 100%);';

  const email = document.createElement('input');
  email.type = 'email'; email.placeholder = 'Email'; email.autocomplete = 'username';
  email.className = 'select-styled';
  email.value = (S.coachEmail != null) ? S.coachEmail : '';
  email.style.cssText = glassBg + (isSignup ? 'margin-top:14px;' : '');
  email.oninput = () => { S.coachEmail = email.value; };
  card.appendChild(email);

  const pass = document.createElement('input');
  pass.type = 'password'; pass.placeholder = 'Contrase\u00f1a'; pass.autocomplete = isSignup ? 'new-password' : 'current-password';
  pass.className = 'select-styled';
  pass.style.cssText = glassBg + 'margin-top:14px;';
  card.appendChild(pass);

  let pass2 = null;
  if (isSignup) {
    pass2 = document.createElement('input');
    pass2.type = 'password'; pass2.placeholder = 'Repetir contrase\u00f1a'; pass2.autocomplete = 'new-password';
    pass2.className = 'select-styled';
    pass2.style.cssText = glassBg + 'margin-top:14px;';
    card.appendChild(pass2);
  }

  if (S.pinError) {
    const err = document.createElement('div');
    err.className = 'pin-error';
    err.textContent = (LAST_AUTH_ERROR === 'confirm')
      ? 'Tienes que confirmar tu email antes de entrar. Busca el correo de confirmaci\u00f3n en tu bandeja (y en spam).'
      : (LAST_AUTH_ERROR === 'locked')
      ? 'Cuenta bloqueada por intentos fallidos. Ped\u00ed a tu entrenador/admin que la reactive.'
      : (LAST_AUTH_ERROR === 'offline')
      ? 'Sin conexi\u00f3n. Revisa tu internet e int\u00e9ntalo de nuevo.'
      : (LAST_AUTH_ERROR === 'busy')
      ? 'Servicio ocupado. Int\u00e9ntalo de nuevo en unos segundos.'
      : 'Email o contrase\u00f1a incorrectos.';
    err.style.marginTop = '12px';
    card.appendChild(err);
  }
  if (S.signupError) {
    const err = document.createElement('div');
    err.className = 'pin-error'; err.textContent = S.signupError;
    err.style.marginTop = '12px';
    card.appendChild(err);
  }
  // Tras login/registro OK: mira tu estado real y decide a donde vas
  const routeAfterAuth = async () => {
    const status = await fetchCoachStatus();
    S.coachEmail = null;
    if (status === 'approved') { S.role = 'coach'; S.tab = 0; fetchPendingCoachCount(); renderAsync(); maybeShowCoachSurvey(); }
    else if (status === null) {
      // No se pudo leer el estado (red caída o timeout): devolvemos el botón
      // en vez de dejarlo colgado en "Entrando…".
      LAST_AUTH_ERROR = 'offline';
      S.pinError = true;
      submit.disabled = false; submit.textContent = 'Entrar';
      render();
    }
    else { S.role = 'coach_pending'; S.coachStatus = status; render(); }
  };

  const submit = document.createElement('button');
  submit.className = 'btn btn-primary';
  submit.style.marginTop = '14px';

  if (isSignup) {
    submit.textContent = 'Crear cuenta';
    const doSignup = async () => {
      S.signupError = null;
      const em = (email.value || '').trim();
      if (!em || pass.value.length < 8) { S.signupError = 'Email v\u00e1lido y contrase\u00f1a de m\u00ednimo 8 caracteres.'; render(); return; }
      if (pass.value !== pass2.value) { S.signupError = 'Las contrase\u00f1as no coinciden.'; render(); return; }
      submit.disabled = true; submit.textContent = 'Creando\u2026';
      try {
        const res = await fetch(SUPABASE_URL + '/auth/v1/signup', {
          method: 'POST',
          headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: em, password: pass.value })
        });
        const data = await res.json();
        if (!res.ok) {
          S.signupError = (data && data.msg) ? data.msg : 'No se pudo crear la cuenta.';
          submit.disabled = false; submit.textContent = 'Crear cuenta'; render(); return;
        }
        if (data.access_token) {
          // auto-confirmado: entra ya y va directo a "en revisión"
          SB_ACCESS_TOKEN = data.access_token;
          COACH_CREDS = { email: em, password: pass.value };
          await routeAfterAuth();
        } else {
          // requiere confirmar email antes de poder entrar
          S.pinMode = 'login'; S.coachEmail = em;
          submit.disabled = false; S.showConfirmEmailModal = true; render();
        }
      } catch (e) {
        S.signupError = 'Sin conexi\u00f3n.'; submit.disabled = false; submit.textContent = 'Crear cuenta'; render();
      }
    };
    submit.onclick = doSignup;
  } else {
    submit.textContent = 'Entrar';
    const doLogin = async () => {
      submit.disabled = true; submit.textContent = 'Entrando\u2026';
      const ok = await coachSignIn((email.value || '').trim(), pass.value);
      if (ok) { S.pinError = false; await routeAfterAuth(); }
      else { S.pinError = true; submit.disabled = false; submit.textContent = 'Entrar'; render(); }
    };
    submit.onclick = doLogin;
    pass.onkeydown = (e) => { if (e.key === 'Enter') doLogin(); };
  }
  card.appendChild(submit);

  if (!isSignup) {
    const forgot = document.createElement('button');
    forgot.className = 'btn-link';
    forgot.style.cssText = 'display:block;margin:10px auto 0;background:none;border:none;color:var(--accent2);font-size:0.82rem;text-decoration:underline;cursor:pointer;';
    forgot.textContent = '\u00bfOlvidaste tu contrase\u00f1a?';

  }

  const toggle = document.createElement('button');
  toggle.className = 'btn btn-secondary';
  toggle.style.marginTop = '10px';

  toggle.onclick = () => { S.pinMode = isSignup ? 'login' : 'signup'; S.pinError = false; S.signupError = null; render(); };
  card.appendChild(toggle);

  d.appendChild(card);
  if (S.showForgotPassword) d.appendChild(buildForgotPasswordModal());
  return d;
}

  if (S.resetError) {
    const err = document.createElement('div'); err.style.cssText = 'color:var(--red);font-size:0.82rem;margin-top:8px';
    err.textContent = S.resetError;
    card.appendChild(err);
  }

  btn.textContent = 'Guardar contrase\u00f1a';

    if (p !== p2v) { S.resetError = 'Las dos contrase\u00f1as no coinciden.'; render(); return; }
    btn.disabled = true; btn.textContent = 'Guardando\u2026';
    try {
      const res = await fetch(SUPABASE_URL + '/auth/v1/user', {

      S.recoveryToken = null; S.resetDone = true; render();
    } catch (e) {
      S.resetError = 'Sin conexi\u00f3n.'; btn.disabled = false; btn.textContent = 'Guardar contrase\u00f1a'; render();

    goBtn.textContent = 'Ir al login';
    goBtn.onclick = () => { S.showResetScreen = false; render(); };
    card.appendChild(goBtn);
  }

  d.appendChild(card);
  return d;
}

function buildAthletePin() {
  const d = document.createElement('div');
  const pin = document.createElement('div');
  pin.className = 'pin-screen';
  const title = document.createElement('h2');
  title.textContent = 'PIN de ' + (S.pendingAthleteName ? S.pendingAthleteName.split(' ')[0] : '');
  title.style.fontSize = '1.2rem';
  pin.appendChild(title);

  const dots = document.createElement('div');
  dots.className = 'pin-dots';
  for (let i = 0; i < 6; i++) {
    const dot = document.createElement('div');
    dot.className = 'pin-dot' + (i < S.athletePinBuffer.length ? ' filled' : '');
    dots.appendChild(dot);
  }
  pin.appendChild(dots);

  if (S.athletePinError) {
    const err = document.createElement('div');
    err.className = 'pin-error'; err.textContent = S.athletePinError;
    pin.appendChild(err);
  }
  if (S.athletePinBusy) {
    const busy = document.createElement('div');
    busy.className = 'pin-error'; busy.style.color = 'var(--text2)'; busy.textContent = 'Verificando…';
    pin.appendChild(busy);
  }

  const grid = document.createElement('div');
  grid.className = 'pin-grid';
  const keys = ['1','2','3','4','5','6','7','8','9','⌫','0','✓'];
  keys.forEach(k => {
    const btn = document.createElement('div');
    btn.className = 'pin-btn'; btn.textContent = k;
    btn.onclick = () => {
      if (S.athletePinBusy) return;
      const trySubmit = () => {
        S.athletePinBusy = true; S.athletePinError = ''; render();
        sbFunctionCall('athlete-login', { athlete_id: S.pendingAthleteId, pin: S.athletePinBuffer }, false)
          .then(r => {
            S.athletePinBusy = false;
            if (r.ok && r.data && r.data.access_token) {
              SB_ACCESS_TOKEN = r.data.access_token;
              localStorage.setItem('ondrift_sb_token', SB_ACCESS_TOKEN);
              // El access_token caduca (~1h). Sin guardar el refresh_token, al
              // caducar TODA consulta del nadador daba 401 -> null: el calendario
              // se quedaba sin competiciones y el check-in matinal se volvía a
              // pedir cada vez porque no podía leer el ya guardado.
              if (r.data.refresh_token) {
                SB_REFRESH_TOKEN = r.data.refresh_token;
                localStorage.setItem('ondrift_sb_refresh', SB_REFRESH_TOKEN);
              }
              S.role = 'athlete';
              S.athleteName = S.pendingAthleteName;
              try { localStorage.setItem('ondrift_athlete', JSON.stringify({ id: S.pendingAthleteId, name: S.pendingAthleteName, team: getTeamCode() })); } catch (e) {}
              S.ath_tab = 0;
              S.athletePinBuffer = '';
              // renderAsync (no render): hay que ejecutar loadData() ahora que
              // ya existe el token del nadador. Con render() a secas la pantalla
              // se pintaba sin datos — sin competiciones en el calendario y sin
              // el check-in ya guardado, así que lo volvía a pedir cada vez.
              renderAsync();
            } else {
              S.athletePinError = (r.data && r.data.error) || (r.status >= 500 ? 'Servicio ocupado. Inténtalo de nuevo en unos segundos.' : 'PIN incorrecto. Inténtalo de nuevo.');
              S.athletePinBuffer = '';
              render();
            }
          })
          .catch(() => {
            S.athletePinBusy = false;
            S.athletePinError = 'Sin conexión. Inténtalo de nuevo.';
            S.athletePinBuffer = '';
            render();
          });
      };
      if (k === '⌫') { S.athletePinBuffer = S.athletePinBuffer.slice(0,-1); S.athletePinError = ''; render(); }
      else if (k === '✓') {
        if (S.athletePinBuffer.length === 6) trySubmit();
      } else if (S.athletePinBuffer.length < 6) {
        S.athletePinBuffer += k;
        if (S.athletePinBuffer.length === 6) trySubmit();
        else render();
      }
    };
    grid.appendChild(btn);
  });
  pin.appendChild(grid);
  d.appendChild(pin);

  const backBtn = document.createElement('button');
  backBtn.className = 'btn-exit';
  backBtn.textContent = '← Volver';
  backBtn.style.cssText = 'margin:20px 16px 0;display:block;';
  backBtn.onclick = () => { S.role = null; S.pendingAthleteId = null; S.pendingAthleteName = null; render(); };
  d.insertBefore(backBtn, pin);
  return d;
}

function openCoachPasswordModal() {
  if (document.getElementById('pw-modal')) return;

  ov.style.cssText = 'position:fixed; inset:0; z-index:9999; display:flex; align-items:center; justify-content:center; padding:24px; background:rgba(20,40,70,0.45); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);';

  card.className = 'login-card';
  card.style.cssText = 'max-width:360px; width:100%;';
  const h = document.createElement('h2'); h.textContent = 'Cambiar contrase\u00f1a'; card.appendChild(h);

  const p1 = document.createElement('input');
  p1.type = 'password'; p1.placeholder = 'Nueva contrase\u00f1a'; p1.autocomplete = 'new-password'; p1.className = 'select-styled';
  card.appendChild(p1);
  const p2 = document.createElement('input');
  p2.type = 'password'; p2.placeholder = 'Repetir contrase\u00f1a'; p2.autocomplete = 'new-password'; p2.className = 'select-styled';
  p2.style.marginTop = '10px';
  card.appendChild(p2);

  const msg = document.createElement('div');
  msg.style.cssText = 'font-size:0.85rem; margin-top:10px; min-height:1.2em; text-align:center;';
  card.appendChild(msg);

  const save = document.createElement('button');
  save.className = 'btn btn-primary'; save.textContent = 'Guardar'; save.style.marginTop = '12px';
  card.appendChild(save);
  const cancel = document.createElement('button');
  cancel.className = 'btn btn-secondary'; cancel.textContent = 'Cancelar'; cancel.style.marginTop = '8px';
  cancel.onclick = () => ov.remove();
  card.appendChild(cancel);

  save.onclick = async () => {
    if (p1.value.length < 8) { msg.style.color = '#e74c3c'; msg.textContent = 'M\u00ednimo 8 caracteres.'; return; }
    if (p1.value !== p2.value) { msg.style.color = '#e74c3c'; msg.textContent = 'No coinciden.'; return; }
    if (!SB_ACCESS_TOKEN) { msg.style.color = '#e74c3c'; msg.textContent = 'Sesi\u00f3n caducada, vuelve a entrar.'; return; }
    save.disabled = true; save.textContent = 'Guardando...';
    try {
      const res = await fetch(SUPABASE_URL + '/auth/v1/user', {
        method: 'PUT',
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SB_ACCESS_TOKEN, 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: p1.value })
      });
      if (res.ok) {
        if (COACH_CREDS) COACH_CREDS.password = p1.value; // que la reautenticacion siga con la nueva
        msg.style.color = 'var(--green)'; msg.textContent = 'Contrase\u00f1a cambiada \u2713';
        save.textContent = 'Hecho';
        setTimeout(() => ov.remove(), 1200);
      } else {
        const t = await res.text(); console.error('pw change', t);
        msg.style.color = '#e74c3c'; msg.textContent = 'No se pudo cambiar (\u00bfsesi\u00f3n caducada?).';
        save.disabled = false; save.textContent = 'Guardar';
      }
    } catch (e) {
      msg.style.color = '#e74c3c'; msg.textContent = 'Sin conexi\u00f3n.';
      save.disabled = false; save.textContent = 'Guardar';
    }
  };

  ov.appendChild(card);
  ov.onclick = (e) => { if (e.target === ov) ov.remove(); };
  document.body.appendChild(ov);
  setTimeout(() => p1.focus(), 50);
}

async function openCoachAdminModal() {
  if (document.getElementById('admin-modal')) return;
  const ov = document.createElement('div');
  ov.id = 'admin-modal';
  ov.style.cssText = 'position:fixed; inset:0; z-index:9999; display:flex; align-items:center; justify-content:center; padding:24px; background:rgba(20,40,70,0.45); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);';
  const card = document.createElement('div');
  card.className = 'login-card';
  card.style.cssText = 'max-width:440px; width:100%; max-height:80vh; overflow-y:auto;';
  const h = document.createElement('h2'); h.textContent = 'Entrenadores'; card.appendChild(h);

  const selected = new Set(); // ids marcados para borrar en bloque

  const bulkBar = document.createElement('div');
  bulkBar.style.cssText = 'display:none; align-items:center; justify-content:space-between; gap:8px; background:rgba(192,57,43,0.12); border:1px solid rgba(192,57,43,0.4); border-radius:10px; padding:8px 12px; margin-top:10px;';
  const bulkCount = document.createElement('span'); bulkCount.style.cssText = 'font-size:0.8rem; font-weight:700; color:var(--accent2)';
  const bulkDelBtn = document.createElement('button'); bulkDelBtn.className = 'btn btn-danger'; bulkDelBtn.style.cssText = 'padding:7px 12px; font-size:0.8rem'; bulkDelBtn.textContent = 'Borrar seleccionados';
  bulkBar.append(bulkCount, bulkDelBtn);
  card.appendChild(bulkBar);

  const list = document.createElement('div');
  list.style.cssText = 'margin-top:12px; display:flex; flex-direction:column; gap:10px;';
  list.textContent = 'Cargando\u2026';
  card.appendChild(list);

  const close = document.createElement('button');
  close.className = 'btn btn-secondary'; close.textContent = 'Cerrar'; close.style.marginTop = '14px';
  close.onclick = () => ov.remove();
  card.appendChild(close);

  ov.appendChild(card);
  ov.onclick = (e) => { if (e.target === ov) ov.remove(); };
  document.body.appendChild(ov);

  let lastRows = [];

  const updateBulkBar = () => {
    bulkBar.style.display = selected.size > 0 ? 'flex' : 'none';
    bulkCount.textContent = selected.size + ' seleccionado' + (selected.size !== 1 ? 's' : '');
  };

  bulkDelBtn.onclick = () => {
    const ids = Array.from(selected);
    if (!ids.length) return;
    showConfirm(
      '¿Borrar ' + ids.length + ' entrenador' + (ids.length !== 1 ? 'es' : '') + '?',
      'Se eliminan las cuentas por completo. No se puede deshacer.',
      function() {
        bulkDelBtn.disabled = true; bulkDelBtn.textContent = 'Borrando…';
        Promise.all(ids.map(id => fetch(SUPABASE_URL + '/rest/v1/coaches?id=eq.' + id, {
          method: 'DELETE',
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SB_ACCESS_TOKEN, 'Prefer': 'return=minimal' }
        }))).then(() => {
          selected.clear(); updateBulkBar();
          bulkDelBtn.disabled = false; bulkDelBtn.textContent = 'Borrar seleccionados';
          fetchPendingCoachCount();
          loadList();
        });
      }
    );
  };

  const loadList = async (keepSelection) => {
    if (!keepSelection) list.textContent = 'Cargando\u2026';
    try {
      const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/list_coaches_for_admin', {
        method: 'POST',
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SB_ACCESS_TOKEN, 'Content-Type': 'application/json' },
        body: '{}'
      });
      if (!res.ok) { list.textContent = 'No se pudo cargar la lista.'; return; }
      const rows = await res.json();
      lastRows = rows;
      list.innerHTML = '';
      if (!rows.length) { list.textContent = 'No hay entrenadores registrados.'; return; }
      rows.forEach(c => {
        const row = document.createElement('div');
        row.style.cssText = 'display:flex; align-items:center; justify-content:space-between; gap:8px; padding:10px 12px; border-radius:12px; background:rgba(255,255,255,0.5); border:1px solid rgba(255,255,255,0.7);';

        if (!c.is_admin) {
          const chk = document.createElement('input');
          chk.type = 'checkbox';
          chk.style.cssText = 'flex-shrink:0; width:18px; height:18px;';
          chk.checked = selected.has(c.id);
          chk.onchange = () => { if (chk.checked) selected.add(c.id); else selected.delete(c.id); updateBulkBar(); };
          row.appendChild(chk);
        }

        const info = document.createElement('div');
        info.style.cssText = 'display:flex; flex-direction:column; min-width:0; flex:1;';
        const em = document.createElement('span'); em.style.cssText = 'font-weight:600; font-size:0.85rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;'; em.textContent = c.email + (c.is_admin ? ' \u2b50' : '');
        const st = document.createElement('span'); st.style.cssText = 'font-size:0.75rem; color:var(--text-secondary);';
        st.textContent = (c.status === 'approved' ? 'Aprobado' : c.status === 'rejected' ? 'Rechazado' : 'Pendiente') + (c.login_locked ? ' \u2022 \ud83d\udd12 Bloqueada' : '');
        info.appendChild(em); info.appendChild(st);
        row.appendChild(info);

        if (!c.is_admin) {
          const actions = document.createElement('div');
          actions.style.cssText = 'display:flex; gap:6px; flex-shrink:0;';
          if (c.login_locked) {
            const unlock = document.createElement('button'); unlock.className = 'btn-exit'; unlock.textContent = '\ud83d\udd13';
            unlock.title = 'Reactivar cuenta bloqueada';
            unlock.onclick = async () => {
              try {
                const r = await fetch(SUPABASE_URL + '/rest/v1/coaches?id=eq.' + c.id, {
                  method: 'PATCH',
                  headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SB_ACCESS_TOKEN, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
                  body: JSON.stringify({ login_locked: false, login_attempts: 0 })
                });
                if (r.ok) loadList(); else alert('No se pudo reactivar.');
              } catch (e) { alert('Sin conexi\u00f3n.'); }
            };
            actions.appendChild(unlock);
          }
          const setStatus = async (newStatus) => {
            try {
              const r = await fetch(SUPABASE_URL + '/rest/v1/coaches?id=eq.' + c.id, {
                method: 'PATCH',
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SB_ACCESS_TOKEN, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
                body: JSON.stringify({ status: newStatus })
              });
              if (r.ok) {
                loadList(); fetchPendingCoachCount();
                if (newStatus === 'approved') sbFunctionCall('send-coach-approved-email', { email: c.email }, true);
              } else alert('No se pudo actualizar.');
            } catch (e) { alert('Sin conexi\u00f3n.'); }
          };
          if (c.status !== 'approved') {
            const ok = document.createElement('button'); ok.className = 'btn-exit'; ok.textContent = '\u2705';
            ok.onclick = () => setStatus('approved'); actions.appendChild(ok);
          }
          if (c.status !== 'rejected') {
            const no = document.createElement('button'); no.className = 'btn-exit'; no.textContent = '\u274c';
            no.onclick = () => setStatus('rejected'); actions.appendChild(no);
          }
          const del = document.createElement('button'); del.className = 'btn-exit'; del.textContent = '\ud83d\uddd1';
          del.title = 'Borrar cuenta por completo';
          del.onclick = () => {
            showConfirm('¿Borrar "' + c.email + '"?', 'Se elimina por completo, junto con sus nadadores, sesiones y competiciones. No se puede deshacer.', function() {
              fetch(SUPABASE_URL + '/rest/v1/coaches?id=eq.' + c.id, {
                method: 'DELETE',
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SB_ACCESS_TOKEN, 'Prefer': 'return=minimal' }
              }).then(function(r) {
                if (r.ok) { selected.delete(c.id); updateBulkBar(); loadList(); fetchPendingCoachCount(); }
                else alert('No se pudo borrar.');
              }).catch(function() { alert('Sin conexi\u00f3n.'); });
            });
          };
          actions.appendChild(del);
          row.appendChild(actions);
        }
        list.appendChild(row);
      });
      updateBulkBar();
    } catch (e) { list.textContent = 'Sin conexi\u00f3n.'; }
  };
  loadList();
}

function getLastSeenChangelog() {

// PERFIL DEL ENTRENADOR (nombre, mayoría de edad, plan)
// El plan y la declaración de mayoría de edad viven en la base de datos: el cliente solo los
// lee y los muestra (no puede cambiar el plan ni deshacer la mayoría de edad).
// ============================================================
// Versión de la app: subir el número en cada cambio (2.0 = archivo de producción del 26-oct-2026)
const APP_VERSION = '2.7';
const PLAN_URL = 'https://ondrift.app/';
const LEGAL_TERMS_URL = 'https://ondrift.app/terminos-ondrift.html';
const LEGAL_PRIVACY_URL = 'https://ondrift.app/privacidad-datos.html';
const TRIAL_DAYS = 15;
const PLAN_LABELS = { individual: 'Individual', duo: 'Dúo', club: 'Club' };

async function coachRpc(name, body, _retry) {
  try {
    const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + name, {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SB_ACCESS_TOKEN, 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {})
    });
    if ((res.status === 401 || res.status === 403) && !_retry) {
      if (await coachSignIn()) return coachRpc(name, body, true);
    }
    const text = await res.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch (e) {}
    return { ok: res.ok, data: data };
  } catch (e) { return { ok: false, data: null }; }
}

// Si falla (p. ej. la función aún no existe), S.coachProfile se queda en null y la app
// funciona como antes: cabecera "Hola, entrenador" y sin avisos.
async function loadCoachProfile() {
  S.coachProfile = null;
  const r = await coachRpc('my_coach_profile');
  if (S.role !== 'coach') return;
  if (r.ok && r.data && r.data[0]) { S.coachProfile = r.data[0]; render(); }
}

function buildProfileSheet() {
  const p = S.coachProfile || {};
  const forced = !!S.coachProfile && !p.adult_confirmed_at;   // primera vez (si no se pudo leer el perfil, nunca obliga): se pide confirmar, pero siempre se puede dejar para luego
  const close = function() { S.showProfile = false; if (forced) S.profileSkipped = true; render(); };

  const overlay = document.createElement('div'); overlay.className = 'overlay open';
  if (!forced) overlay.onclick = function(e) { if (e.target === overlay) close(); };
  const sheet = document.createElement('div'); sheet.className = 'bottom-sheet';
  sheet.setAttribute('role', 'dialog'); sheet.setAttribute('aria-label', 'Tu perfil');

  const title = document.createElement('div'); title.className = 'sheet-title';
  title.textContent = forced ? 'Antes de continuar' : 'Tu perfil';
  if (!forced) {
    const x = document.createElement('button'); x.className = 'sheet-close'; x.textContent = '✕'; x.onclick = close;
    title.appendChild(x);
  }
  sheet.appendChild(title);

  const lblName = document.createElement('label'); lblName.className = 'field-label'; lblName.textContent = 'Nombre';
  const nameIn = document.createElement('input'); nameIn.type = 'text'; nameIn.maxLength = 60;
  nameIn.placeholder = 'Tu nombre'; nameIn.value = p.display_name || '';
  nameIn.style.cssText = 'width:100%;box-sizing:border-box;margin-top:4px';
  sheet.append(lblName, nameIn);

  let adultIn = null;
  if (p.adult_confirmed_at) {
    const ok = document.createElement('div');
    ok.style.cssText = 'margin-top:14px;font-size:0.82rem;color:var(--text2)';
    ok.textContent = '✓ Mayor de edad confirmado el ' + new Date(p.adult_confirmed_at).toLocaleDateString('es-ES');
    sheet.appendChild(ok);
  } else {
    const row = document.createElement('label');
    row.style.cssText = 'display:flex;align-items:flex-start;gap:8px;margin-top:14px;font-size:0.82rem;color:var(--text2);cursor:pointer;line-height:1.4';
    adultIn = document.createElement('input'); adultIn.type = 'checkbox'; adultIn.style.marginTop = '3px';
    const txt = document.createElement('span');
    txt.appendChild(document.createTextNode('Declaro que soy mayor de 18 años y acepto los '));
    const a1 = document.createElement('a'); a1.href = LEGAL_TERMS_URL; a1.target = '_blank'; a1.rel = 'noopener'; a1.textContent = 'Términos';
    const a2 = document.createElement('a'); a2.href = LEGAL_PRIVACY_URL; a2.target = '_blank'; a2.rel = 'noopener'; a2.textContent = 'Política de privacidad';
    txt.append(a1, document.createTextNode(' y la '), a2, document.createTextNode('.'));
    row.append(adultIn, txt);
    sheet.appendChild(row);
  }

  // Plan
  const plan = p.plan || 'trial';
  const planBox = document.createElement('div'); planBox.className = 'card'; planBox.style.cssText = 'padding:12px 14px;margin:16px 0 4px';
  const planLbl = document.createElement('label'); planLbl.className = 'field-label'; planLbl.style.marginTop = '0'; planLbl.textContent = 'Plan';
  const planTxt = document.createElement('div'); planTxt.style.cssText = 'font-weight:700;margin-top:4px';
  planBox.append(planLbl, planTxt);
  if (p.is_admin) {
    planTxt.textContent = 'Administrador';
  } else if (plan === 'trial') {
    let d = null;
    if (p.trial_start) d = TRIAL_DAYS - Math.floor((Date.now() - new Date(p.trial_start).getTime()) / 86400000);
    planTxt.textContent = (d !== null && d > 0) ? 'Prueba gratuita · te quedan ' + d + (d === 1 ? ' día' : ' días') : 'Prueba gratuita';
    const cta = document.createElement('a'); cta.className = 'btn btn-primary';
    cta.href = PLAN_URL; cta.target = '_blank'; cta.rel = 'noopener';
    cta.style.cssText = 'display:block;text-align:center;text-decoration:none;margin-top:10px';
    cta.textContent = 'Ver planes y suscribirme';
    planBox.appendChild(cta);
  } else if (plan === 'free') {
    planTxt.textContent = 'Gratis de por vida';
  } else {
    planTxt.textContent = 'Plan ' + (PLAN_LABELS[plan] || plan);
  }
  sheet.appendChild(planBox);

  const err = document.createElement('div'); err.style.cssText = 'color:var(--red);font-size:0.8rem;margin-top:8px;min-height:1em';
  sheet.appendChild(err);

  const save = document.createElement('button'); save.className = 'btn btn-primary'; save.style.marginTop = '10px';
  save.textContent = forced ? 'Continuar' : 'Guardar';
  save.onclick = async function() {
    const name = nameIn.value.trim();
    if (forced && (!name || !adultIn || !adultIn.checked)) {
      err.textContent = 'Escribe tu nombre y confirma que eres mayor de edad para continuar.';
      return;
    }
    save.disabled = true; err.textContent = '';
    const r = await coachRpc('save_coach_profile', { p_name: name, p_adult: !!(adultIn && adultIn.checked) });
    if (!r.ok) {
      save.disabled = false;
      const why = r.data && (r.data.message || r.data.hint);
      console.error('save_coach_profile', r.data);
      err.textContent = 'No se pudo guardar' + (why ? ' (' + why + ')' : '') + '. Puedes seguir usando la app y probar más tarde.';
      return;
    }
    S.showProfile = false;
    await loadCoachProfile();
    // Si la base no devolvió la confirmación, no se vuelve a abrir en esta sesión
    if (S.coachProfile && !S.coachProfile.adult_confirmed_at) S.profileSkipped = true;
    render();
  };
  sheet.appendChild(save);
  if (forced) {
    const later = document.createElement('button'); later.className = 'btn btn-secondary'; later.style.marginTop = '8px';
    later.textContent = 'Ahora no';
    later.onclick = close;
    sheet.appendChild(later);
  }

  const ver = document.createElement('div');
  ver.style.cssText = 'text-align:center;font-size:0.72rem;color:var(--text2);margin-top:12px';
  ver.textContent = 'Ondrift v' + APP_VERSION;
  sheet.appendChild(ver);

  overlay.appendChild(sheet);
  return overlay;
}

function buildBottomNav() {
  const nav = document.createElement('nav');
  nav.className = 'bottom-nav labeled';
  const mk = function(icon, label, active, onclick, dot) {
    const btn = document.createElement('button');
    btn.className = 'nav-item' + (active ? ' active' : '');
    btn.setAttribute('aria-label', label);
    btn.innerHTML = `<svg viewBox="0 0 24 24">${NAV_ICONS[icon]}</svg><span class="nav-lbl">${label}</span>` + (dot ? '<span class="nav-dot"></span>' : '');
    btn.onclick = onclick;
    return btn;
  };
  if (S.role === 'coach') {
    // Índices de S.tab: 0 Sesión · 1 RPE · 2 Escuadra · 3 Calendario · 4 Inscripciones · 5 Equipo · 6 Historial · 7 Asistencia
    const go = function(i) { return function() { S.tab = i; S.navMore = false; S.rpeMenuAthlete = null; S.bwDetail = null; render(); }; };
    const MORE = [{ tab: 3, icon: 'calend', label: 'Calendario' }, { tab: 4, icon: 'inscr', label: 'Inscripciones' }, { tab: 5, icon: 'equipo', label: 'Equipo' }];
    const inMore = MORE.some(function(m) { return m.tab === S.tab; });
    nav.appendChild(mk('sesion', 'Sesión', S.tab === 0, go(0)));
    nav.appendChild(mk('rpe', 'Carga', S.tab === 1 || S.tab === 2, go(S.lastCargaTab || 1)));
    nav.appendChild(mk('historial', 'Historial', S.tab === 6, go(6)));
    nav.appendChild(mk('asistencia', 'Asistencia', S.tab === 7, go(7)));
    nav.appendChild(mk('mas', 'Más', inMore || S.navMore, function() { S.navMore = !S.navMore; render(); }, S.isAdmin && S.pendingCoachCount > 0));
    if (S.navMore) {
      const wrap = document.createElement('div');
      const back = document.createElement('div'); back.className = 'nav-more-back';
      back.onclick = function() { S.navMore = false; render(); };
      const sheet = document.createElement('div'); sheet.className = 'nav-more';
      MORE.forEach(function(m) {
        const b = document.createElement('button');
        b.className = 'nav-more-item' + (S.tab === m.tab ? ' active' : '');
        b.innerHTML = `<svg viewBox="0 0 24 24">${NAV_ICONS[m.icon]}</svg><span>${m.label}</span>` + (m.icon === 'equipo' && S.isAdmin && S.pendingCoachCount > 0 ? '<span style="margin-left:auto;width:8px;height:8px;border-radius:50%;background:#e5484d;flex:none" aria-label="Entrenadores pendientes"></span>' : '');
        b.onclick = go(m.tab);
        sheet.appendChild(b);
      });
      wrap.append(back, sheet, nav);
      return wrap;
    }
  } else {
    const items = [
      {icon:'inicio',label:'Inicio'},
      {icon:'mirpe',label:'Mi RPE'},
      {icon:'fuerza',label:'Fuerza'},
      {icon:'calend',label:'Agenda'},
      {icon:'inscr',label:'Inscr.'},
      {icon:'natacion',label:'Sesión'}
    ];
    const pending = athleteHasPendingToday(S.athleteName);
    items.forEach(function(item, i) {
      nav.appendChild(mk(item.icon, item.label, S.ath_tab === i, function() { S.ath_tab = i; render(); }, i === 0 && (pending || teamMsgUnseen())));
    });
  }
  return nav;
}

function autoGrow(ta) {
  ta.style.height = 'auto';
  ta.style.height = (ta.scrollHeight + 2) + 'px';
}
function makeGrowTextarea(value, placeholder) {
  const ta = document.createElement('textarea');
  ta.className = 'ta-grow'; ta.maxLength = 4000;
  ta.placeholder = placeholder || '';
  ta.value = value || '';
  // filas iniciales según contenido (inmediato, sin esperar layout)
  const lines = (value || '').split('\n').length;
  ta.rows = Math.max(4, lines + 1);
  return ta;
}
function buildCoachSession() {
  const d = document.createElement('div');
  const st = document.createElement('div');
  st.className = 'section-title'; st.textContent = 'Crear sesión';
  d.appendChild(st);

  // Title
  const l1 = document.createElement('label'); l1.className = 'field-label'; l1.textContent = 'Título';
  d.appendChild(l1);
  const titleIn = document.createElement('input');
  titleIn.type = 'text'; titleIn.maxLength = 100; titleIn.placeholder = 'Ej: Trabajo de velocidad'; titleIn.value = S.sessionTitle;
  titleIn.oninput = e => { S.sessionTitle = e.target.value; };
  d.appendChild(titleIn);

  // RPE objetivo y duración: desplegables, uno al lado del otro
  const pairField = function(labelText, control) {
    const w = document.createElement('div');
    const l = document.createElement('label'); l.className = 'field-label'; l.textContent = labelText;
    w.append(l, control);
    return w;
  };
  const rpeIn = document.createElement('select');
  for (let v = 1; v <= 10; v++) {
    const o = document.createElement('option'); o.value = v; o.textContent = v + ' / 10';
    if (v === S.sessionRPE) o.selected = true;
    rpeIn.appendChild(o);
  }
  rpeIn.onchange = e => { S.sessionRPE = parseInt(e.target.value) || 6; };

  // Duración (min) — para sRPE = RPE × duración. De 5 en 5 entre 30 min y 3 h; se conserva un valor guardado que no esté en la lista.
  const durIn = document.createElement('select');
  const durOpts = [];
  for (let m = 30; m <= 180; m += 5) durOpts.push(m);
  if (durOpts.indexOf(S.sessionDuration) < 0) { durOpts.push(S.sessionDuration); durOpts.sort(function(a, b) { return a - b; }); }
  durOpts.forEach(function(m) {
    const o = document.createElement('option'); o.value = m;
    o.textContent = m + ' min' + (m >= 60 ? ' · ' + Math.floor(m / 60) + ' h' + (m % 60 ? ' ' + (m % 60) : '') : '');
    if (m === S.sessionDuration) o.selected = true;
    durIn.appendChild(o);
  });
  durIn.onchange = e => { S.sessionDuration = parseInt(e.target.value) || 80; };

  const row1 = document.createElement('div'); row1.className = 'form-row-2';
  row1.append(pairField('RPE objetivo', rpeIn), pairField('Duración', durIn));
  d.appendChild(row1);

  // Phase
  const phaseSelect = document.createElement('select');
  // Físico → solo Fuerza (NeuroForce). Mañana/Tarde/Única → nunca Fuerza.
  if (S.sessionSlot === 'fis') S.sessionPhase = 'Fuerza';
  else if (S.sessionPhase === 'Fuerza') S.sessionPhase = 'Ligero';
  const phaseOpts = S.sessionSlot === 'fis' ? ['Fuerza']
    : PHASES.filter(function(p) { return p !== 'Fuerza'; });
  phaseOpts.forEach(p => {
    const o = document.createElement('option'); o.value = p; o.textContent = (S.sessionSlot === 'fis' && p === 'Fuerza') ? 'NeuroForce' : p;
    if (p === S.sessionPhase) o.selected = true;
    phaseSelect.appendChild(o);
  });
  phaseSelect.onchange = e => { S.sessionPhase = e.target.value; S.alphaPhase = null; render(); };

  // Date
  const dateIn = document.createElement('input');
  dateIn.type = 'date'; dateIn.value = S.sessionDate;
  dateIn.oninput = e => { S.sessionDate = e.target.value; };

  const row2 = document.createElement('div'); row2.className = 'form-row-2';
  row2.append(pairField('Fase', phaseSelect), pairField('Fecha', dateIn));
  d.appendChild(row2);

  // Turno selector
  const lturno = document.createElement('label'); lturno.className = 'field-label'; lturno.textContent = 'Turno';
  d.appendChild(lturno);
  const turnoWrap = document.createElement('div'); turnoWrap.className = 'pack-toggle';
  [['unica','Única'],['am','Mañana'],['pm','Tarde'],['fis','Físico']].forEach(function(pair) {
    const btn = document.createElement('button');
    btn.className = 'pack-btn' + (S.sessionSlot === pair[0] ? ' active' : '');
    btn.textContent = pair[1];
    btn.onclick = function() {
      S.sessionSlot = pair[0];
      // Físico = gym NeuroForce: siempre fase Fuerza (muestra Pull/Push/Lower)
      if (pair[0] === 'fis' && S.sessionPhase !== 'Fuerza') { S.sessionPhase = 'Fuerza'; S.alphaPhase = null; render(); return; }
      if (pair[0] !== 'fis' && S.sessionPhase === 'Fuerza') { S.sessionPhase = 'Ligero'; S.alphaPhase = null; render(); return; }
      turnoWrap.querySelectorAll('.pack-btn').forEach(function(b, i) {
        b.classList.toggle('active', ['unica','am','pm','fis'][i] === pair[0]);
      });
    };
    turnoWrap.appendChild(btn);
  });
  d.appendChild(turnoWrap);

  if (S.sessionPhase === 'Fuerza') {
    // AlphaPattern
    const la = document.createElement('label'); la.className = 'field-label'; la.textContent = 'AlphaPattern Fase';
    d.appendChild(la);
    const ag = document.createElement('div'); ag.className = 'alpha-grid';
    ALPHA_PHASES.forEach(ap => {
      const btn = document.createElement('button');
      btn.className = 'alpha-btn' + (S.alphaPhase === ap ? ' selected' : '');
      btn.textContent = ap;
      btn.onclick = () => { S.alphaPhase = ap; render(); };
      ag.appendChild(btn);
    });
    d.appendChild(ag);

    // Pull Push Lower
    ['Pull','Push','Lower Body'].forEach((sec, idx) => {
      const key = ['pullText','pushText','lowerText'][idx];
      const lbl = document.createElement('label'); lbl.className = 'field-label'; lbl.textContent = sec;
      d.appendChild(lbl);
      const ta = makeGrowTextarea(S[key], `Ejercicios ${sec}...`);
      ta.oninput = e => { S[key] = e.target.value; autoGrow(e.target); };
      d.appendChild(ta);
    });
  } else {
    // Normal sections
    const sections = [
      {label:'Warm Up', key:'warmUp'},
      {label:'Pre Set', key:'preSet'},
      {label:'Main Set (Grupo)', key:'mainSet'},
      {label:'Main Set (Fondo)', key:'mainSetFondo'},
      {label:'Cool Down', key:'coolDown'}
    ];
    sections.forEach(sec => {
      const lbl = document.createElement('label'); lbl.className = 'field-label'; lbl.textContent = sec.label;
      d.appendChild(lbl);
      const ta = makeGrowTextarea(S[sec.key], '');
      ta.oninput = e => { S[sec.key] = e.target.value; autoGrow(e.target); updateMeters(d); };
      ta.dataset.key = sec.key;
      d.appendChild(ta);
      const mstat = document.createElement('div'); mstat.className = 'meter-stat'; mstat.dataset.mstat = sec.key;
      const m = metersLabel(S[sec.key]);
      if (m) mstat.textContent = '→ ' + m;
      d.appendChild(mstat);
    });
    // Volume breakdown — el contenedor se crea SIEMPRE (aunque arranque vacío),
    // para que updateMeters() lo pueda ir llenando en vivo sin esperar a un
    // re-render completo de la pantalla (que solo pasa al salir y volver a entrar).
    const volWrap = document.createElement('div'); volWrap.id = 'total-meters-div';
    const volBlock = buildVolumeBlock({ phase: S.sessionPhase, warmUp: S.warmUp, preSet: S.preSet, mainSet: S.mainSet, mainSetFondo: S.mainSetFondo, coolDown: S.coolDown }, '');
    if (volBlock) volWrap.appendChild(volBlock);
    d.appendChild(volWrap);
  }

  // Pack días
  const lpack = document.createElement('label'); lpack.className = 'field-label'; lpack.textContent = 'Paquete de días';
  d.appendChild(lpack);
  const packWrap = document.createElement('div'); packWrap.className = 'pack-toggle';
  [1,2,3,4].forEach(n => {
    const btn = document.createElement('button');
    btn.className = 'pack-btn' + (S.packDays === n ? ' active' : '');
    btn.textContent = n === 1 ? 'Solo hoy' : n + ' días';
    btn.onclick = () => { S.packDays = n; };
    packWrap.appendChild(btn);
    btn.onclick = () => {
      S.packDays = n;
      packWrap.querySelectorAll('.pack-btn').forEach((b,i) => {
        b.classList.toggle('active', i === [1,2,3,4].indexOf(n));
      });
    };
  });
  d.appendChild(packWrap);

  // Actions
  const actions = document.createElement('div'); actions.className = 'actions-row';
  const clearBtn = document.createElement('button');
  clearBtn.className = 'btn btn-secondary'; clearBtn.textContent = 'Limpiar';
  clearBtn.onclick = () => {
    showConfirm('¿Borrar sesión?', 'Se perderán todos los campos cargados en el editor.', () => {
      S.sessionTitle=''; S.sessionRPE=6; S.sessionDuration=80; S.sessionPhase='Ligero'; S.sessionDate=todayStr();
      S.alphaPhase=null; S.pullText=''; S.pushText=''; S.lowerText='';
      S.warmUp=''; S.preSet=''; S.mainSet=''; S.mainSetFondo=''; S.coolDown=''; S.packDays=1;
      render();
    });
  };
  actions.appendChild(clearBtn);

  const pubBtn = document.createElement('button');
  pubBtn.className = 'btn btn-primary'; pubBtn.textContent = 'Publicar';
  pubBtn.onclick = function() {
    // Defensa en profundidad: nunca dejar salir un RPE/duración fuera de rango
    // hacia Supabase (los CHECK constraints de la tabla exigen RPE 1–10 y
    // duración 10–300; si esto falla ahí, llega como 400 sin feedback claro).
    S.sessionRPE = Math.min(10, Math.max(1, S.sessionRPE || 6));
    S.sessionDuration = Math.min(300, Math.max(10, S.sessionDuration || 80));
    const session = {
      title: S.sessionTitle || 'Sin título',
      targetRPE: S.sessionRPE,
      duration: S.sessionDuration,
      phase: S.sessionSlot === 'fis' ? 'Fuerza' : S.sessionPhase,
      alphaPhase: S.alphaPhase,
      pullText: S.pullText,
      pushText: S.pushText,
      lowerText: S.lowerText,
      warmUp: S.warmUp,
      preSet: S.preSet,
      mainSet: S.mainSet,
      mainSetFondo: S.mainSetFondo,
      coolDown: S.coolDown
    };
    const baseDate = S.sessionDate || todayStr();
    const publishPromises = [];
    for (let i = 0; i < S.packDays; i++) {
      const d2 = new Date(baseDate + 'T12:00:00');
      d2.setDate(d2.getDate() + i);
      const ds = d2.getFullYear()+'-'+String(d2.getMonth()+1).padStart(2,'0')+'-'+String(d2.getDate()).padStart(2,'0');
      const slots = S.sessionSlot === 'unica' ? ['am'] : [S.sessionSlot];
      slots.forEach(function(sl) {
        publishPromises.push(dbSaveSession(ds, sl, session));
      });
    }
    const btn = this;
    btn.disabled = true; btn.textContent = 'Publicando…';
    Promise.all(publishPromises).then(function(results) {
      // verificar que TODOS los guardados respondieron ok (no null)
      const allOk = results.every(function(r) { return r !== null && r !== false; });
      if (!allOk) {
        btn.disabled = false; btn.textContent = 'Publicar';
        showToast('⚠ Error — reintenta', 'error');
        return;
      }
      // guardado confirmado → limpiar formulario
      S.sessionTitle=''; S.sessionRPE=6; S.sessionDuration=80; S.sessionPhase='Ligero'; S.sessionDate=todayStr();
      S.alphaPhase=null; S.pullText=''; S.pushText=''; S.lowerText='';
      S.warmUp=''; S.preSet=''; S.mainSet=''; S.mainSetFondo=''; S.coolDown=''; S.packDays=1;
      showToast('✓ Sesión publicada', 'success');
      renderAsync();
    }).catch(function() {
      btn.disabled = false; btn.textContent = 'Publicar';
      showToast('⚠ Error de conexión', 'error');
    });
  };
  actions.appendChild(pubBtn);
  d.appendChild(actions);
  requestAnimationFrame(function(){ d.querySelectorAll('textarea.ta-grow').forEach(autoGrow); });
  return d;
}

function totalMetersFromState() {
  return parseMeters(S.warmUp) + parseMeters(S.preSet) + parseMeters(S.mainSet) + parseMeters(S.mainSetFondo) + parseMeters(S.coolDown);
}
function updateMeters(container) {
  ['warmUp','preSet','mainSet','mainSetFondo','coolDown'].forEach(key => {
    const el = container.querySelector('[data-mstat="'+key+'"]');
    if (el) { const m = metersLabel(S[key]); el.textContent = m ? '→ ' + m : ''; }
  });
  const tmDiv = container.querySelector('#total-meters-div');
  if (tmDiv) {
    tmDiv.innerHTML = '';
    const newBlock = buildVolumeBlock({ phase: S.sessionPhase, warmUp: S.warmUp, preSet: S.preSet, mainSet: S.mainSet, mainSetFondo: S.mainSetFondo, coolDown: S.coolDown }, '');
    if (newBlock) tmDiv.appendChild(newBlock);
  }
}

function buildCoachRPE() {
  const d = document.createElement('div');
  const stTop = document.createElement('div'); stTop.className = 'section-title'; stTop.textContent = 'RPE';
  d.appendChild(stTop);
  const today = todayStr();
  const session = getSession(today);
  const dayRPE = getDayRPE(today);
  const athletes = getAthletes();

  // Today session info
  const sc = document.createElement('div'); sc.className = 'card'; sc.style.marginBottom = '12px';
  const todaySlots = daySlots(session);
  if (todaySlots.length > 0) {
    sc.innerHTML = todaySlots.map(function(s) {
      return '<div class="card-title">' + (s.label ? s.label + ' — ' : '') + escapeHtml(s.sess.title) + '</div>'
        + '<div class="card-sub">RPE objetivo: <strong>' + s.sess.targetRPE + '</strong> · Fase: <strong>' + escapeHtml(s.sess.phase) + '</strong></div>';
    }).join('<div style="height:8px"></div>');
  } else {
    sc.innerHTML = '<div class="card-sub">Sin sesión publicada para hoy</div>';
  }
  d.appendChild(sc);

  // Summary stats
  const responses = athletes.filter(a => dayRPE[a]);
  if (responses.length > 0) {
    let sum = 0, count = 0;
    responses.forEach(function(a) {
      rpeSubmissions(dayRPE[a]).forEach(function(sub) { sum += sub.data.rpe || 0; count++; });
    });
    const avgRPE = count > 0 ? (sum / count).toFixed(1) : '—';
    const targetLbl = todaySlots.length > 0 ? todaySlots.map(function(s){return s.sess.targetRPE;}).join(' / ') : '—';
    const sr = document.createElement('div'); sr.className = 'summary-row';
    [{val:avgRPE,lbl:'RPE Medio'},{val:targetLbl,lbl:'RPE Objetivo'},{val:responses.length+'/'+athletes.length,lbl:'Respuestas'}].forEach(item => {
      const box = document.createElement('div'); box.className = 'summary-box';
      box.innerHTML = `<div class="summary-val">${item.val}</div><div class="summary-lbl">${item.lbl}</div>`;
      sr.appendChild(box);
    });
    d.appendChild(sr);
  }

  // RPE Table
  const st = document.createElement('div'); st.className = 'section-title'; st.textContent = 'Hoy · ' + athletes.filter(function(a) { return dayRPE[a]; }).length + ' de ' + athletes.length + ' respondieron';
  d.appendChild(st);

  // Lista: RPE, nombre y estado, desvío y un botón ⋯ con las acciones
  const targetLbl = todaySlots.map(function(s) { return s.sess.targetRPE; }).filter(Boolean).join(' / ');
  const MORE_SVG = '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>';
  const answeredRows = [], pendingRows = [];
  athletes.forEach(function(name) {
    const entry = dayRPE[name];
    const hasComment = !!getComments()[today + '_' + name];
    const moreBtn = '<button class="rpe-more" data-more-ath="' + escapeHtml(name) + '" aria-label="Acciones para ' + escapeHtml(name) + '">' + MORE_SVG + '</button>';
    const cdot = hasComment ? '<span class="rpe-cdot" title="Tiene comentario"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg></span>' : '';
    if (entry) {
      const subs = rpeSubmissions(entry);
      const circles = subs.map(function(sub) {
        return '<span class="rpe-circle" style="background:' + rpeColor(sub.data.rpe) + '" title="' + (SLOT_SHORT[sub.slot] || sub.slot) + '">' + sub.data.rpe + '</span>';
      }).join('');
      const lastSub = subs[subs.length - 1].data;
      const fat = FATIGUE.find(function(f) { return f.v === lastSub.fatigue; }) || FATIGUE[0];
      const slotMap = normDay(session) || {};
      let deltaSum = 0, deltaCount = 0;
      subs.forEach(function(sub) {
        const target = slotMap[sub.slot] ? slotMap[sub.slot].targetRPE : null;
        if (target) { deltaSum += sub.data.rpe - target; deltaCount++; }
      });
      const delta = deltaCount > 0 ? Math.round(deltaSum / deltaCount) : 0;
      const deltaStr = deltaCount > 0 ? (delta > 0 ? '+' + delta : delta < 0 ? '' + delta : '=') : '';
      const dClass = deltaCount > 0 ? deltaClass(delta) : '';
      const note = lastSub.note ? '<small class="rpe-note">“' + escapeHtml(lastSub.note) + '”</small>' : '';
      answeredRows.push('<div class="rpe-row"><div class="rpe-circles">' + circles + '</div>' +
        '<div class="rpe-nm">' + escapeHtml(name) + cdot + '<small><span style="color:' + fat.color + ';font-weight:600">' + fat.label + '</span>' +
        (targetLbl ? ' · objetivo ' + targetLbl : '') + '</small>' + note + '</div>' +
        '<span class="delta ' + dClass + '">' + deltaStr + '</span>' + moreBtn + '</div>');
    } else {
      pendingRows.push('<div class="rpe-row"><div class="rpe-circles"><span class="rpe-circle rpe-empty">–</span></div>' +
        '<div class="rpe-nm">' + escapeHtml(name) + cdot + '<small class="pending">Sin respuesta</small></div>' + moreBtn + '</div>');
    }
  });
  if (answeredRows.length) {
    const list = document.createElement('div'); list.className = 'card rpe-list'; list.innerHTML = answeredRows.join('');
    d.appendChild(list);
  } else {
    const none = document.createElement('div'); none.className = 'card'; none.innerHTML = '<div class="card-sub">Todavía nadie registró su RPE hoy.</div>';
    d.appendChild(none);
  }
  if (pendingRows.length) {
    const pt = document.createElement('div'); pt.className = 'section-title'; pt.textContent = 'Pendientes · ' + pendingRows.length;
    d.appendChild(pt);
    const plist = document.createElement('div'); plist.className = 'card rpe-list'; plist.innerHTML = pendingRows.join('');
    d.appendChild(plist);
  }

  // Menú de acciones del atleta elegido
  if (S.rpeMenuAthlete) {
    const nm = S.rpeMenuAthlete;
    const hasC = !!getComments()[today + '_' + nm];
    const back = document.createElement('div'); back.className = 'rpe-menu-back'; back.setAttribute('data-menu-close', '');
    const menu = document.createElement('div'); menu.className = 'rpe-menu'; menu.setAttribute('role', 'menu');
    menu.innerHTML = '<div class="rpe-menu-box"><div class="rpe-menu-ttl">' + escapeHtml(nm) + '</div>' +
      '<button class="comment-btn rpe-menu-item" role="menuitem" data-ath="' + escapeHtml(nm) + '"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></svg>' + (hasC ? 'Ver o editar comentario' : 'Escribir comentario') + '</button>' +
      '<button class="rpe-menu-item" role="menuitem" data-lactate-ath="' + escapeHtml(nm) + '"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c3 4 6 7.5 6 11a6 6 0 0 1-12 0c0-3.5 3-7 6-11z"/></svg>Test de lactato</button></div>' +
      '<button class="rpe-menu-cancel" data-menu-close>Cancelar</button>';
    d.append(back, menu);
  }

  // Comment buttons - use event delegation to avoid timing issues
  d.addEventListener('click', function(e) {
    const moreBtn = e.target.closest('[data-more-ath]');
    if (moreBtn) { S.rpeMenuAthlete = moreBtn.dataset.moreAth; render(); return; }
    if (e.target.closest('[data-menu-close]')) { S.rpeMenuAthlete = null; render(); return; }
    if (e.target.closest('.rpe-menu')) S.rpeMenuAthlete = null;
    const lacBtn = e.target.closest('[data-lactate-ath]');
    if (lacBtn) { S.lactateModalAthlete = lacBtn.dataset.lactateAth; render(); return; }
    const btn = e.target.closest('.comment-btn');
    if (!btn) return;
    S.commentAthlete = btn.dataset.ath;
    S.commentText = getComments()[today + '_' + btn.dataset.ath] || '';
    render();
  });

  // Historical RPE — all past sessions, day by day
  const histSt = document.createElement('div'); histSt.className = 'section-title'; histSt.style.marginTop = '24px'; histSt.textContent = 'Historial RPE';
  d.appendChild(histSt);

  const allSessions = getAllSessions().filter(s => s.date !== today);
  if (allSessions.length === 0) {
    const empty = document.createElement('div'); empty.className = 'empty-state'; empty.textContent = 'No hay sesiones anteriores';
    d.appendChild(empty);
  } else {
    allSessions.forEach(s => {
      const dayRPEHist = getDayRPE(s.date);
      const pastResponses = athletes.filter(a => dayRPEHist[a]);
      let pastSum = 0, pastCount = 0;
      pastResponses.forEach(function(a) {
        rpeSubmissions(dayRPEHist[a]).forEach(function(sub) { pastSum += sub.data.rpe || 0; pastCount++; });
      });
      const pastAvg = pastCount > 0 ? (pastSum / pastCount).toFixed(1) : '—';

      const wrapper = document.createElement('div'); wrapper.className = 'hist-date-section';

      const toggle = document.createElement('div'); toggle.className = 'hist-date-toggle';
      const toggleInner = document.createElement('div'); toggleInner.style.cssText = 'display:flex;align-items:center;width:100%;gap:8px';
      const toggleLeft = document.createElement('div'); toggleLeft.style.flex = '1';
      const tgSlots = daySlots(s.data);
      const tgFirst = tgSlots.length > 0 ? tgSlots[0].sess : { title: '—', phase: '—' };
      const tgTitle = tgSlots.length > 1 ? escapeHtml(tgFirst.title) + ' (2x)' : escapeHtml(tgFirst.title);
      toggleLeft.innerHTML = '<div style="font-weight:600;font-size:0.88rem">' + formatDateLabel(s.date) + '</div><div style="font-size:0.75rem;color:var(--text2);margin-top:2px">' + tgTitle + ' · <span class=\"tag\" style=\"font-size:0.65rem\">' + tgFirst.phase + '</span></div>';
      const toggleRight = document.createElement('div'); toggleRight.style.cssText = 'text-align:right;margin-right:10px';

      const toggleArrow = document.createElement('span'); toggleArrow.style.color = 'var(--text2)'; toggleArrow.textContent = S.rpeHistOpen[s.date] ? '\u25b2' : '\u25bc';
      toggleInner.append(toggleLeft, toggleRight, toggleArrow);
      toggle.appendChild(toggleInner);
      toggle.onclick = () => { S.rpeHistOpen[s.date] = !S.rpeHistOpen[s.date]; render(); };
      wrapper.appendChild(toggle);

      if (S.rpeHistOpen[s.date]) {
        const body = document.createElement('div'); body.className = 'hist-date-body open';

        // mini summary
        const miniSum = document.createElement('div'); miniSum.className = 'summary-row'; miniSum.style.cssText = 'margin-bottom:10px;margin-top:4px';
        const objStr = daySlots(s.data).map(function(sl){ return sl.sess.targetRPE; }).join('/') || '—';
        [{val: pastAvg, lbl:'RPE Medio'},{val: objStr, lbl:'Objetivo'},{val: pastResponses.length + '/' + athletes.length, lbl:'Respuestas'}].forEach(function(item) {
          const box = document.createElement('div'); box.className = 'summary-box';
          box.innerHTML = '<div class=\"summary-val\" style=\"font-size:1.1rem\">' + item.val + '</div><div class=\"summary-lbl\">' + item.lbl + '</div>';
          miniSum.appendChild(box);
        });
        body.appendChild(miniSum);

        const tblH = document.createElement('table'); tblH.className = 'rpe-table';
        tblH.innerHTML = '<thead><tr><th>Atleta</th><th>RPE</th><th>Estado</th><th>\u0394</th><th></th></tr></thead>';
        const tbodyH = document.createElement('tbody');
        athletes.forEach(function(name) {
          const entry = dayRPEHist[name];
          const tr = document.createElement('tr');
          const ns = name.split(' ')[0];
          if (entry) {
            const subs = rpeSubmissions(entry);
            const slotMap2 = normDay(s.data) || {};
            const circles = subs.map(function(sub) {
              return '<div class=\"rpe-circle\" style=\"background:' + rpeColor(sub.data.rpe) + ';width:26px;height:26px;font-size:0.75rem;display:inline-flex;margin-right:3px\">' + sub.data.rpe + '</div>';
            }).join('');
            const lastE = subs[subs.length-1].data;
            const fat = FATIGUE.find(function(f) { return f.v === lastE.fatigue; }) || FATIGUE[0];
            let ds2 = 0, dc2 = 0;
            subs.forEach(function(sub) {
              const t2 = slotMap2[sub.slot] ? slotMap2[sub.slot].targetRPE : null;
              if (t2) { ds2 += sub.data.rpe - t2; dc2++; }
            });
            const delta = dc2 > 0 ? Math.round(ds2/dc2) : 0;
            const deltaStr = delta > 0 ? '+'+delta : delta < 0 ? ''+delta : '=';
            const dClass2 = dc2 > 0 ? deltaClass(delta) : '';
            const hasComment = !!getComments()[s.date+'_'+name];
            const noteHtml = lastE.note ? '<div style=\"font-size:0.7rem;color:var(--text2);font-style:italic\">\"' + escapeHtml(lastE.note) + '\"</div>' : '';
            tr.innerHTML = '<td>' + escapeHtml(ns) + noteHtml + '</td><td>' + circles + '</td><td><span class=\"fatigue-label\" style=\"background:' + fat.color + '22;color:' + fat.color + ';font-size:0.7rem\">' + fat.label + '</span></td><td><span class=\"delta ' + dClass2 + '\">' + deltaStr + '</span></td><td><button class=\"comment-btn\" data-ath=\"' + escapeHtml(name) + '\" data-date=\"' + s.date + '\">' + (hasComment ? '\ud83d\udcac' : '\u270f\ufe0f') + '</button></td>';
          } else {
            tr.innerHTML = '<td>' + escapeHtml(ns) + '</td><td colspan=\"3\" style=\"color:var(--text2);font-size:0.78rem\">Sin respuesta</td><td></td>';
          }
          tbodyH.appendChild(tr);
        });
        tblH.appendChild(tbodyH);
        body.appendChild(tblH);
        wrapper.appendChild(body);
      }
      d.appendChild(wrapper);
    });
  }

  // Event delegation for ALL comment buttons (today + history)
  d.addEventListener('click', function(e) {
    const btn = e.target.closest('.comment-btn');
    if (!btn) return;
    const dateKey = btn.dataset.date || today;
    S.commentAthlete = btn.dataset.ath;
    S.commentDate = dateKey;
    S.commentText = getComments()[dateKey + '_' + btn.dataset.ath] || '';
    render();
  });

  if (S.lactateModalAthlete) d.appendChild(buildLactateModal());

  return d;
}

function timeStrToSeconds(str) {
  if (!str) return 0;
  const parts = String(str).split(':');
  if (parts.length === 2) return (parseInt(parts[0],10)||0) * 60 + (parseFloat(parts[1])||0);
  return parseFloat(str) || 0;
}

}
