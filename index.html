<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Terrassa Natació</title>
<style>
  :root {
    --bg: #0a1628;
    --surface: #0d2045;
    --surface2: #102558;
    --accent: #2980b9;
    --accent2: #3498db;
    --red: #c0392b;
    --red2: #e74c3c;
    --text: #f0f4f8;
    --text2: #a8bfd4;
    --green: #27ae60;
    --yellow: #f39c12;
    --orange: #e67e22;
    --border: rgba(41,128,185,0.25);
    --gold: #f0c040;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
  #app { width: 100%; max-width: 480px; min-height: 100vh; display: flex; flex-direction: column; position: relative; padding-bottom: 70px; background: var(--bg); }

  /* LOGIN */
  .login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; gap: 24px; }
  .login-logo { font-size: 1.1rem; font-weight: 700; letter-spacing: 3px; color: var(--accent2); text-transform: uppercase; text-align: center; }
  .login-logo span { display: block; font-size: 2rem; color: var(--text); letter-spacing: 1px; }
  .login-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px; width: 100%; }
  .login-card h2 { font-size: 1rem; color: var(--text2); margin-bottom: 16px; text-align: center; }
  .select-styled { width: 100%; background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 12px 16px; border-radius: 10px; font-size: 1rem; outline: none; appearance: none; -webkit-appearance: none; }
  .btn { display: block; width: 100%; padding: 14px; border-radius: 10px; border: none; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.15s; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:active { background: var(--accent2); transform: scale(0.98); }
  .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text2); }
  .btn-danger { background: var(--red); color: #fff; }
  .btn-sm { padding: 8px 14px; font-size: 0.85rem; width: auto; display: inline-block; }

  /* PIN */
  .pin-screen { display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 40px 24px; }
  .pin-dots { display: flex; gap: 12px; }
  .pin-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--accent); background: transparent; transition: background 0.15s; }
  .pin-dot.filled { background: var(--accent); }
  .pin-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; max-width: 260px; }
  .pin-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--text); font-size: 1.4rem; font-weight: 600; padding: 18px; border-radius: 12px; cursor: pointer; transition: all 0.1s; text-align: center; }
  .pin-btn:active { background: var(--accent); transform: scale(0.95); }
  .pin-error { color: var(--red2); font-size: 0.85rem; }

  /* HEADER */
  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .badge { font-size: 0.7rem; font-weight: 700; letter-spacing: 1.5px; padding: 3px 8px; border-radius: 4px; text-transform: uppercase; }
  .badge-coach { background: var(--gold); color: #1a1a00; }
  .badge-athlete { background: var(--accent); color: #fff; }
  .header-name { font-size: 0.95rem; font-weight: 600; }
  .btn-exit { background: transparent; border: 1px solid var(--border); color: var(--text2); padding: 6px 12px; border-radius: 8px; font-size: 0.8rem; cursor: pointer; }

  /* NAV */
  .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: var(--surface); border-top: 1px solid var(--border); display: flex; z-index: 20; }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 10px 4px 8px; cursor: pointer; color: var(--text2); font-size: 0.65rem; font-weight: 500; letter-spacing: 0.5px; gap: 3px; transition: color 0.15s; border: none; background: transparent; }
  .nav-item.active { color: var(--accent2); }
  .nav-icon { font-size: 1.3rem; line-height: 1; }

  /* CONTENT */
  .content { padding: 16px; flex: 1; background: var(--bg); }
  .section-title { font-size: 0.75rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--red2); margin-bottom: 12px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .card-title { font-size: 0.9rem; font-weight: 600; margin-bottom: 4px; color: var(--red2); }
  .card-sub { font-size: 0.8rem; color: var(--text2); }

  /* FORM */
  label.field-label { display: block; font-size: 0.75rem; font-weight: 600; color: var(--text2); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; margin-top: 14px; }
  input[type=text], input[type=number], input[type=date], select, textarea {
    width: 100%; background: var(--surface2); border: 1px solid var(--border); color: var(--text);
    padding: 10px 14px; border-radius: 8px; font-size: 0.9rem; outline: none; font-family: inherit;
    -webkit-appearance: none; appearance: none; box-sizing: border-box;
  }
  input[type=date] { height: 44px; line-height: 44px; padding: 0 14px; }
  input[type=text]:focus, input[type=number]:focus, input[type=date]:focus, select:focus, textarea:focus {
    border-color: var(--accent);
  }
  textarea { resize: vertical; min-height: 90px; line-height: 1.5; }
  input[type=date]::-webkit-calendar-picker-indicator { filter: invert(0.7); }

  /* ALPHA GRID */
  .alpha-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .alpha-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--text2); padding: 12px 8px; border-radius: 8px; font-size: 0.8rem; font-weight: 600; cursor: pointer; text-align: center; transition: all 0.15s; }
  .alpha-btn.selected { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* METER STATS */
  .meter-stat { font-size: 0.78rem; color: var(--accent2); margin-top: 4px; }
  .total-meters { background: rgba(41,128,185,0.15); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; margin-top: 8px; font-size: 0.85rem; display: flex; justify-content: space-between; }

  /* PACK TOGGLE */
  .pack-toggle { display: flex; gap: 8px; margin-top: 8px; }
  .pack-btn { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface2); color: var(--text2); font-size: 0.85rem; font-weight: 600; cursor: pointer; text-align: center; transition: all 0.15s; }
  .pack-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* ACTION BUTTONS */
  .actions-row { display: flex; gap: 10px; margin-top: 16px; }

  /* RPE TABLE */
  .rpe-table { width: 100%; border-collapse: collapse; background: transparent; }
  .rpe-table th { font-size: 0.7rem; color: var(--red2); text-align: left; padding: 6px 8px; letter-spacing: 1px; text-transform: uppercase; border-bottom: 1px solid var(--border); background: transparent; }
  .rpe-table td { padding: 10px 8px; border-bottom: 1px solid rgba(255,255,255,0.05); vertical-align: middle; font-size: 0.85rem; color: var(--text); background: transparent; }
  .rpe-circle { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; font-weight: 700; color: #fff; }
  .fatigue-label { font-size: 0.75rem; padding: 2px 8px; border-radius: 10px; font-weight: 600; white-space: nowrap; }
  .delta { font-size: 0.8rem; font-weight: 600; }
  .delta.plus { color: var(--red2); }
  .delta.minus { color: var(--green); }
  .comment-btn { background: transparent; border: none; font-size: 1.1rem; cursor: pointer; padding: 4px; }
  .no-data { color: var(--text2); font-size: 0.85rem; text-align: center; padding: 20px; }

  /* RPE SUMMARY */
  .summary-row { display: flex; gap: 10px; margin-bottom: 16px; }
  .summary-box { flex: 1; background: var(--surface2); border-radius: 10px; padding: 12px; text-align: center; }
  .summary-val { font-size: 1.5rem; font-weight: 700; }
  .summary-lbl { font-size: 0.7rem; color: var(--text2); margin-top: 2px; }

  /* HISTORY */
  .hist-row { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; overflow: hidden; }
  .hist-header { display: flex; align-items: center; gap: 12px; padding: 12px 14px; cursor: pointer; }
  .hist-date-block { text-align: center; min-width: 36px; }
  .hist-day-name { font-size: 0.65rem; color: var(--text2); text-transform: uppercase; letter-spacing: 1px; }
  .hist-day-num { font-size: 1.3rem; font-weight: 700; line-height: 1; }
  .hist-month { font-size: 0.65rem; color: var(--text2); text-transform: uppercase; }
  .hist-info { flex: 1; }
  .hist-title { font-size: 0.9rem; font-weight: 600; color: var(--red2); }
  .hist-meta { font-size: 0.75rem; color: var(--text2); display: flex; gap: 10px; margin-top: 2px; }
  .hist-body { padding: 0 14px 14px; border-top: 1px solid var(--border); display: none; }
  .hist-body.open { display: block; }

  /* CALENDAR */
  .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .cal-nav { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 1rem; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; background: #1a3a6b; border-radius: 10px; padding: 6px; }
  .cal-dh { text-align: center; font-size: 0.65rem; color: var(--text2); padding: 6px 2px; font-weight: 600; text-transform: uppercase; }
  .cal-day { text-align: center; padding: 8px 2px; border-radius: 6px; font-size: 0.85rem; cursor: pointer; transition: background 0.1s; min-height: 34px; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 2px; color: var(--text); }
  .cal-day.other-month { color: var(--text2); opacity: 0.35; }
  .cal-day.today { background: var(--accent); color: #fff; font-weight: 700; border: none; }
  .cal-day.has-session { background: rgba(41,128,185,0.18); color: var(--accent2); font-weight: 600; }
  .cal-day.has-session::after { content: ''; display: block; width: 4px; height: 4px; border-radius: 50%; background: var(--accent2); }
  .cal-day.has-comp::after { content: ''; display: block; width: 4px; height: 4px; border-radius: 50%; background: var(--red2); }
  .cal-day.is-comp { background: rgba(192,57,43,0.25); color: #ff7a6e; font-weight: 700; border: 1px solid rgba(192,57,43,0.5); }
  .comp-item { background: rgba(192,57,43,0.1); border: 1px solid rgba(192,57,43,0.3); border-radius: 8px; padding: 10px 14px; margin-bottom: 8px; }
  .comp-name { font-weight: 600; font-size: 0.9rem; }
  .comp-sub { font-size: 0.78rem; color: var(--text2); margin-top: 3px; }
  .comp-badge { display: inline-block; font-size: 0.65rem; font-weight: 700; letter-spacing: 1px; padding: 2px 8px; border-radius: 10px; background: rgba(192,57,43,0.3); color: var(--red2); text-transform: uppercase; margin-top: 4px; }

  /* ATHLETE INICIO */
  .welcome-card { background: linear-gradient(135deg, var(--surface2) 0%, rgba(41,128,185,0.2) 100%); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 16px; }
  .welcome-name { font-size: 1.1rem; font-weight: 700; color: var(--red2); }
  .welcome-date { font-size: 0.8rem; color: var(--text2); margin-top: 4px; }
  .coach-msg { background: rgba(41,128,185,0.15); border: 1px solid var(--accent); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .coach-msg-lbl { font-size: 0.7rem; color: var(--accent2); font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; }
  .alert-comp { background: rgba(192,57,43,0.15); border: 1px solid rgba(192,57,43,0.5); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .alert-comp-lbl { font-size: 0.7rem; color: var(--red2); font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 4px; }
  .week-sessions { margin-top: 8px; }
  .day-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; overflow: hidden; }
  .day-card.today-card { border-color: var(--accent); }
  .day-card-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; cursor: pointer; }
  .day-name { font-size: 0.85rem; font-weight: 600; }
  .day-phase { font-size: 0.7rem; color: var(--text2); }
  .day-card-body { padding: 0 14px 14px; border-top: 1px solid var(--border); display: none; }
  .day-card-body.open { display: block; }
  .session-section { margin-top: 10px; }
  .section-lbl { font-size: 0.7rem; font-weight: 700; letter-spacing: 1px; color: var(--red2); text-transform: uppercase; margin-bottom: 4px; }
  .session-lines { font-size: 0.82rem; line-height: 1.7; white-space: pre-wrap; color: var(--text); }
  .at-note { color: var(--gold); }

  /* RPE SELECTOR */
  .rpe-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 8px; }
  .rpe-btn { padding: 14px 4px; border-radius: 8px; border: 2px solid transparent; font-size: 1rem; font-weight: 700; cursor: pointer; text-align: center; transition: all 0.15s; }
  .rpe-btn.selected { border-color: #fff; transform: scale(1.08); }
  .fatigue-grid { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .fatigue-btn { flex: 1; min-width: 80px; padding: 12px 6px; border-radius: 8px; border: 2px solid transparent; font-size: 0.78rem; font-weight: 600; cursor: pointer; text-align: center; transition: all 0.15s; color: #fff; }
  .fatigue-btn.selected { border-color: #fff; transform: scale(1.05); }
  .confirm-screen { text-align: center; padding: 40px 20px; }
  .confirm-emoji { font-size: 4rem; }
  .confirm-rpe { font-size: 3rem; font-weight: 700; margin: 16px 0 8px; }
  .confirm-label { font-size: 1rem; color: var(--text2); }

  /* STATS */
  .stat-row { display: flex; gap: 10px; margin-bottom: 16px; }
  .stat-box { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px; text-align: center; }
  .stat-val { font-size: 1.6rem; font-weight: 700; color: var(--accent2); }
  .stat-lbl { font-size: 0.7rem; color: var(--text2); margin-top: 4px; }
  .bar-chart { display: flex; align-items: flex-end; gap: 4px; height: 120px; margin-top: 12px; }
  .bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; height: 100%; justify-content: flex-end; }
  .bar { width: 100%; border-radius: 4px 4px 0 0; min-height: 2px; transition: height 0.3s; }
  .bar-val { font-size: 0.6rem; color: var(--text2); }

  /* BOTTOM SHEET */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 50; display: none; }
  .overlay.open { display: block; }
  .bottom-sheet { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: var(--surface); border-radius: 20px 20px 0 0; border: 1px solid var(--border); padding: 20px; z-index: 51; transition: transform 0.25s; }
  .sheet-title { font-size: 1rem; font-weight: 700; margin-bottom: 14px; color: var(--red2); }
  .sheet-close { float: right; background: var(--surface2); border: none; color: var(--text); padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; }

  /* TEAM */
  .athlete-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; background: var(--surface2); border-radius: 8px; margin-bottom: 6px; }
  .athlete-name { font-size: 0.9rem; font-weight: 500; }
  .btn-del { background: rgba(192,57,43,0.2); border: 1px solid rgba(192,57,43,0.4); color: var(--red2); padding: 5px 12px; border-radius: 6px; font-size: 0.78rem; cursor: pointer; }

  /* HIST PAST RPE */
  .hist-rpe-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .hist-rpe-name { flex: 1; font-size: 0.82rem; }
  .hist-date-section { background: rgba(41,128,185,0.08); border: 1px solid var(--border); border-radius: 8px; margin-top: 8px; overflow: hidden; }
  .hist-date-toggle { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; cursor: pointer; font-size: 0.85rem; font-weight: 600; }
  .hist-date-body { padding: 0 14px 10px; display: none; }
  .hist-date-body.open { display: block; }

  /* MISC */
  .divider { height: 1px; background: var(--border); margin: 16px 0; }
  .tag { display: inline-block; font-size: 0.7rem; font-weight: 600; padding: 2px 8px; border-radius: 10px; background: rgba(41,128,185,0.2); color: var(--accent2); margin-right: 4px; }
  .tag-red { background: rgba(192,57,43,0.2); color: var(--red2); }
  .empty-state { text-align: center; padding: 30px 20px; color: var(--text2); font-size: 0.85rem; }

  .greyed { opacity: 0.4; }
  .note-field { margin-top: 10px; }
  input[type=number]::-webkit-inner-spin-button { opacity: 0.5; }

  /* ── INSCRIPCIONS ── */
  .insc-deadline { margin-top:10px; display:inline-flex; align-items:center; gap:8px; background:rgba(243,156,18,0.12); border:1px solid rgba(243,156,18,0.4); color:var(--yellow); font-size:0.75rem; font-weight:600; padding:6px 12px; border-radius:20px; }
  .insc-deadline.win-before { background:rgba(52,152,219,0.1); border-color:var(--border); color:var(--text2); }
  .insc-deadline.win-after { background:rgba(231,76,60,0.1); border-color:rgba(231,76,60,0.4); color:var(--red2); }
  .insc-counter { font-size:0.8rem; font-weight:700; color:var(--accent2); background:rgba(52,152,219,0.12); border:1px solid var(--border); padding:5px 12px; border-radius:20px; }
  .insc-counter.full { color:var(--red2); border-color:rgba(231,76,60,0.5); background:rgba(231,76,60,0.1); }
  .stroke-label { font-size:0.7rem; letter-spacing:2px; text-transform:uppercase; color:var(--text2); font-weight:700; margin:14px 0 8px; display:flex; align-items:center; gap:8px; }
  .stroke-label::after { content:''; flex:1; height:1px; background:var(--border); }
  .insc-chips { display:flex; flex-wrap:wrap; gap:8px; }
  .insc-chip { background:var(--surface); border:1px solid var(--border); color:var(--text2); padding:11px 16px; border-radius:12px; font-size:0.9rem; font-weight:600; cursor:pointer; transition:all 0.15s; user-select:none; }
  .insc-chip:active { transform:scale(0.95); }
  .insc-chip.sel { background:var(--accent); border-color:var(--accent2); color:#fff; box-shadow:0 4px 14px rgba(41,128,185,0.4); }
  .insc-chip.sel::before { content:'\2713 '; font-weight:800; }
  .insc-chip.dis { opacity:0.35; pointer-events:none; }
  .insc-matrix-wrap { background:var(--surface); border:1px solid var(--border); border-radius:14px; overflow:hidden; margin:14px 0; }
  .insc-matrix-scroll { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .insc-matrix { border-collapse:collapse; width:max-content; min-width:100%; font-size:0.78rem; }
  .insc-matrix th, .insc-matrix td { padding:9px 10px; text-align:center; white-space:nowrap; border-bottom:1px solid rgba(41,128,185,0.12); }
  .insc-matrix thead th { background:var(--surface2); color:var(--text2); font-size:0.6rem; letter-spacing:0.5px; text-transform:uppercase; }
  .insc-matrix th.iname, .insc-matrix td.iname { position:sticky; left:0; background:var(--surface2); text-align:left; font-weight:700; font-size:0.73rem; z-index:2; min-width:120px; box-shadow:2px 0 6px rgba(0,0,0,0.35); }
  .insc-matrix td.iname { background:var(--surface); }
  .insc-matrix .ix { color:var(--accent2); font-weight:800; }
  .insc-matrix tfoot td { background:var(--surface2); color:var(--gold); font-weight:800; font-size:0.7rem; border-top:1px solid var(--border); }
  .insc-stat-row { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin:12px 0; }
  .insc-stat { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:12px 8px; text-align:center; }
  .insc-stat b { display:block; font-size:1.3rem; color:var(--accent2); }
  .insc-stat.gold b { color:var(--gold); }
  .insc-stat span { font-size:0.6rem; letter-spacing:1px; text-transform:uppercase; color:var(--text2); font-weight:600; }
  .insc-comp-sel { display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:10px; }
  .insc-comp-sel button { flex:0 0 auto; background:var(--surface); border:1px solid var(--border); color:var(--text2); padding:8px 14px; border-radius:10px; font-size:0.78rem; font-weight:600; cursor:pointer; }
  .insc-comp-sel button.on { background:var(--accent); color:#fff; border-color:var(--accent2); }

  /* ── Modal confirmación ── */
  .confirm-back { position:fixed; inset:0; background:rgba(4,16,31,0.78); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; z-index:200; padding:24px; animation:fadeIn 0.15s ease; }

let SB_STATUS = 'ok'; // 'ok' | 'nokey' | 'auth' | 'offline'
async function sbFetch(path, options) {
  if (SUPABASE_KEY.indexOf('PEGA_AQUI') === 0) { SB_STATUS = 'nokey'; return null; }
  const url = SUPABASE_URL + '/rest/v1/' + path;
  const headers = {
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer ' + SUPABASE_KEY,
    'Content-Type': 'application/json',
    'Prefer': options && options.prefer ? options.prefer : 'return=representation'
  };
  try {
    const res = await fetch(url, { ...options, headers: { ...headers, ...(options && options.headers || {}) } });
    if (!res.ok) {
      const err = await res.text(); console.error('SB error', path, err);
      if (res.status === 401 || res.status === 403) SB_STATUS = 'auth';
      return null;
    }
    SB_STATUS = 'ok';
    const text = await res.text();
    return text ? JSON.parse(text) : null;
  } catch (e) {
    console.error('SB sin conexión', path, e.message);
    SB_STATUS = 'offline';
    return null;
  }
}

async function dbGetAllSessions(weeks) {
  // Ventana de arranque: solo las últimas N semanas (por defecto 6).
  if (_allSessionsCache) return _allSessionsCache;
  const w = weeks || 6;
  const from = new Date(); from.setDate(from.getDate() - w * 7);
  const fromS = from.getFullYear()+'-'+String(from.getMonth()+1).padStart(2,'0')+'-'+String(from.getDate()).padStart(2,'0');
  const rows = await sbFetch('sessions?select=*&date=gte.' + fromS + '&order=date.desc');
  if (!rows) return [];
  const byDate = {};
  rows.forEach(r => {
    if (!byDate[r.date]) byDate[r.date] = { am: null, pm: null };
    const sess = { ...r.content, title: r.title, phase: r.phase, targetRPE: r.target_rpe, alphaPhase: r.alpha_phase };
    byDate[r.date][r.slot] = sess;
  });
  _allSessionsCache = Object.entries(byDate).map(([date, data]) => ({ date, data })).sort((a,b) => b.date.localeCompare(a.date));
  _loadedMonths = {};
  // marcar los meses ya cubiertos por la ventana inicial
  _allSessionsCache.forEach(function(s){ _loadedMonths[s.date.slice(0,7)] = true; });
  return _allSessionsCache;
}

// Carga un mes concreto bajo demanda (formato 'YYYY-MM'). Fusiona en la caché.
let _loadedMonths = {};
async function dbLoadSessionMonth(ym) {
  if (_loadedMonths[ym]) return;
  const first = ym + '-01';
  const [y, m] = ym.split('-').map(Number);
  const lastDay = new Date(y, m, 0).getDate();
  const last = ym + '-' + String(lastDay).padStart(2,'0');
  const rows = await sbFetch('sessions?select=*&date=gte.' + first + '&date=lte.' + last + '&order=date.desc');
  _loadedMonths[ym] = true;
  if (!rows || rows.length === 0) return;
  const byDate = {};
  rows.forEach(r => {
    if (!byDate[r.date]) byDate[r.date] = { am: null, pm: null };
    const sess = { ...r.content, title: r.title, phase: r.phase, targetRPE: r.target_rpe, alphaPhase: r.alpha_phase };
    byDate[r.date][r.slot] = sess;
  });
  const existing = {}; (_allSessionsCache || []).forEach(function(s){ existing[s.date] = s; });
  Object.entries(byDate).forEach(([date, data]) => { existing[date] = { date, data }; });
  _allSessionsCache = Object.values(existing).sort((a,b) => b.date.localeCompare(a.date));
  DATA.allSessions = _allSessionsCache;
  DATA.sessions = {}; _allSessionsCache.forEach(x => { DATA.sessions[x.date] = x.data; });
}

// ── RPE ────────────────────────────────────────────────────
let _rpeCache = {};
let _rpeRangeLoaded = false;
async function dbGetRPERange(days) {
  // 1 sola petición para los últimos N días, agrupada por fecha en cliente
  const from = new Date(); from.setDate(from.getDate() - (days - 1));
  const fromS = from.getFullYear()+'-'+String(from.getMonth()+1).padStart(2,'0')+'-'+String(from.getDate()).padStart(2,'0');
  const rows = await sbFetch('rpe_entries?date=gte.' + fromS + '&select=*,athletes(name)&order=date');
  const byDate = {};
  (rows || []).forEach(r => {
    const name = r.athletes?.name;
    if (!name) return;
    if (!byDate[r.date]) byDate[r.date] = {};
    if (!byDate[r.date][name]) byDate[r.date][name] = { am: null, pm: null };
    byDate[r.date][name][r.slot] = { rpe: r.rpe, fatigue: r.fatigue, note: r.note, ts: new Date(r.created_at).getTime() };
  });
  // rellenar caché completa del rango (días sin datos = {})
  for (let i = 0; i < days; i++) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const ds = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    _rpeCache[ds] = byDate[ds] || {};
  }
  _rpeRangeLoaded = true;
  return _rpeCache;
}
async function dbGetDayRPE(date) {
  if (_rpeCache[date]) return _rpeCache[date];
  const rows = await sbFetch('rpe_entries?date=eq.' + date + '&select=*,athletes(name)');
  if (!rows) { _rpeCache[date] = {}; return {}; }
  const result = {};
  rows.forEach(r => {
    const name = r.athletes?.name;
    if (!name) return;
    if (!result[name]) result[name] = { am: null, pm: null };
    result[name][r.slot] = { rpe: r.rpe, fatigue: r.fatigue, note: r.note, ts: new Date(r.created_at).getTime() };
  });
  _rpeCache[date] = result;
  return result;
}

  const ok = document.createElement('button');
  ok.className = 'confirm-ok';
  ok.textContent = opts.okText || 'Borrar';
  if (opts.okSafe) ok.classList.add('safe');
  cancel.onclick = function() { back.remove(); };
  back.onclick = function(e) { if (e.target === back) back.remove(); };
  ok.onclick = function() { back.remove(); onConfirm(); };
  btns.append(cancel, ok);
  box.appendChild(btns);
  back.appendChild(box);
  document.body.appendChild(back);
}

async function loadData() {
  // Carga en paralelo: 7 peticiones máximo (antes ~35 en cascada).
  // Las cachés evitan refetch de lo que no cambió tras una acción.
  const tasks = [
    dbGetAthletes().then(a => { DATA.athletes = a; }),
    dbGetAllSessions(6).then(s => {
      DATA.allSessions = s;
      DATA.sessions = {};
      s.forEach(x => { DATA.sessions[x.date] = x.data; });
    }),
    (_rpeRangeLoaded ? Promise.resolve() : dbGetRPERange(30)).then(() => { DATA.rpe = _rpeCache; }),
    dbGetComments().then(c => { DATA.comments = c; }),
    dbGetCompetitions().then(c => { DATA.competitions = c; }),
    dbGetEvents().then(e => { DATA.events = e; }),
    dbGetInscriptions().then(i => { DATA.inscriptions = i; })
  ];
  if (S.athleteName) {
    tasks.push(dbGetAthleteHist(S.athleteName).then(h => { DATA.athleteHist[S.athleteName] = h; }));
  }
  await Promise.all(tasks);
}

async function renderAsync() {
  showLoading();
  try { await loadData(); }
  catch (e) { console.error('loadData falló', e); }
  render();
}

function parseMeters(text) {
  if (!text) return 0;
  let total = 0;
  text.split('\n').forEach(line => {
    const t = line.trim();
    if (!t) return;
    // NxD pattern: 4x50, 6X100, 3×200
    const mult = t.match(/(\d+)\s*[xX×]\s*(\d+)/);
    if (mult) { total += parseInt(mult[1]) * parseInt(mult[2]); return; }
    // Bare distance: line starts with a number (e.g. "300 FC", "200 patada")
    const bare = t.match(/^(\d+)\s+[^x×X]/);
    if (bare) { total += parseInt(bare[1]); }
  });
  return total;
}
function metersLabel(text) {
  const m = parseMeters(text);
  return m > 0 ? m + ' m' : '';
}
function totalMeters(session) {
  if (session.phase === 'Fuerza') return 0;
  return parseMeters(session.warmUp) + parseMeters(session.preSet) + parseMeters(session.mainSet) + parseMeters(session.coolDown);
}


// ============================================================
// DOUBLE SESSION HELPERS
// ============================================================
// Storage format v2: tn:session:DATE = { am: sessObj|null, pm: sessObj|null }
// Legacy format: tn:session:DATE = sessObj (treated as single/am)
function normDay(raw) {
  if (!raw) return null;
  if (raw.am !== undefined || raw.pm !== undefined) return { am: raw.am || null, pm: raw.pm || null };
  return { am: raw, pm: null }; // legacy single session
}
function daySlots(raw) {
  const n = normDay(raw);
  if (!n) return [];
  const out = [];
  if (n.am) out.push({ slot: 'am', label: n.pm ? '☀️ Mañana' : '', sess: n.am });
  if (n.pm) out.push({ slot: 'pm', label: '🌙 Tarde', sess: n.pm });
  return out;
}
function isDoubleDay(raw) {
  const n = normDay(raw);
  return !!(n && n.am && n.pm);
}
// RPE format v2 (double days): entry = { am: {rpe,fatigue,note}, pm: {...} }
// Legacy: entry = { rpe, fatigue, note }
function normRPE(entry) {
  if (!entry) return null;
  if (entry.am !== undefined || entry.pm !== undefined) return { am: entry.am || null, pm: entry.pm || null };
  return { am: entry, pm: null };
}
function rpeSubmissions(entry) {
  const n = normRPE(entry);
  if (!n) return [];
  const out = [];
  if (n.am) out.push({ slot: 'am', data: n.am });
  if (n.pm) out.push({ slot: 'pm', data: n.pm });
  return out;
}

// ============================================================
// RPE COLOR
// ============================================================
function rpeColor(v) {
  if (!v) return '#555';
  if (v <= 3) return '#27ae60';
  if (v <= 5) return '#8bc34a';
  if (v <= 6) return '#f39c12';
  if (v <= 8) return '#e67e22';
  return '#e74c3c';
}

// ============================================================
// RENDER AT-NOTES
// ============================================================
function renderTextWithNotes(text) {
  if (!text) return '';
  return text.split('\n').map(line => {
    if (!line.trim()) return '';
    const parts = line.split(/(@[^@\n]+)/g);
    return parts.map(p => p.startsWith('@') ? `<span class="at-note">${p}</span>` : p).join('');
  }).filter(Boolean).join('\n');
}


// ============================================================
// ACWR CALCULATOR
// ============================================================
function calcACWR(athleteName) {
  try {
  const hist = DATA.athleteHist[athleteName] || [];
    if (hist.length < 3) return null;
    const today = new Date();
    let acute = 0, acuteCount = 0;
    let chronic = 0, chronicCount = 0;
    hist.forEach(function(h) {
      const d = dateObj(h.date);
      const daysAgo = Math.floor((today - d) / 86400000);
      if (daysAgo >= 0 && daysAgo < 7)  { acute += h.rpe; acuteCount++; }
      if (daysAgo >= 0 && daysAgo < 28) { chronic += h.rpe; chronicCount++; }
    });
    if (chronicCount === 0) return null;
    const acuteAvg = acuteCount > 0 ? acute / acuteCount : 0;
    const chronicAvg = chronic / chronicCount;
    if (chronicAvg === 0) return null;
    return Math.round((acuteAvg / chronicAvg) * 100) / 100;
  } catch(e) { return null; }
}
function acwrLabel(ratio) {
  if (ratio === null) return null;
  if (ratio < 0.8)  return { label: 'Subcarga', color: '#3498db', icon: '↓' };
  if (ratio <= 1.3) return { label: 'Óptimo',   color: '#27ae60', icon: '✓' };
  if (ratio <= 1.5) return { label: 'Atención', color: '#f39c12', icon: '⚠' };
  return              { label: 'Riesgo',    color: '#e74c3c', icon: '⚡' };
}

    const targetLbl = todaySlots.length > 0 ? todaySlots.map(function(s){return s.sess.targetRPE;}).join(' / ') : '—';
    const sr = document.createElement('div'); sr.className = 'summary-row';
    [{val:avgRPE,lbl:'RPE Medio'},{val:targetLbl,lbl:'RPE Objetivo'},{val:responses.length+'/'+athletes.length,lbl:'Respuestas'}].forEach(item => {
      const box = document.createElement('div'); box.className = 'summary-box';
      box.innerHTML = `<div class="summary-val">${item.val}</div><div class="summary-lbl">${item.lbl}</div>`;
      sr.appendChild(box);
    });
    d.appendChild(sr);
  }

  // RPE Table
  const st = document.createElement('div'); st.className = 'section-title'; st.textContent = 'HOY — ' + formatDateLabel(today).toUpperCase();
  d.appendChild(st);

  const tbl = document.createElement('table'); tbl.className = 'rpe-table';
  tbl.innerHTML = '<thead><tr><th>Atleta</th><th>RPE</th><th>Estado</th><th>Δ</th><th>ACWR</th><th></th></tr></thead>';
  const tbody = document.createElement('tbody');
  athletes.forEach(name => {
    const entry = dayRPE[name];
    const tr = document.createElement('tr');
    const nameShort = name.split(' ')[0];
    const acwr = calcACWR(name);
    const acwrInfo = acwrLabel(acwr);
    const acwrCell = acwrInfo
      ? '<span style="font-size:0.72rem;font-weight:700;color:' + acwrInfo.color + '" title="ACWR ' + acwr + '">' + acwrInfo.icon + ' ' + acwr + '</span>'
      : '<span style="color:var(--text2);font-size:0.72rem">—</span>';
    if (entry) {
      const subs = rpeSubmissions(entry);
      const circles = subs.map(function(sub) {
        return '<div class="rpe-circle" style="background:' + rpeColor(sub.data.rpe) + ';display:inline-flex;margin-right:4px;width:28px;height:28px;font-size:0.78rem" title="' + sub.slot + '">' + sub.data.rpe + '</div>';
      }).join('');
      const lastSub = subs[subs.length - 1].data;
      const fat = FATIGUE.find(f => f.v === lastSub.fatigue) || FATIGUE[0];
      const slotMap = normDay(session) || {};
      let deltaSum = 0, deltaCount = 0;
      subs.forEach(function(sub) {
        const target = slotMap[sub.slot] ? slotMap[sub.slot].targetRPE : null;
        if (target) { deltaSum += sub.data.rpe - target; deltaCount++; }
      });
      const delta = deltaCount > 0 ? Math.round(deltaSum / deltaCount) : 0;
      const deltaStr = delta > 0 ? '+'+delta : delta < 0 ? ''+delta : '=';
      const deltaClass = delta > 0 ? 'plus' : delta < 0 ? 'minus' : '';
      tr.innerHTML = `
        <td>${nameShort}</td>
        <td>${circles}</td>
        <td><span class="fatigue-label" style="background:${fat.color}22;color:${fat.color}">${fat.label}</span></td>
        <td><span class="delta ${deltaClass}">${deltaStr}</span></td>
        <td>${acwrCell}</td>
        <td><button class="comment-btn" data-ath="${name}">${getComments()[today+'_'+name] ? '💬' : '✏️'}</button></td>
      `;
    } else {
      tr.innerHTML = '<td>' + nameShort + '</td><td colspan="2" style="color:var(--text2);font-size:0.8rem">Sin respuesta</td><td></td><td>' + acwrCell + '</td><td><button class="comment-btn" data-ath="' + name + '">✏️</button></td>';
    }
    tbody.appendChild(tr);
  });
  tbl.appendChild(tbody);
  d.appendChild(tbl);

  // Comment buttons - use event delegation to avoid timing issues
  d.addEventListener('click', function(e) {
    const btn = e.target.closest('.comment-btn');
    if (!btn) return;
    S.commentAthlete = btn.dataset.ath;
    S.commentText = getComments()[today + '_' + btn.dataset.ath] || '';
    render();
  });

  // Historical RPE — all past sessions, day by day
  const histSt = document.createElement('div'); histSt.className = 'section-title'; histSt.style.marginTop = '24px'; histSt.textContent = 'HISTORIAL RPE';
  d.appendChild(histSt);

  const allSessions = getAllSessions().filter(s => s.date !== today);
  if (allSessions.length === 0) {
    const empty = document.createElement('div'); empty.className = 'empty-state'; empty.textContent = 'No hay sesiones anteriores';
    d.appendChild(empty);
  } else {
    allSessions.forEach(s => {
      const dayRPEHist = getDayRPE(s.date);
      const pastResponses = athletes.filter(a => dayRPEHist[a]);
      let pastSum = 0, pastCount = 0;
      pastResponses.forEach(function(a) {
        rpeSubmissions(dayRPEHist[a]).forEach(function(sub) { pastSum += sub.data.rpe || 0; pastCount++; });
      });
      const pastAvg = pastCount > 0 ? (pastSum / pastCount).toFixed(1) : '—';

      const wrapper = document.createElement('div'); wrapper.className = 'hist-date-section';

      const toggle = document.createElement('div'); toggle.className = 'hist-date-toggle';
      const toggleInner = document.createElement('div'); toggleInner.style.cssText = 'display:flex;align-items:center;width:100%;gap:8px';
      const toggleLeft = document.createElement('div'); toggleLeft.style.flex = '1';
      const tgSlots = daySlots(s.data);
      const tgFirst = tgSlots.length > 0 ? tgSlots[0].sess : { title: '—', phase: '—' };
      const tgTitle = tgSlots.length > 1 ? tgFirst.title + ' (2x)' : tgFirst.title;
      toggleLeft.innerHTML = '<div style="font-weight:600;font-size:0.88rem">' + formatDateLabel(s.date) + '</div><div style="font-size:0.75rem;color:var(--text2);margin-top:2px">' + tgTitle + ' · <span class=\"tag\" style=\"font-size:0.65rem\">' + tgFirst.phase + '</span></div>';
      const toggleRight = document.createElement('div'); toggleRight.style.cssText = 'text-align:right;margin-right:10px';
      toggleRight.innerHTML = '<div style="font-size:0.85rem;font-weight:700;color:' + rpeColor(parseFloat(pastAvg)) + '">' + pastAvg + '</div><div style="font-size:0.65rem;color:var(--text2)">' + pastResponses.length + '/' + athletes.length + '</div>';
      const toggleArrow = document.createElement('span'); toggleArrow.style.color = 'var(--text2)'; toggleArrow.textContent = S.rpeHistOpen[s.date] ? '\u25b2' : '\u25bc';
      toggleInner.append(toggleLeft, toggleRight, toggleArrow);
      toggle.appendChild(toggleInner);
      toggle.onclick = () => { S.rpeHistOpen[s.date] = !S.rpeHistOpen[s.date]; render(); };
      wrapper.appendChild(toggle);

      if (S.rpeHistOpen[s.date]) {
        const body = document.createElement('div'); body.className = 'hist-date-body open';

        // mini summary
        const miniSum = document.createElement('div'); miniSum.className = 'summary-row'; miniSum.style.cssText = 'margin-bottom:10px;margin-top:4px';
        const objStr = daySlots(s.data).map(function(sl){ return sl.sess.targetRPE; }).join('/') || '—';
        [{val: pastAvg, lbl:'RPE Medio'},{val: objStr, lbl:'Objetivo'},{val: pastResponses.length + '/' + athletes.length, lbl:'Respuestas'}].forEach(function(item) {
          const box = document.createElement('div'); box.className = 'summary-box';
          box.innerHTML = '<div class=\"summary-val\" style=\"font-size:1.1rem\">' + item.val + '</div><div class=\"summary-lbl\">' + item.lbl + '</div>';
          miniSum.appendChild(box);
        });
        body.appendChild(miniSum);

        const tblH = document.createElement('table'); tblH.className = 'rpe-table';
        tblH.innerHTML = '<thead><tr><th>Atleta</th><th>RPE</th><th>Estado</th><th>\u0394</th><th></th></tr></thead>';
        const tbodyH = document.createElement('tbody');
        athletes.forEach(function(name) {
          const entry = dayRPEHist[name];
          const tr = document.createElement('tr');
          const ns = name.split(' ')[0];
          if (entry) {
            const subs = rpeSubmissions(entry);
            const slotMap2 = normDay(s.data) || {};
            const circles = subs.map(function(sub) {
              return '<div class=\"rpe-circle\" style=\"background:' + rpeColor(sub.data.rpe) + ';width:26px;height:26px;font-size:0.75rem;display:inline-flex;margin-right:3px\">' + sub.data.rpe + '</div>';
            }).join('');
            const lastE = subs[subs.length-1].data;
            const fat = FATIGUE.find(function(f) { return f.v === lastE.fatigue; }) || FATIGUE[0];
            let ds2 = 0, dc2 = 0;
            subs.forEach(function(sub) {
              const t2 = slotMap2[sub.slot] ? slotMap2[sub.slot].targetRPE : null;
              if (t2) { ds2 += sub.data.rpe - t2; dc2++; }
            });
            const delta = dc2 > 0 ? Math.round(ds2/dc2) : 0;
            const deltaStr = delta > 0 ? '+'+delta : delta < 0 ? ''+delta : '=';
            const deltaClass = delta > 0 ? 'plus' : delta < 0 ? 'minus' : '';
            const hasComment = !!getComments()[s.date+'_'+name];
            const noteHtml = lastE.note ? '<div style=\"font-size:0.7rem;color:var(--text2);font-style:italic\">\"' + lastE.note + '\"</div>' : '';
            tr.innerHTML = '<td>' + ns + noteHtml + '</td><td>' + circles + '</td><td><span class=\"fatigue-label\" style=\"background:' + fat.color + '22;color:' + fat.color + ';font-size:0.7rem\">' + fat.label + '</span></td><td><span class=\"delta ' + deltaClass + '\">' + deltaStr + '</span></td><td><button class=\"comment-btn\" data-ath=\"' + name + '\" data-date=\"' + s.date + '\">' + (hasComment ? '\ud83d\udcac' : '\u270f\ufe0f') + '</button></td>';
          } else {
            tr.innerHTML = '<td>' + ns + '</td><td colspan=\"3\" style=\"color:var(--text2);font-size:0.78rem\">Sin respuesta</td><td></td>';
          }
          tbodyH.appendChild(tr);
        });
        tblH.appendChild(tbodyH);
        body.appendChild(tblH);
        wrapper.appendChild(body);
      }
      d.appendChild(wrapper);
    });
  }

  // Event delegation for ALL comment buttons (today + history)
  d.addEventListener('click', function(e) {
    const btn = e.target.closest('.comment-btn');
    if (!btn) return;
    const dateKey = btn.dataset.date || today;
    S.commentAthlete = btn.dataset.ath;
    S.commentDate = dateKey;
    S.commentText = getComments()[dateKey + '_' + btn.dataset.ath] || '';
    render();
  });

  return d;
}

// ============================================================
// CALENDAR (shared)
// ============================================================
function buildCalendar() {
  const isCoach = S.role === 'coach';
  const d = document.createElement('div');
  const today = new Date();
  const year = S.calYear, month = S.calMonth;
  const competitions = getCompetitions();

  // Header
  const ch = document.createElement('div'); ch.className = 'cal-header';
  const prev = document.createElement('button'); prev.className = 'cal-nav'; prev.textContent = '‹';
  prev.onclick = () => { S.calMonth--; if(S.calMonth<0){S.calMonth=11;S.calYear--;} render(); };
  const mnth = document.createElement('span');
  mnth.style.cssText = 'font-weight:700;font-size:1rem;color:var(--text);';
  mnth.textContent = MONTHS_ES[month] + ' ' + year;
  const next = document.createElement('button'); next.className = 'cal-nav'; next.textContent = '›';
  next.onclick = () => { S.calMonth++; if(S.calMonth>11){S.calMonth=0;S.calYear++;} render(); };
  ch.append(prev, mnth, next);
  d.appendChild(ch);

  // Grid
  const grid = document.createElement('div'); grid.className = 'cal-grid';
  ['L','M','X','J','V','S','D'].forEach(d2 => {
    const dh = document.createElement('div'); dh.className = 'cal-dh'; dh.textContent = d2; grid.appendChild(dh);
  });

  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const startOffset = firstDay === 0 ? 6 : firstDay - 1;
  const prevMonthDays = new Date(year, month, 0).getDate();

  // Build date sets
  const sessKeys = new Set();
  try { for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&k.startsWith('tn:session:')) sessKeys.add(k.replace('tn:session:','')); } } catch(e) {}

  const compDates = new Map();
  competitions.forEach(c => {
    const start = new Date(c.start+'T12:00:00'), end = new Date(c.end+'T12:00:00');
    for (let dt = new Date(start); dt <= end; dt.setDate(dt.getDate()+1)) {
      const ds = dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
      compDates.set(ds, c.type);
    }
  });

  for (let i = 0; i < startOffset; i++) {
    const cell = document.createElement('div'); cell.className = 'cal-day other-month';
    cell.textContent = prevMonthDays - startOffset + i + 1; grid.appendChild(cell);
  }
  for (let day = 1; day <= daysInMonth; day++) {
    const ds = year+'-'+String(month+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
    const cell = document.createElement('div'); cell.className = 'cal-day';
    cell.textContent = day;
    if (year===today.getFullYear()&&month===today.getMonth()&&day===today.getDate()) cell.classList.add('today');
    if (compDates.has(ds)) {
      const cc = compColor(compDates.get(ds));
      cell.style.background = cc + '33';
      cell.style.color = cc;
      cell.style.fontWeight = '700';
      cell.style.border = '1px solid ' + cc + '88';
    }
    else if (sessKeys.has(ds)) cell.classList.add('has-session');
    grid.appendChild(cell);
  }
  const remaining = 42 - startOffset - daysInMonth;
  for (let i = 1; i <= remaining && remaining < 14; i++) {
    const cell = document.createElement('div'); cell.className = 'cal-day other-month'; cell.textContent = i; grid.appendChild(cell);
  }
  d.appendChild(grid);

  // Legend
  const leg = document.createElement('div'); leg.style.cssText='display:flex;gap:10px;margin:10px 0;font-size:0.68rem;color:var(--text2);flex-wrap:wrap';
  let legHtml = '<span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent2);margin-right:4px"></span>Sesión</span>';
  COMP_TYPES.forEach(function(t) {
    legHtml += '<span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:' + compColor(t) + ';margin-right:4px"></span>' + t + '</span>';
  });
  leg.innerHTML = legHtml;
  d.appendChild(leg);

  // Month competitions
  const monthComps = competitions.filter(c => {
    const s = new Date(c.start+'T12:00:00'), e = new Date(c.end+'T12:00:00');
    return (s.getFullYear()===year&&s.getMonth()===month)||(e.getFullYear()===year&&e.getMonth()===month);
  });
  if (monthComps.length > 0) {
    const st2 = document.createElement('div'); st2.className = 'section-title'; st2.style.marginTop='16px'; st2.textContent = 'COMPETICIONES';
    d.appendChild(st2);
    const compsContainer = document.createElement('div'); compsContainer.className = 'comps-container'; d.appendChild(compsContainer);
    compsContainer.addEventListener('click', function(e) {
      const btn = e.target.closest('.comp-del');
      if (!btn) return;
      const idx2 = parseInt(btn.dataset.idx);
      const comp2 = DATA.competitions[idx2];
      if (comp2) dbDeleteCompetition(comp2.id).then(function() { renderAsync(); });
    });
    monthComps.forEach((c, compIdx) => {
      const ci = document.createElement('div'); ci.className = 'comp-item';
      ci.style.borderColor = compColor(c.type) + '66';
      ci.style.background = compColor(c.type) + '14';
      const mapsUrl = c.location
        ? 'https://maps.apple.com/?q=' + encodeURIComponent(c.location)
        : null;
      const mapSquare = c.location
        ? '<a href="' + mapsUrl + '" target="_blank" style="flex-shrink:0;align-self:stretch;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:96px;background:#1a3a6b;border:none;border-left:1px solid rgba(192,57,43,0.3);border-radius:0 7px 7px 0;text-decoration:none;padding:0 8px;margin:-10px -14px -10px 8px">'
          + '<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#e74c3c\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z\"></path><circle cx=\"12\" cy=\"10\" r=\"3\"></circle></svg>'
          + '<span style="font-size:0.6rem;color:var(--accent2);font-weight:700;text-align:center;line-height:1.3">Abrir<br>Maps</span>'
          + '</a>'
        : '';
      ci.innerHTML =
        '<div style="display:flex;align-items:stretch;gap:0">'
        + '<div style="flex:1;min-width:0">'
        + '<div class="comp-name">' + c.name + '</div>'
        + '<div class="comp-sub">' + formatDateLabel(c.start) + ' → ' + formatDateLabel(c.end) + '</div>'
        + (c.location ? '<div class="comp-sub" style="margin-top:2px">' + c.location + '</div>' : '')
        + '<div style="margin-top:8px;display:flex;align-items:center;gap:8px">'
        + '<span class="comp-badge" style="background:' + compColor(c.type) + '33;color:' + compColor(c.type) + '">' + c.type + '</span>'
        + (isCoach ? '<button class="btn-del comp-del" data-idx="' + getCompetitions().indexOf(c) + '" style="padding:4px 10px">✕</button>' : '')
        + '</div>'
        + '</div>'
        + mapSquare
        + '</div>';

      (typeof compsContainer !== 'undefined' ? compsContainer : d).appendChild(ci);
    });
  }

  // Add competition form (coach only)
  if (isCoach) {
    const st3 = document.createElement('div'); st3.className = 'section-title'; st3.style.marginTop='20px'; st3.textContent = 'AÑADIR COMPETICIÓN';
    d.appendChild(st3);
    const form = document.createElement('div'); form.className = 'card';

    const fields = [
      {label:'Nombre',type:'text',id:'comp-name'},
      {label:'Fecha inicio',type:'date',id:'comp-start'},
      {label:'Fecha fin',type:'date',id:'comp-end'},
      {label:'Lugar',type:'text',id:'comp-loc'}
    ];
    fields.forEach(f => {
      const lbl = document.createElement('label'); lbl.className = 'field-label'; lbl.textContent = f.label; form.appendChild(lbl);
      const inp = document.createElement('input'); inp.type = f.type; inp.id = f.id; form.appendChild(inp);
    });
    const lbl2 = document.createElement('label'); lbl2.className = 'field-label'; lbl2.textContent = 'Tipo'; form.appendChild(lbl2);
    const typeSelect = document.createElement('select'); typeSelect.id = 'comp-type';
    COMP_TYPES.forEach(t => { const o = document.createElement('option'); o.value=t; o.textContent=t; typeSelect.appendChild(o); });
    form.appendChild(typeSelect);

    const addBtn = document.createElement('button'); addBtn.className = 'btn btn-danger'; addBtn.style.marginTop='14px'; addBtn.textContent = 'Añadir competición';
    addBtn.onclick = function() {
      const name = (document.getElementById('comp-name') || {}).value || '';
      const start = (document.getElementById('comp-start') || {}).value || '';
      const end = (document.getElementById('comp-end') || {}).value || '';
      const loc = (document.getElementById('comp-loc') || {}).value || '';
      const type = (document.getElementById('comp-type') || {}).value || 'Regional';
      if (!name.trim() || !start) {
        this.textContent = '⚠ Falta nombre o fecha inicio';
        const btn = this;
        setTimeout(function() { btn.textContent = 'Añadir competición'; }, 2000);
        return;
      }
      dbAddCompetition({ name: name.trim(), start: start, end: end || start, location: loc.trim(), type: type }).then(function() {
        renderAsync();
      });
    };
    form.appendChild(addBtn);
    d.appendChild(form);
  }
  return d;
}

// ============================================================
// COACH: HISTORIAL
// ============================================================
function buildCoachHistorial() {
  const d = document.createElement('div');
  const st = document.createElement('div'); st.className = 'section-title'; st.textContent = 'HISTORIAL DE SESIONES';
  d.appendChild(st);

  // Mes activo del historial (por defecto, el actual)
  if (!S.histMonth) { const n = new Date(); S.histMonth = n.getFullYear() + '-' + String(n.getMonth()+1).padStart(2,'0'); }

  // Selector de mes ‹ Junio 2026 ›
  const nav = document.createElement('div');
  nav.style.cssText = 'display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:6px;margin-bottom:14px';
  const mkNav = function(txt) { const b = document.createElement('button'); b.textContent = txt; b.style.cssText = 'background:var(--surface2);border:1px solid var(--border);color:var(--text2);width:40px;height:40px;border-radius:9px;font-size:1.1rem;cursor:pointer'; return b; };
  const prevB = mkNav('‹'), nextB = mkNav('›');
  const [hy, hm] = S.histMonth.split('-').map(Number);
  const lbl = document.createElement('span');
  lbl.style.cssText = 'font-weight:700;color:var(--text)';
  lbl.textContent = MONTHS_ES[hm-1] + ' ' + hy;
  const shiftMonth = function(delta) {
    let y = hy, m = hm - 1 + delta;
    if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; }
    S.histMonth = y + '-' + String(m+1).padStart(2,'0');
  };
  prevB.onclick = function() {
    shiftMonth(-1);
    const ym = S.histMonth;
    if (!_loadedMonths[ym]) { prevB.textContent = '…'; dbLoadSessionMonth(ym).then(render); } else render();
  };
  const nowYM = new Date().getFullYear() + '-' + String(new Date().getMonth()+1).padStart(2,'0');
  nextB.disabled = (S.histMonth >= nowYM);
  if (nextB.disabled) nextB.style.opacity = '0.3';
  nextB.onclick = function() {
    shiftMonth(1);
    const ym = S.histMonth;
    if (!_loadedMonths[ym]) { nextB.textContent = '…'; dbLoadSessionMonth(ym).then(render); } else render();
  };
  nav.append(prevB, lbl, nextB);
  d.appendChild(nav);

  // Filtrar sesiones del mes activo
  const sessions = getAllSessions().filter(function(s){ return s.date.slice(0,7) === S.histMonth; });
  if (sessions.length === 0) {
    const e = document.createElement('div'); e.className = 'empty-state';
    e.textContent = _loadedMonths[S.histMonth] ? 'No hay sesiones este mes' : 'Cargando…';
    d.appendChild(e); return d;
  }

  sessions.forEach(function(s) {
    const dt = dateObj(s.date);
    const hdrSlots = daySlots(s.data);
    const first = hdrSlots.length > 0 ? hdrSlots[0].sess : { title: 'Sin título', phase: '—' };

    const row = document.createElement('div'); row.className = 'hist-row';

    // Header
    const header = document.createElement('div'); header.className = 'hist-header';
    const dateBlock = document.createElement('div'); dateBlock.className = 'hist-date-block';
    dateBlock.innerHTML = '<div class="hist-day-name">' + DAYS_ES[dt.getDay()] + '</div><div class="hist-day-num">' + dt.getDate() + '</div><div class="hist-month">' + MONTHS_ES[dt.getMonth()].substring(0,3) + '</div>';
    const info = document.createElement('div'); info.className = 'hist-info';
    const titleStr = hdrSlots.length > 1
      ? first.title + ' <span style="font-size:0.7rem;color:var(--gold);font-weight:700">+ ' + hdrSlots[1].sess.title + ' (2x)</span>'
      : (first.title || 'Sin título');
    const targetStr = hdrSlots.map(function(sl){ return sl.sess.targetRPE; }).join(' / ') || '—';
    info.innerHTML = '<div class="hist-title">' + titleStr + '</div><div class="hist-meta"><span class="tag">' + first.phase + '</span>' + (first.alphaPhase ? '<span class="tag">' + first.alphaPhase + '</span>' : '') + '<span>RPE obj: ' + targetStr + '</span></div>';
    const arrow = document.createElement('span'); arrow.style.color = 'var(--text2)'; arrow.textContent = S.histSessionOpen[s.date] ? '▲' : '▼';

    // Botón borrar entreno (solo coach)
    const delBtn = document.createElement('button');
    delBtn.className = 'sess-del-btn';
    delBtn.innerHTML = '🗑';
    delBtn.title = 'Borrar entreno';
    delBtn.onclick = function(ev) {
      ev.stopPropagation();
      const label = DAYS_ES[dt.getDay()] + ' ' + dt.getDate() + ' ' + MONTHS_ES[dt.getMonth()].substring(0,3);
      showConfirm('¿Borrar el entreno del ' + label + '?', 'Se eliminará la sesión completa (mañana y tarde si las hay). No se puede deshacer.', function() {
        delBtn.disabled = true; delBtn.innerHTML = '…';
        dbDeleteSession(s.date).then(function() {
          delete S.histSessionOpen[s.date];
          // quitar de la caché en memoria sin refetch (preserva meses cargados)
          _allSessionsCache = (_allSessionsCache || []).filter(function(x){ return x.date !== s.date; });
          DATA.allSessions = _allSessionsCache;
          DATA.sessions = {}; _allSessionsCache.forEach(function(x){ DATA.sessions[x.date] = x.data; });
          render();
        });
      });
    };

    header.append(dateBlock, info, delBtn, arrow);
    header.onclick = function() { S.histSessionOpen[s.date] = !S.histSessionOpen[s.date]; render(); };
    row.appendChild(header);

    if (S.histSessionOpen[s.date]) {
      const body = document.createElement('div'); body.className = 'hist-body open';

      const histSlots = daySlots(s.data);
      histSlots.forEach(function(slotObj, si) {
        const sess2 = slotObj.sess;
        if (histSlots.length > 1) {
          const sh = document.createElement('div');
          sh.style.cssText = 'font-size:0.78rem;font-weight:700;color:var(--gold);margin-top:' + (si > 0 ? '16px' : '8px') + ';padding-bottom:4px;border-bottom:1px solid var(--border)';
          sh.textContent = slotObj.label || '☀️ Mañana';
          body.appendChild(sh);
        }
        if (sess2.phase === 'Fuerza') {
          if (sess2.alphaPhase) {
            const apTag = document.createElement('div'); apTag.style.marginBottom = '10px';
            apTag.innerHTML = '<span class="tag" style="font-size:0.75rem">' + sess2.alphaPhase + '</span>';
            body.appendChild(apTag);
          }
          [['Pull', sess2.pullText], ['Push', sess2.pushText], ['Lower Body', sess2.lowerText]].forEach(function(pair) {
            if (!pair[1]) return;
            const sec = document.createElement('div'); sec.className = 'session-section';
            sec.innerHTML = '<div class="section-lbl">' + pair[0] + '</div><div class="session-lines">' + renderTextWithNotes(pair[1]) + '</div>';
            body.appendChild(sec);
          });
        } else {
          var tm = 0;
          [['Warm Up', sess2.warmUp], ['Pre Set', sess2.preSet], ['Main Set', sess2.mainSet], ['Cool Down', sess2.coolDown]].forEach(function(pair) {
            if (!pair[1]) return;
            const m = parseMeters(pair[1]);
            if (m) tm += m;
            const sec = document.createElement('div'); sec.className = 'session-section';
            sec.innerHTML = '<div class="section-lbl">' + pair[0] + (m ? ' <span style=\"color:var(--accent2);font-weight:normal\">(' + m + ' m)</span>' : '') + '</div><div class="session-lines">' + renderTextWithNotes(pair[1]) + '</div>';
            body.appendChild(sec);
          });
          if (tm > 0) {
            const tmDiv = document.createElement('div'); tmDiv.className = 'total-meters'; tmDiv.style.marginTop = '10px';
            tmDiv.innerHTML = '<span>Total' + (histSlots.length > 1 ? ' ' + slotObj.slot.toUpperCase() : ' sesión') + '</span><span style="font-weight:700;color:var(--accent2)">' + tm + ' m</span>';
            body.appendChild(tmDiv);
          }
        }
      });
      row.appendChild(body);
    }
    d.appendChild(row);
  });
  return d;
}

// ATHLETE: INICIO
// ============================================================
function buildAthleteInicio() {
  const d = document.createElement('div');
  const today = new Date();
  const todayS = todayStr();

  // Welcome card
  const wc = document.createElement('div'); wc.className = 'welcome-card';
  wc.innerHTML = `<div class="welcome-name">👋 ${S.athleteName.split(' ')[0]}</div><div class="welcome-date">${DAYS_ES[today.getDay()]}, ${today.getDate()} de ${MONTHS_ES[today.getMonth()]} ${today.getFullYear()}</div>`;
  d.appendChild(wc);

  // Coach message
  const comments = getComments();
  const todayComment = comments[todayS + '_' + S.athleteName];
  if (todayComment) {
    const cm = document.createElement('div'); cm.className = 'coach-msg';
    cm.innerHTML = `<div class="coach-msg-lbl">💬 Mensaje del entrenador</div><div style="font-size:0.9rem">${todayComment}</div>`;
    d.appendChild(cm);
  }

  // Competition alert
  const competitions = getCompetitions();
  const upcoming = competitions.filter(c => {
    const diff = Math.ceil((dateObj(c.start) - today) / 86400000);
    return diff >= 0 && diff <= 10;
  }).sort((a,b) => a.start.localeCompare(b.start));
  if (upcoming.length > 0) {
    upcoming.forEach(c => {
      const diff = Math.ceil((dateObj(c.start) - today) / 86400000);
      const label = diff === 0 ? '¡HOY!' : diff === 1 ? '¡MAÑANA!' : `En ${diff} días`;
      const al = document.createElement('div'); al.className = 'alert-comp';
      al.innerHTML = `<div class="alert-comp-lbl">🏆 COMPETICIÓN PRÓXIMA</div><div style="font-weight:700">${c.name}</div><div style="font-size:0.85rem;color:var(--red2);font-weight:700;margin-top:4px">${label}</div>`;
      d.appendChild(al);
    });
  }

  // Current week sessions
  const weekSt = document.createElement('div'); weekSt.className = 'section-title'; weekSt.textContent = 'SEMANA ACTUAL';
  d.appendChild(weekSt);

  const mondayOffset = today.getDay() === 0 ? -6 : 1 - today.getDay();
  for (let i = 0; i < 7; i++) {
    const dt = new Date(today); dt.setDate(today.getDate() + mondayOffset + i);
    const ds = dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
    const session = getSession(ds);
    const isPast = ds < todayS;
    const isToday = ds === todayS;
    const isFuture = ds > todayS;

    if (isPast && !session) continue; // hidden

    const dc = document.createElement('div'); dc.className = 'day-card' + (isToday ? ' today-card' : '');
    const slots = daySlots(session);
    if (isFuture && slots.length === 0) dc.classList.add('greyed');

    const titles = slots.length > 0 ? slots.map(function(s){ return (s.label ? s.label + ' ' : '') + s.sess.title; }).join(' · ') : 'Sin sesión';
    const dch = document.createElement('div'); dch.className = 'day-card-header';
    dch.innerHTML = `<div><div class="day-name">${DAYS_ES[dt.getDay()]} ${dt.getDate()}${slots.length > 1 ? ' <span style="font-size:0.65rem;color:var(--gold);font-weight:700">2x</span>' : ''}</div><div class="day-phase">${titles}</div></div>`;
    if (slots.length > 0) {
      const tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = slots[0].sess.phase;
      dch.appendChild(tag);
    }
    dch.onclick = () => {
      if (slots.length === 0) return;
      S.dayCardOpen[ds] = !S.dayCardOpen[ds]; render();
    };
    dc.appendChild(dch);

    if (slots.length > 0 && S.dayCardOpen[ds]) {
      const body = document.createElement('div'); body.className = 'day-card-body open';
      slots.forEach(function(slotObj, slotIdx) {
        const sess = slotObj.sess;
        if (slots.length > 1) {
          const slotHdr = document.createElement('div');
          slotHdr.style.cssText = 'font-size:0.78rem;font-weight:700;color:var(--gold);margin-top:' + (slotIdx > 0 ? '16px' : '10px') + ';padding-bottom:4px;border-bottom:1px solid var(--border)';
          slotHdr.textContent = slotObj.label || '☀️ Mañana';
          body.appendChild(slotHdr);
        }
        if (sess.phase === 'Fuerza') {
          if (sess.alphaPhase) { const ap = document.createElement('div'); ap.innerHTML = '<span class="tag" style="margin-bottom:8px">' + sess.alphaPhase + '</span>'; body.appendChild(ap); }
          [['Pull',sess.pullText],['Push',sess.pushText],['Lower Body',sess.lowerText]].forEach(function(pair) {
            if (pair[1]) {
              const ss = document.createElement('div'); ss.className = 'session-section';
              ss.innerHTML = '<div class="section-lbl">' + pair[0] + '</div><div class="session-lines">' + renderTextWithNotes(pair[1]) + '</div>';
              body.appendChild(ss);
            }
          });
        } else {
          [['Warm Up',sess.warmUp],['Pre Set',sess.preSet],['Main Set',sess.mainSet],['Cool Down',sess.coolDown]].forEach(function(pair) {
            if (pair[1]) {
              const ss = document.createElement('div'); ss.className = 'session-section';
              ss.innerHTML = '<div class="section-lbl">' + pair[0] + '</div><div class="session-lines">' + renderTextWithNotes(pair[1]) + '</div>';
              body.appendChild(ss);
            }
          });
          const tm = totalMeters(sess);
          if (tm > 0) { const t = document.createElement('div'); t.className='total-meters';t.style.marginTop='10px';t.innerHTML='<span>Total' + (slots.length > 1 ? ' ' + slotObj.slot.toUpperCase() : '') + '</span><span style="font-weight:700;color:var(--accent2)">' + tm + ' m</span>';body.appendChild(t); }
        }
      });
      dc.appendChild(body);
    }
    d.appendChild(dc);
  }
  return d;
}

// ATHLETE: MI RPE
// ============================================================
function buildAthleteRPE() {
  const d = document.createElement('div');
  const today = todayStr();
  const rawSession = getSession(today);
  const slots = daySlots(rawSession);
  const double = slots.length > 1;

  // Determine active slot: S.rpeSlot ('am'|'pm'), default first un-submitted
  const entry = normRPE(getDayRPE(today)[S.athleteName]);
  if (!S.rpeSlot || !double) {
    if (double) {
      S.rpeSlot = (entry && entry.am) ? 'pm' : 'am';
    } else {
      S.rpeSlot = 'am';
    }
  }

  // Session info card
  const sessionCard = document.createElement('div'); sessionCard.className = 'card'; sessionCard.style.marginBottom='16px';
  if (slots.length > 0) {
    sessionCard.innerHTML = slots.map(function(s) {
      return '<div class="card-title">' + (s.label ? s.label + ' — ' : '') + s.sess.title + '</div>'
        + '<div class="card-sub">RPE objetivo: <strong>' + s.sess.targetRPE + '</strong></div>';
    }).join('<div style="height:6px"></div>');
  } else {
    sessionCard.innerHTML = '<div class="card-sub" style="text-align:center">Sin sesión para hoy</div>';
  }
  d.appendChild(sessionCard);

  // Slot tabs for double days
  if (double) {
    const slotTabs = document.createElement('div'); slotTabs.className = 'pack-toggle'; slotTabs.style.marginBottom = '14px';
    [['am','☀️ Mañana'],['pm','🌙 Tarde']].forEach(function(pair) {
      const done = entry && entry[pair[0]];
      const btn = document.createElement('button');
      btn.className = 'pack-btn' + (S.rpeSlot === pair[0] ? ' active' : '');
      btn.innerHTML = pair[1] + (done ? ' ✓' : '');
      btn.onclick = function() { S.rpeSlot = pair[0]; S.rpeSelected = null; S.fatigueSelected = null; S.rpeNote = ''; render(); };
      slotTabs.appendChild(btn);
    });
    d.appendChild(slotTabs);
  }

  // Already submitted this slot?
  const slotEntry = entry ? entry[double ? S.rpeSlot : 'am'] : null;
  if (slotEntry) {
    const fat = FATIGUE.find(function(f){return f.v===slotEntry.fatigue;}) || FATIGUE[0];
    const cs = document.createElement('div'); cs.className = 'confirm-screen';
    cs.innerHTML = '<div class="confirm-emoji">✅</div><div class="confirm-rpe" style="color:' + rpeColor(slotEntry.rpe) + '">' + slotEntry.rpe + '</div><div class="confirm-label">RPE registrado · <span style="color:' + fat.color + '">' + fat.label + '</span></div><div style="margin-top:20px;font-size:0.8rem;color:var(--text2)">Ya registraste tu RPE' + (double ? ' de este turno' : ' hoy') + '</div>';
    d.appendChild(cs);
    return d;
  }

  if (S.rpeSubmitted) {
    const fat = FATIGUE.find(function(f){return f.v===S.fatigueSelected;}) || FATIGUE[0];
    const cs = document.createElement('div'); cs.className = 'confirm-screen';
    cs.innerHTML = '<div class="confirm-emoji">🎯</div><div class="confirm-rpe" style="color:' + rpeColor(S.rpeSelected) + '">' + S.rpeSelected + '</div><div class="confirm-label">Registrado · <span style="color:' + fat.color + '">' + fat.label + '</span></div>';
    d.appendChild(cs);
    S.rpeSubmitted = false;
    return d;
  }

  // RPE selector
  const st1 = document.createElement('div'); st1.className = 'section-title'; st1.textContent = '¿CÓMO FUE EL ESFUERZO?';
  d.appendChild(st1);
  const rpeGrid = document.createElement('div'); rpeGrid.className = 'rpe-grid';
  for (let v = 1; v <= 10; v++) {
    const btn = document.createElement('button'); btn.className = 'rpe-btn' + (S.rpeSelected===v?' selected':'');
    btn.textContent = v; btn.style.background = rpeColor(v); btn.style.color = '#fff';
    btn.onclick = () => { S.rpeSelected = v; render(); };
    rpeGrid.appendChild(btn);
  }
  d.appendChild(rpeGrid);

  // Fatigue
  const st2 = document.createElement('div'); st2.className = 'section-title'; st2.style.marginTop='20px'; st2.textContent = '¿CÓMO ESTÁS?';
  d.appendChild(st2);
  const fatGrid = document.createElement('div'); fatGrid.className = 'fatigue-grid';
  FATIGUE.forEach(f => {
    const btn = document.createElement('button'); btn.className = 'fatigue-btn' + (S.fatigueSelected===f.v?' selected':'');
    btn.textContent = f.label; btn.style.background = f.color + '33'; btn.style.borderColor = S.fatigueSelected===f.v ? f.color : 'transparent';
    btn.style.color = f.color;
    btn.onclick = () => { S.fatigueSelected = f.v; render(); };
    fatGrid.appendChild(btn);
  });
  d.appendChild(fatGrid);

  // Note
  const noteLbl = document.createElement('label'); noteLbl.className = 'field-label'; noteLbl.style.marginTop='16px'; noteLbl.textContent = 'Nota (opcional)';
  d.appendChild(noteLbl);
  const noteIn = document.createElement('input'); noteIn.type='text'; noteIn.placeholder='¿Algo que destacar?'; noteIn.value=S.rpeNote;
  noteIn.oninput = e => { S.rpeNote = e.target.value; };
  d.appendChild(noteIn);

  // Submit
  const submitBtn = document.createElement('button'); submitBtn.className='btn btn-primary'; submitBtn.style.marginTop='20px';
  submitBtn.textContent = 'Registrar RPE' + (double ? (S.rpeSlot === 'am' ? ' (Mañana)' : ' (Tarde)') : '');
  submitBtn.onclick = () => {
    if (!S.rpeSelected || !S.fatigueSelected) {
      alert('Selecciona RPE y estado de fatiga'); return;
    }
    const slotKey = double ? S.rpeSlot : 'am';
    dbSaveRPE(today, slotKey, S.athleteName, S.rpeSelected, S.fatigueSelected, S.rpeNote).then(function() {
      S.rpeSubmitted = true;
      renderAsync();
    });
  };
  d.appendChild(submitBtn);
  return d;
}

// ============================================================
// ATHLETE: STATS
// ============================================================
function buildAthleteStats() {
  const d = document.createElement('div');
  const hist = DATA.athleteHist[S.athleteName] || [];
  const st = document.createElement('div'); st.className = 'section-title'; st.textContent = 'MI TEMPORADA';
  d.appendChild(st);

  const avgRPE = hist.length > 0 ? (hist.reduce((s,h)=>s+h.rpe,0)/hist.length).toFixed(1) : '—';
  const avgFat = hist.length > 0 ? (hist.reduce((s,h)=>s+h.fatigue,0)/hist.length).toFixed(1) : '—';

  const sr = document.createElement('div'); sr.className = 'stat-row';
  [{val:hist.length,lbl:'Sesiones'},{val:avgRPE,lbl:'RPE Medio'},{val:avgFat,lbl:'Fatiga Media'}].forEach(item => {
    const b = document.createElement('div'); b.className='stat-box';
    b.innerHTML=`<div class="stat-val">${item.val}</div><div class="stat-lbl">${item.lbl}</div>`;
    sr.appendChild(b);
  });
  d.appendChild(sr);

  // SVG line chart last 14
  const last14 = hist.slice(-14);
  if (last14.length > 1) {
    const st2 = document.createElement('div'); st2.className='section-title'; st2.style.marginTop='20px'; st2.textContent='ÚLTIMAS 14 SESIONES — RPE';
    d.appendChild(st2);

    const W = 320, H = 160, PAD = { top:16, right:16, bottom:28, left:28 };
    const iW = W - PAD.left - PAD.right;
    const iH = H - PAD.top - PAD.bottom;
    const n = last14.length;
    const xPos = i => PAD.left + (i / (n - 1)) * iW;
    const yPos = v => PAD.top + iH - ((v - 1) / 9) * iH;

    // gradient stops under curve
    const gradStops = last14.map((h, i) => {
      const pct = Math.round((i / (n - 1)) * 100);
      return '<stop offset="' + pct + '%" stop-color="' + rpeColor(h.rpe) + '" stop-opacity="0.4"/>';
    }).join('');

    // Build shared cubic bezier path (reused for both stroke and fill)
    function buildCurvePath(pts, close) {
      let d = 'M' + pts[0].x + ' ' + pts[0].y;
      for (let i = 1; i < pts.length; i++) {
        const cpX = (pts[i-1].x + pts[i].x) / 2;
        d += ' C' + cpX + ' ' + pts[i-1].y + ' ' + cpX + ' ' + pts[i].y + ' ' + pts[i].x + ' ' + pts[i].y;
      }
      if (close) {
        d += ' L' + pts[pts.length-1].x + ' ' + (PAD.top + iH);
        d += ' L' + pts[0].x + ' ' + (PAD.top + iH) + ' Z';
      }
      return d;
    }
    const curvePts = last14.map((h, i) => ({ x: xPos(i), y: yPos(h.rpe) }));
    const areaPath  = buildCurvePath(curvePts, true);
    const strokePath = buildCurvePath(curvePts, false);

    // Y axis labels
    const yLabels = [1,3,5,7,10].map(v =>
      '<text x="' + (PAD.left - 5) + '" y="' + (yPos(v) + 4) + '" font-size="9" fill="#a8bfd4" text-anchor="end">' + v + '</text>'
    ).join('');

    // Y gridlines
    const yGrids = [3,5,7].map(v =>
      '<line x1="' + PAD.left + '" y1="' + yPos(v) + '" x2="' + (PAD.left + iW) + '" y2="' + yPos(v) + '" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>'
    ).join('');

    // X date labels — show every 3rd
    const xLabels = last14.map((h, i) => {
      if (i % 3 !== 0 && i !== n-1) return '';
      const dt = dateObj(h.date);
      const lbl = dt.getDate() + '/' + (dt.getMonth()+1);
      return '<text x="' + xPos(i) + '" y="' + (H - 4) + '" font-size="8" fill="#a8bfd4" text-anchor="middle">' + lbl + '</text>';
    }).join('');

    // Dots with RPE value
    const dots = last14.map((h, i) => {
      const cx = xPos(i), cy = yPos(h.rpe);
      return '<circle cx="' + cx + '" cy="' + cy + '" r="4" fill="' + rpeColor(h.rpe) + '" stroke="var(--bg)" stroke-width="2"/>'
        + '<text x="' + cx + '" y="' + (cy - 8) + '" font-size="9" fill="' + rpeColor(h.rpe) + '" text-anchor="middle" font-weight="700">' + h.rpe + '</text>';
    }).join('');

    const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    svg.setAttribute('width', '100%');
    svg.setAttribute('height', H);
    svg.innerHTML =
      '<defs>'
      + '<linearGradient id="rpeGrad" x1="0%" y1="0%" x2="100%" y2="0%">' + gradStops + '</linearGradient>'
      + '</defs>'
      + yGrids
      + yLabels
      + xLabels
      + '<path d="' + areaPath + '" fill="url(#rpeGrad)"/>'
      + '<path d="' + strokePath + '" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>'
      + dots;

    const card = document.createElement('div'); card.className='card'; card.style.padding='12px 8px';
    card.appendChild(svg);
    d.appendChild(card);
  }
  return d;
}
